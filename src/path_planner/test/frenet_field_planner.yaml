# No-localization field-test parameters. The path_planner core is unchanged.
# Vehicle extents follow the current object_detection self-filter provisional
# geometry (front 2.0 m, rear 0.7 m, +/-0.7 m). Re-measure before competition.
calibration_required: false

frame_id: base_link
planning_rate_hz: 10.0
input_timeout_s: 0.50
future_tolerance_s: 0.05
planning_deadline_ms: 80.0

# Artificial open-field corridor around the vehicle-relative straight line.
road_left_bound_m: 3.0
road_right_bound_m: 3.0

vehicle:
  length_m: 2.70
  width_m: 1.40
  wheelbase_m: 0.75
  rear_axle_to_center_m: 0.65

planner:
  horizon_m: 8.0
  sample_interval_m: 0.10
  lateral_sample_interval_m: 0.25
  maximum_lateral_offset_m: 2.00
  collision_margin_m: 0.15
  boundary_margin_m: 0.10
  maximum_curvature_per_m: 0.48
  maximum_curvature_rate_per_m2: 0.80
  maximum_lateral_slope: 0.80
  minimum_longitudinal_scale: 0.20
  boundary_perimeter_sample_interval_m: 0.10

projection:
  back_window_m: 3.0
  forward_window_m: 15.0
  heading_weight: 2.0
  maximum_pose_distance_m: 0.5
  obstacle_maximum_distance_m: 6.0
  obstacle_station_tolerance_m: 4.0

obstacles:
  topic: /dbscan_clusters
  namespace: dbscan_clusters
  minimum_extent_m: 0.10
  # Current outdoor DBSCAN can form a 5.012 m wall/fence cluster. Keep that
  # observation instead of invalidating the entire 10 Hz heartbeat.
  maximum_extent_m: 6.0
  maximum_count: 100

pose_jump:
  translation_tolerance_m: 0.25
  yaw_tolerance_rad: 0.0872664626
  maximum_speed_mps: 5.0
  maximum_yaw_rate_rad_per_sec: 2.0943951024
  maximum_pose_interval_sec: 0.50
