# RDDF 점 기반 원형 ROI 사용 여부
# false면 RDDF 매칭을 기다리지 않고 LiDAR의 차량 전방 전체를 DBSCAN 입력으로 사용한다.
# 이때도 lidar_forward_roi, angular_roi, self_filter 설정은 그대로 적용된다.
corridor_enabled: true

# RDDF 점을 중심으로 만드는 원형 ROI의 반지름 [m]
# 차선 폭이 약 3.5 m라면 1.75~2.2 m에서 시작해 차량과 연석 포함 범위를 확인한다.
corridor_radius_m: 2.0

# 현재 투영 위치부터 경로 진행 방향으로 미리 볼 거리 [m]
# 구간 끝에서 다음 RDDF까지 ROI가 이어지도록 20~40 m 범위에서 조정한다.
lookahead_m: 30.0

# 차량 투영 위치보다 뒤쪽인 RDDF 중심선도 연결해 둘 거리 [m]
# 위치 판정 지연으로 ROI가 끊기면 1~3 m로 둔다. 실제 LiDAR 점은 아래 조건으로 다시 거른다.
lookbehind_m: 2.0

# 현재 RDDF 판정이 교차점에서 잠깐 모호해져도 마지막 정상 경로를 유지할 시간 [s]
match_hold_sec: 2.0

# LiDAR 시각보다 RDDF pose 시각이 약간 앞설 때 허용하는 오차 [s]
future_tolerance_sec: 0.2

# 현재 경로 뒤에 연결해 탐색할 다음 RDDF 최대 개수
max_successor_depth: 4

# 다음 번호 RDDF의 시작점이 현재 경로와 연결됐다고 판단할 최대 거리 [m]
# 용인 RDDF는 대부분 정확히 맞닿으므로 크게 올리면 잘못된 좌우 경로가 연결될 수 있다.
connection_distance_m: 1.0

# 동적 장애물 구간은 RDDF 원형 ROI 대신 LiDAR 기준 전방 직사각형 ROI를 사용한다.
dynamic_forward_roi:
  route_token: dynamic
  max_forward_m: 4.0
  half_width_m: 0.65

# LiDAR 장착 위치를 기준으로 차량 전방(base_link +X)만 남기는 ROI
# raw scan yaw 보정과 X축 180도 장착 roll을 TF로 적용한 뒤 차량 전방을 사용한다.
lidar_forward_roi:
  enabled: true
  # LiDAR 원점보다 차량 전방으로 이 거리보다 가까운 점은 제거한다.
  min_forward_m: 0.1

# base_link 기준으로 추가 각도 제한이 필요할 때 사용하는 ROI
# 0도는 차량 전방(+X), +90도는 왼쪽(+Y), -90도는 오른쪽(-Y)이다.
angular_roi:
  # 현재는 laser_link X 기준만 사용하므로 각도 제한을 끈다.
  enabled: false
  # 전방 범위를 좁히려면 두 값의 절댓값을 줄인다.
  min_angle_deg: -90.0
  max_angle_deg: 90.0

# base_link 기준 차량 자체 반사 제거 영역
# base_link 원점은 뒷바퀴 축 중심이고 +X 전방, +Y 왼쪽이다.
# 실측 차체 형상(길이 1.35 m, 폭 0.85 m,
# 후륜축에서 차체 중심까지 0.38 m)에 약 2 cm 여유를 더한 영역이다.
# LiDAR는 앞차축 0.75 m보다 0.30 m 앞인 X=1.05 m에 표시된다.
self_filter:
  enabled: true
  # true면 실제 제거 영역을 /object_detection/roi_markers에 빨간 박스로 표시한다.
  visualize: true
  # base_link 원점에서 차량 맨 뒤까지의 거리. 뒤쪽 차량점이 남으면 키운다.
  rear_extent_m: 0.315
  # base_link 원점에서 차량 맨 앞까지의 거리. 앞쪽 차량점이 남으면 키운다.
  front_extent_m: 1.075
  # 차량 오른쪽 폭. RViz에서 오른쪽 차량점이 남으면 키운다.
  right_extent_m: 0.445
  # 차량 왼쪽 폭. RViz에서 왼쪽 차량점이 남으면 키운다.
  left_extent_m: 0.445
