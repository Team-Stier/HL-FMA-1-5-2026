# DBSCAN에서 한 점의 이웃으로 판단할 최대 거리 (단위: m)
# - 값을 키우면 떨어진 점들도 같은 군집으로 합쳐진다.
# - 값을 줄이면 가까운 물체를 분리하기 쉬워지지만 먼 물체가 여러 군집으로 쪼개질 수 있다.
# - 2.bag에서는 0.1부터 시작하고 0.02씩 조정하는 것을 권장한다.
eps: 0.15

# 핵심점으로 인정하는 최소 이웃 점 개수 (현재 점 자신 포함)
# - 값을 키우면 작은 군집과 잡음이 줄지만 점이 적게 잡히는 먼 물체를 놓칠 수 있다.
# - 값을 줄이면 작은 물체도 검출되지만 잡음 군집이 늘어난다.
# - eps를 먼저 맞춘 다음 3~8 범위에서 조정하는 것을 권장한다.
min_samples: 4

# DBSCAN 전에 같은 XY 격자 칸의 점을 하나의 중심점으로 합치는 크기 (단위: m)
# - 0이면 다운샘플링을 끈다.
# - 0.03~0.05는 작은 물체 형상을 비교적 유지하면서 조밀한 중복점을 줄인다.
# - 값을 키우면 빨라지지만 먼 물체나 작은 물체의 점이 너무 적어질 수 있다.
# - 값을 바꾼 뒤에는 min_samples도 함께 확인한다.
voxel_size_m: 0.05

# 검출할 클러스터의 X/Y 방향 최대 길이 (단위: m)
# - 둘 중 한 방향이라도 이 값보다 길면 바닥·벽 반사로 보고 장애물에서 제외한다.
# - 제외된 점은 RViz에서 회색 noise로만 보이며 중심점과 회피 입력에는 포함되지 않는다.
# - 0이면 최대 크기 필터를 끈다.
max_cluster_extent_m: 1.0

# RViz에 표시하는 점의 가로·세로 크기 (단위: m)
# 시각화 크기만 바뀌며 DBSCAN 군집 결과에는 영향을 주지 않는다.
# 점이 잘 안 보이면 키우고, 군집 형태가 뭉쳐 보이면 줄인다.
point_size: 0.08

# 인식된 각 클러스터의 평균 위치에 표시하는 큰 구의 지름 (단위: m)
# 장애물 중심이 너무 크거나 가려 보이면 줄이고, 눈에 잘 안 띄면 키운다.
# 시각화에만 사용되며 DBSCAN 결과에는 영향을 주지 않는다.
centroid_size: 0.35
