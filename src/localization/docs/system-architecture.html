 have_last_candidate_point_ = false;\n  have_last_stamp_ = false;\n  last_stamp_ = ros::Time();\n  last_received_gps_stamp_ = ros::Time();\n  clock_ready_ = false;\n  clock_ready_receipt_ = ros::SteadyTime();\n  recovery_gate_ = ConsecutiveRecoveryGate(recovery_gate_.requiredCount());\n  if (reference_mode_ == \"first_fix\") {\n    datum_ = Datum();\n    reference_lever_arm_ready_ = false;\n  }\n  publish_relocalizing(false);\n  ROS_WARN(\"GPS timing epoch reset: discarded history, pending fixes and anchors\");\n}\n\nbool OdometryGpsFusion::clock_ready_is_fresh() const {\n  if (!require_clock_ready_) return true;\n  if (!clock_ready_ || clock_ready_receipt_.isZero()) return false;\n  const double age = (ros::SteadyTime::now() - clock_ready_receipt_).toSec();\n  return age >= 0.0 && age \u003c= clock_ready_timeout_sec_;\n}\n\nvoid OdometryGpsFusion::clock_ready_callback(const std_msgs::Bool::ConstPtr& message) {\n  observe_clock(ros::Time::now());\n  clock_ready_ = message->data;\n  clock_ready_receipt_ = ros::SteadyTime::now();\n  if (!clock_ready_) {\n    pending_fixes_.clear();\n    recovery_gate_.markUnhealthy();\n    publish_relocalizing(recovery_gate_.recovering());\n  }\n}\n\nvoid OdometryGpsFusion::pending_timer_callback(const ros::WallTimerEvent&) {\n  observe_clock(ros::Time::now());\n  process_pending();\n}\n\nvoid OdometryGpsFusion::process_pending() {\n  if (!initialization_ready_is_fresh()) { pending_fixes_.clear(); return; }\n  if (!clock_ready_is_fresh()) {\n    pending_fixes_.clear();\n    recovery_gate_.markUnhealthy();\n    publish_relocalizing(recovery_gate_.recovering());\n    return;\n  }\n  while (!pending_fixes_.empty()) {\n    const PendingFix pending = pending_fixes_.front();\n    const ros::Time now = ros::Time::now();\n    std::string reason;\n    // An expired or reordered sample cannot reset a healthy measurement anchor.\n    if (!MessageValidation::validateStamp(pending.message->header.stamp, now,\n            max_message_age_sec_, max_future_stamp_sec_, have_last_stamp_, last_stamp_, &reason)) {\n      ROS_WARN_THROTTLE(1.0, \"Discarding queued GPS fix: %s\", reason.c_str());\n      pending_fixes_.pop_front();\n      continue;\n    }\n    nav_msgs::Odometry aligned;\n    const bool local_fresh = local_odometry_is_fresh(now, &reason);\n    const bool supported = local_fresh &&\n        local_history_.sample(pending.message->header.stamp, &aligned, &reason);\n    const double waited = (ros::SteadyTime::now() - pending.receipt).toSec();\n    if (supported && waited \u003c= pending_wait_sec_) {\n      pending_fixes_.pop_front();\n      process_fix(pending.message, aligned);\n      continue;\n    }\n    const bool can_wait = !local_fresh || reason == \"local_history_empty\" ||\n                         reason == \"awaiting_local_odometry\";\n    if (can_wait && waited \u003c= pending_wait_sec_) return;\n    ROS_WARN_THROTTLE(1.0, \"Discarding unsupported GPS fix: %s (wait %.3f s)\",\n                      reason.c_str(), waited);\n    pending_fixes_.pop_front();\n  }\n}\n\nvoid OdometryGpsFusion::local_odometry_callback(\n    const nav_msgs::Odometry::ConstPtr& message) {\n  if (!initialization_ready_is_fresh() ||\n      (initialization_required_ && message->header.stamp \u003c= initialization_stamp_)) return;\n  const ros::Time now = ros::Time::now();\n  observe_clock(now);\n  std::string reason;\n  if (!MessageValidation::validateStamp(message->header.stamp, now,\n          local_history_duration_sec_, max_future_stamp_sec_, false, ros::Time(), &reason) ||\n      !local_history_.append(*message, &reason)) {\n    ROS_WARN_THROTTLE(1.0, \"Rejecting local odometry used by GPS history: %s\", reason.c_str());\n    return;\n  }\n  local_history_.sample(message->header.stamp, &local_odometry_, &reason);\n  local_odometry_receipt_time_ = now;\n  have_local_odometry_ = true;\n  process_pending();\n}\n\nvoid OdometryGpsFusion::reanchor_callback(\n    const mando_localization::GpsGateReanchor::ConstPtr& message) {\n  observe_clock(ros::Time::now());\n  const geometry_msgs::PoseWithCovarianceStamped& pose = message->pose;\n  const auto matching = std::find_if(candidate_history_.begin(), candidate_history_.end(),\n      [&pose](const CandidateRecord& record) { return record.pose.header.stamp == pose.header.stamp; });\n  std::string reason;\n  std::string covariance_reason;\n  const bool covariance_valid = MessageValidation::validateCovariance(\n      pose.pose.covariance.data(), 6, false,\n      std::numeric_limits\u003cdouble>::max(), &covariance_reason);\n  const double candidate_distance = matching != candidate_history_.end()\n      ? std::hypot(\n            pose.pose.pose.position.x -\n                matching->pose.pose.pose.position.x,\n            pose.pose.pose.position.y -\n                matching->pose.pose.pose.position.y)\n      : std::numeric_limits\u003cdouble>::infinity();\n  if (message->transaction_id == 0U || pose.header.stamp.isZero() ||\n      pose.header.frame_id != map_frame_ ||\n      !std::isfinite(pose.pose.pose.position.x) ||\n      !std::isfinite(pose.pose.pose.position.y) ||\n      !std::isfinite(pose.pose.pose.position.z) ||\n      !MessageValidation::finiteQuaternion(pose.pose.pose.orientation) ||\n      !covariance_valid ||\n      !clock_ready_is_fresh() || matching == candidate_history_.end() ||\n      candidate_distance > max_reanchor_candidate_distance_m_ ||\n      !MessageValidation::validateStamp(pose.header.stamp, ros::Time::now(),\n          max_message_age_sec_, max_future_stamp_sec_, false, ros::Time(), &reason) ||\n      !local_odometry_is_fresh(ros::Time::now(), &reason)) {\n    if (reason.empty() && !covariance_valid) {\n      reason = covariance_reason;\n    }\n    ROS_WARN_THROTTLE(1.0, \"Rejecting GPS gate reanchor: %s\",\n                      reason.empty() ? \"invalid_reanchor_pose\" : reason.c_str());\n    return;\n  }\n\n  prediction_anchor_map_.x_m = pose.pose.pose.position.x;\n  prediction_anchor_map_.y_m = pose.pose.pose.position.y;\n  prediction_anchor_map_.z_m = pose.pose.pose.position.z;\n  prediction_anchor_local_odometry_ = matching->local;\n  have_prediction_anchor_ = true;\n  last_candidate_point_ = prediction_anchor_map_;\n  have_last_candidate_point_ = true;\n  if (!have_last_stamp_ || pose.header.stamp > last_stamp_) last_stamp_ = pose.header.stamp;\n  have_last_stamp_ = true;\n  recovery_gate_.forceAccept();\n  publish_relocalizing(false);\n  // Coordinator는 이 적용 확인을 받은 뒤에만 GPS pose를 공개한다.\n  reanchor_accepted_publisher_.publish(*message);\n  ROS_INFO(\"GPS gate prediction anchor was restored by RelocalizationCoordinator\");\n}\n\nbool OdometryGpsFusion::local_odometry_is_fresh(\n    const ros::Time& now, std::string* reason) const {\n  if (!have_local_odometry_ || local_odometry_receipt_time_.isZero()) {\n    *reason = \"local_odometry_not_received\";\n    return false;\n  }\n  const double receipt_age = (now - local_odometry_receipt_time_).toSec();\n  const double stamp_age = (now - local_odometry_.header.stamp).toSec();\n  if (!std::isfinite(receipt_age) || !std::isfinite(stamp_age) ||\n      receipt_age \u003c 0.0 || receipt_age > local_odometry_timeout_sec_ ||\n      stamp_age \u003c -max_future_stamp_sec_ ||\n      stamp_age > local_odometry_timeout_sec_) {\n    *reason = \"local_odometry_stale\";\n    return false;\n  }\n  reason->clear();\n  return true;\n}\n\nbool OdometryGpsFusion::innovation_is_acceptable(\n    const geometry_msgs::PoseWithCovarianceStamped& candidate,\n    const nav_msgs::Odometry& aligned_local,\n    std::string* reason) const {\n  if (!have_prediction_anchor_) {\n    reason->clear();\n    return true;\n  }\n\n  const double local_dx = aligned_local.pose.pose.position.x -\n                          prediction_anchor_local_odometry_.pose.pose.position.x;\n  const double local_dy = aligned_local.pose.pose.position.y -\n                          prediction_anchor_local_odometry_.pose.pose.position.y;\n  const double cosine = std::cos(yaw_offset_rad_);\n  const double sine = std::sin(yaw_offset_rad_);\n  const double predicted_x = prediction_anchor_map_.x_m +\n                             cosine * local_dx - sine * local_dy;\n  const double predicted_y = prediction_anchor_map_.y_m +\n                             sine * local_dx + cosine * local_dy;\n  const double dx = candidate.pose.pose.position.x - predicted_x;\n  const double dy = candidate.pose.pose.position.y - predicted_y;\n  if (std::hypot(dx, dy) > max_position_innovation_m_) {\n    *reason = \"gps_position_innovation_too_large\";\n    return false;\n  }\n\n  const double local_xx = aligned_local.pose.covariance[0];\n  const double local_xy = 0.5 * (aligned_local.pose.covariance[1] +\n                                 aligned_local.pose.covariance[6]);\n  const double local_yy = aligned_local.pose.covariance[7];\n  const double rotated_xx = cosine * cosine * local_xx +\n                            sine * sine * local_yy -\n                            2.0 * sine * cosine * local_xy;\n  const double rotated_yy = sine * sine * local_xx +\n                            cosine * cosine * local_yy +\n                            2.0 * sine * cosine * local_xy;\n  const double rotated_xy = sine * cosine * (local_xx - local_yy) +\n                            (cosine * cosine - sine * sine) * local_xy;\n  const double covariance_xx = candidate.pose.covariance[0] + rotated_xx;\n  const double covariance_xy = candidate.pose.covariance[1] + rotated_xy;\n  const double covariance_yy = candidate.pose.covariance[7] + rotated_yy;\n  const double determinant = covariance_xx * covariance_yy -\n                             covariance_xy * covariance_xy;\n  if (!std::isfinite(determinant) || determinant \u003c= 1.0e-12) {\n    *reason = \"gps_innovation_covariance_invalid\";\n    return false;\n  }\n  const double mahalanobis_squared =\n      (covariance_yy * dx * dx - 2.0 * covariance_xy * dx * dy +\n       covariance_xx * dy * dy) /\n      determinant;\n  if (!std::isfinite(mahalanobis_squared) || mahalanobis_squared \u003c 0.0 ||\n      std::sqrt(mahalanobis_squared) > max_mahalanobis_distance_) {\n    *reason = \"gps_mahalanobis_innovation_too_large\";\n    return false;\n  }\n  reason->clear();\n  return true;\n}\n\nvoid OdometryGpsFusion::publish_relocalizing(const bool relocalizing) {\n  std_msgs::Bool message;\n  message.data = relocalizing;\n  relocalizing_publisher_.publish(message);\n}\n\n// 함수이름: validate_fix\n// 기능: GPS fix 상태, frame, timestamp, WGS84 범위와 covariance를 검사한다.\n// 인자: message, reason\n// 반환값: map pose 후보로 사용할 수 있으면 true\nbool OdometryGpsFusion::validate_fix(const sensor_msgs::NavSatFix& message,\n                                     std::string* reason) const {\n  if (message.status.status \u003c minimum_fix_status_) {\n    *reason = \"gps_no_fix\";\n    return false;\n  }\n  if (message.header.frame_id != gps_frame_) {\n    *reason = \"gps_frame_mismatch\";\n    return false;\n  }\n  if (!MessageValidation::validateStamp(\n          message.header.stamp, ros::Time::now(), max_message_age_sec_,\n          max_future_stamp_sec_, have_last_stamp_, last_stamp_, reason)) {\n    return false;\n  }\n  if (!validLatitudeLongitude(message.latitude, message.longitude) ||\n      !std::isfinite(message.altitude)) {\n    *reason = \"gps_coordinates_invalid\";\n    return false;\n  }\n  double variance_east = 0.0;\n  double covariance_east_north = 0.0;\n  double variance_north = 0.0;\n  double variance_up = 0.0;\n  return read_covariance(message, &variance_east, &covariance_east_north,\n                         &variance_north, &variance_up, reason);\n}\n\n// 함수이름: read_covariance\n// 기능: NavSatFix ENU covariance를 읽고 unknown인 경우 설정 fallback을 사용한다.\n// 인자: message와 ENU covariance 출력 포인터\n// 반환값: 사용할 covariance가 품질 기준을 만족하면 true\nbool OdometryGpsFusion::read_covariance(\n    const sensor_msgs::NavSatFix& message, double* variance_east,\n    double* covariance_east_north, double* variance_north,\n    double* variance_up, std::string* reason) const {\n  if (variance_east == nullptr || covariance_east_north == nullptr ||\n      variance_north == nullptr || variance_up == nullptr) {\n    *reason = \"gps_covariance_output_invalid\";\n    return false;\n  }\n  if (message.position_covariance_type ==\n      sensor_msgs::NavSatFix::COVARIANCE_TYPE_UNKNOWN) {\n    *variance_east = fallback_horizontal_variance_m2_;\n    *covariance_east_north = 0.0;\n    *variance_north = fallback_horizontal_variance_m2_;\n    *variance_up = fallback_vertical_variance_m2_;\n    reason->clear();\n    return true;\n  }\n  if (message.position_covariance_type \u003c\n          sensor_msgs::NavSatFix::COVARIANCE_TYPE_APPROXIMATED ||\n      message.position_covariance_type >\n          sensor_msgs::NavSatFix::COVARIANCE_TYPE_KNOWN) {\n    *reason = \"gps_covariance_type_invalid\";\n    return false;\n  }\n  if (!MessageValidation::validateCovariance(\n          message.position_covariance.data(), 3, false,\n          std::max(max_horizontal_variance_m2_, max_vertical_variance_m2_),\n          reason)) {\n    *reason = \"gps_\" + *reason;\n    return false;\n  }\n  *variance_east = message.position_covariance[0];\n  *covariance_east_north =\n      0.5 * (message.position_covariance[1] +\n             message.position_covariance[3]);\n  *variance_north = message.position_covariance[4];\n  *variance_up = message.position_covariance[8];\n  if (*variance_east > max_horizontal_variance_m2_ ||\n      *variance_north > max_horizontal_variance_m2_) {\n    *reason = \"gps_horizontal_variance_too_large\";\n    return false;\n  }\n  if (*variance_up > max_vertical_variance_m2_) {\n    *reason = \"gps_vertical_variance_too_large\";\n    return false;\n  }\n  reason->clear();\n  return true;\n}\n\n// 함수이름: project_to_map\n// 기능: datum 주변 WGS84 차이를 타원체 곡률로 ENU에 투영한 뒤 map yaw를 적용한다.\n// 인자: message\n// 반환값: map frame 위치 m\nOdometryGpsFusion::ProjectedPoint OdometryGpsFusion::project_to_map(\n    const sensor_msgs::NavSatFix& message) const {\n  const double latitude_rad = degreesToRadians(datum_.latitude_deg);\n  const double sin_latitude = std::sin(latitude_rad);\n  const double denominator =\n      std::sqrt(1.0 - kWgs84EccentricitySquared *\n                          sin_latitude * sin_latitude);\n  const double prime_vertical_radius_m =\n      kWgs84SemiMajorAxisM / denominator;\n  const double meridian_radius_m =\n      kWgs84SemiMajorAxisM * (1.0 - kWgs84EccentricitySquared) /\n      (denominator * denominator * denominator);\n  const double east_m =\n      prime_vertical_radius_m * std::cos(latitude_rad) *\n      degreesToRadians(message.longitude - datum_.longitude_deg);\n  const double north_m =\n      meridian_radius_m *\n      degreesToRadians(message.latitude - datum_.latitude_deg);\n  const double cosine = std::cos(yaw_offset_rad_);\n  const double sine = std::sin(yaw_offset_rad_);\n\n  ProjectedPoint point;\n  point.x_m = datum_.map_x_m + cosine * east_m - sine * north_m;\n  point.y_m = datum_.map_y_m + sine * east_m + cosine * north_m;\n  point.z_m = datum_.map_z_m + message.altitude - datum_.altitude_m;\n  return point;\n}\n\n// 함수이름: lever_arm_in_map\n// 기능: base_link -> gps_link 평면 레버암을 현재 base yaw로 map 좌표계에 회전한다.\n// 인자: map 좌표계 기준 base_link yaw rad\n// 반환값: map 좌표계 레버암 m\nOdometryGpsFusion::ProjectedPoint OdometryGpsFusion::lever_arm_in_map(\n    const double base_yaw_rad) const {\n  ProjectedPoint lever_arm;\n  const double cosine = std::cos(base_yaw_rad);\n  const double sine = std::sin(base_yaw_rad);\n  lever_arm.x_m = cosine * lever_arm_x_m_ - sine * lever_arm_y_m_;\n  lever_arm.y_m = sine * lever_arm_x_m_ + cosine * lever_arm_y_m_;\n  return lever_arm;\n}\n\n// 함수이름: correct_to_base_link\n// 기능: GPS 안테나 투영 위치에서 현재 레버암을 빼고 datum 자세의 레버암을 더한다.\n//       first_fix의 map 원점 계약을 유지하면서 회전 시 생기는 가짜 평행이동을 제거한다.\n// 인자: antenna_point, current_lever_arm\n// 반환값: map 좌표계 base_link 위치 m\nOdometryGpsFusion::ProjectedPoint OdometryGpsFusion::correct_to_base_link(\n    const ProjectedPoint& antenna_point,\n    const ProjectedPoint& current_lever_arm) const {\n  ProjectedPoint base_point = antenna_point;\n  base_point.x_m += (reference_mode_ == \"rddf_datum\" ? 0.0 : reference_lever_arm_map_.x_m) - current_lever_arm.x_m;\n  base_point.y_m += (reference_mode_ == \"rddf_datum\" ? 0.0 : reference_lever_arm_map_.y_m) - current_lever_arm.y_m;\n  return base_point;\n}\n\n// 함수이름: make_pose\n// 기능: base_link 위치와 GPS 및 yaw 레버암 불확실성을 map pose 측정값으로 만든다.\n// 인자: message, point, current_lever_arm\n// 반환값: Global EKF 입력용 PoseWithCovarianceStamped\ngeometry_msgs::PoseWithCovarianceStamped OdometryGpsFusion::make_pose(\n    const sensor_msgs::NavSatFix& message,\n    const ProjectedPoint& point,\n    const ProjectedPoint& current_lever_arm,\n    const nav_msgs::Odometry& aligned_local) const {\n  double variance_east = 0.0;\n  double covariance_east_north = 0.0;\n  double variance_north = 0.0;\n  double variance_up = 0.0;\n  std::string ignored_reason;\n  read_covariance(message, &variance_east, &covariance_east_north,\n                  &variance_north, &variance_up, &ignored_reason);\n  const double cosine = std::cos(yaw_offset_rad_);\n  const double sine = std::sin(yaw_offset_rad_);\n\n  geometry_msgs::PoseWithCovarianceStamped output;\n  output.header.stamp = message.header.stamp;\n  output.header.frame_id = map_frame_;\n  output.pose.pose.position.x = point.x_m;\n  output.pose.pose.position.y = point.y_m;\n  output.pose.pose.position.z = point.z_m;\n  output.pose.pose.orientation.w = 1.0;\n  std::fill(output.pose.covariance.begin(), output.pose.covariance.end(), 0.0);\n  output.pose.covariance[0] =\n      cosine * cosine * variance_east + sine * sine * variance_north -\n      2.0 * sine * cosine * covariance_east_north;\n  output.pose.covariance[7] =\n      sine * sine * variance_east + cosine * cosine * variance_north +\n      2.0 * sine * cosine * covariance_east_north;\n  const double xy_covariance =\n      sine * cosine * (variance_east - variance_north) +\n      (cosine * cosine - sine * sine) * covariance_east_north;\n  output.pose.covariance[1] = xy_covariance;\n  output.pose.covariance[6] = xy_covariance;\n  // base = antenna - R(yaw)*lever. yaw에 대한 Jacobian은 [Ly, -Lx]다.\n  const double yaw_variance = aligned_local.pose.covariance[35];\n  output.pose.covariance[0] +=\n      current_lever_arm.y_m * current_lever_arm.y_m * yaw_variance;\n  const double lever_xy_covariance =\n      -current_lever_arm.x_m * current_lever_arm.y_m * yaw_variance;\n  output.pose.covariance[1] += lever_xy_covariance;\n  output.pose.covariance[6] += lever_xy_covariance;\n  output.pose.covariance[7] +=\n      current_lever_arm.x_m * current_lever_arm.x_m * yaw_variance;\n  output.pose.covariance[14] = variance_up;\n  output.pose.covariance[21] = unobserved_variance_;\n  output.pose.covariance[28] = unobserved_variance_;\n  output.pose.covariance[35] = unobserved_variance_;\n  return output;\n}\n\n// 함수이름: gps_callback\n// 기능: 유효 GPS를 datum에 투영하고 연속 fix gate를 통과한 pose만 발행한다.\n// 인자: message\n// 반환값: 없음\nvoid OdometryGpsFusion::gps_callback(\n    const sensor_msgs::NavSatFix::ConstPtr& message) {\n  if (!initialization_ready_is_fresh() ||\n      (initialization_required_ && message->header.stamp \u003c= initialization_stamp_)) return;\n  const ros::Time now = ros::Time::now();\n  observe_clock(now);\n  std::string reason;\n  if (!clock_ready_is_fresh()) {\n    ROS_WARN_THROTTLE(1.0, \"Rejecting GPS fix: clock_not_ready\");\n    return;\n  }\n  // Transport reordering/duplicates must not disturb accepted anchors or the\n  // consecutive recovery count. Only increasing, fresh measurement times enter.\n  if (!MessageValidation::validateStamp(message->header.stamp, now,\n          max_message_age_sec_, max_future_stamp_sec_, !last_received_gps_stamp_.isZero(),\n          last_received_gps_stamp_, &reason)) {\n    ROS_WARN_THROTTLE(1.0, \"Discarding GPS fix without state change: %s\", reason.c_str());\n    return;\n  }\n  last_received_gps_stamp_ = message->header.stamp;\n  if (!validate_fix(*message, &reason)) {\n    pending_fixes_.clear();\n    recovery_gate_.markUnhealthy();\n    have_last_candidate_point_ = false;\n    publish_relocalizing(recovery_gate_.recovering());\n    ROS_WARN_THROTTLE(1.0, \"Rejecting GPS fix: %s\", reason.c_str());\n    return;\n  }\n  if (pending_fixes_.size() >= static_cast\u003cstd::size_t>(pending_max_samples_)) {\n    ROS_WARN_THROTTLE(1.0, \"Discarding GPS fix: pending_queue_full\");\n    return;\n  }\n  pending_fixes_.push_back(PendingFix{message, ros::SteadyTime::now()});\n  process_pending();\n}\n\nvoid OdometryGpsFusion::process_fix(\n    const sensor_msgs::NavSatFix::ConstPtr& message,\n    const nav_msgs::Odometry& aligned_local) {\n  std::string reason;\n  const double local_yaw_rad = MessageValidation::yawFromQuaternion(\n      aligned_local.pose.pose.orientation);\n  const ProjectedPoint current_lever_arm =\n      lever_arm_in_map(local_yaw_rad + yaw_offset_rad_);\n\n  if (have_last_stamp_ && recovery_gate_.acceptedOnce()) {\n    const double stamp_gap_sec =\n        (message->header.stamp - last_stamp_).toSec();\n    // rosbag 반복 재생 등 시간 epoch가 바뀐 경우도 단절과 동일하게 재검증한다.\n    if (stamp_gap_sec \u003c 0.0 || stamp_gap_sec > gps_recovery_gap_sec_) {\n      recovery_gate_.markUnhealthy();\n      have_last_candidate_point_ = false;\n    }\n  }\n\n  if (!datum_.ready) {\n    datum_.latitude_deg = message->latitude;\n    datum_.longitude_deg = message->longitude;\n    datum_.altitude_m = message->altitude;\n    datum_.map_x_m = 0.0;\n    datum_.map_y_m = 0.0;\n    datum_.map_z_m = 0.0;\n    datum_.ready = true;\n    reference_lever_arm_map_ = current_lever_arm;\n    reference_lever_arm_ready_ = true;\n    ROS_INFO(\"First valid GPS fix established the local map datum\");\n  }\n\n  if (!reference_lever_arm_ready_) {\n    recovery_gate_.markUnhealthy();\n    publish_relocalizing(recovery_gate_.recovering());\n    ROS_WARN_THROTTLE(1.0, \"Rejecting GPS fix: lever_arm_reference_not_ready\");\n    return;\n  }\n\n  const ProjectedPoint point = correct_to_base_link(\n      project_to_map(*message), current_lever_arm);\n  if (!std::isfinite(point.x_m) || !std::isfinite(point.y_m) ||\n      !std::isfinite(point.z_m)) {\n    recovery_gate_.markUnhealthy();\n    have_last_candidate_point_ = false;\n    publish_relocalizing(recovery_gate_.recovering());\n    ROS_WARN_THROTTLE(1.0, \"Rejecting non-finite projected GPS pose\");\n    return;\n  }\n  const geometry_msgs::PoseWithCovarianceStamped candidate =\n      make_pose(*message, point, current_lever_arm, aligned_local);\n  latest_quality_candidate_ = candidate;\n  have_latest_quality_candidate_ = true;\n  candidate_history_.push_back(CandidateRecord{candidate, aligned_local});\n  while (candidate_history_.size() > static_cast\u003cstd::size_t>(local_history_max_samples_) ||\n         (candidate.header.stamp - candidate_history_.front().pose.header.stamp).toSec() >\n             local_history_duration_sec_) {\n    candidate_history_.pop_front();\n  }\n  // 승인 전 후보는 Coordinator 교차검증에만 사용한다. InterfaceAdapter가\n  // Global EKF로 relay하는 공개 GPS pose와는 의도적으로 분리한다.\n  candidate_publisher_.publish(candidate);\n  if (!innovation_is_acceptable(candidate, aligned_local, &reason)) {\n    recovery_gate_.markUnhealthy();\n    have_last_candidate_point_ = false;\n    publish_relocalizing(recovery_gate_.recovering());\n    ROS_WARN_THROTTLE(1.0, \"Rejecting GPS fix: %s\", reason.c_str());\n    return;\n  }\n  if (have_last_candidate_point_ &&\n      std::hypot(point.x_m - last_candidate_point_.x_m,\n                 point.y_m - last_candidate_point_.y_m) >\n          max_step_distance_m_) {\n    recovery_gate_.resetCandidate();\n  }\n  last_candidate_point_ = point;\n  have_last_candidate_point_ = true;\n\n  last_stamp_ = message->header.stamp;\n  have_last_stamp_ = true;\n  if (!recovery_gate_.observeHealthy()) {\n    publish_relocalizing(recovery_gate_.recovering());\n    return;\n  }\n  pose_publisher_.publish(candidate);\n  prediction_anchor_map_ = point;\n  prediction_anchor_local_odometry_ = aligned_local;\n  have_prediction_anchor_ = true;\n  publish_relocalizing(false);\n}\n\n}  // namespace mando_localization","line_count":893,"redacted_lines":[],"functions":[{"line":81,"label":"void OdometryGpsFusion::load_configuration() {"},{"line":290,"label":"bool OdometryGpsFusion::initialization_ready_is_fresh() const {"},{"line":296,"label":"void OdometryGpsFusion::initialization_ready_callback(const std_msgs::Bool::ConstPtr& message) {"},{"line":311,"label":"void OdometryGpsFusion::observe_clock(const ros::Time& now) {"},{"line":318,"label":"void OdometryGpsFusion::reset_time_epoch() {"},{"line":341,"label":"bool OdometryGpsFusion::clock_ready_is_fresh() const {"},{"line":348,"label":"void OdometryGpsFusion::clock_ready_callback(const std_msgs::Bool::ConstPtr& message) {"},{"line":359,"label":"void OdometryGpsFusion::pending_timer_callback(const ros::WallTimerEvent&) {"},{"line":364,"label":"void OdometryGpsFusion::process_pending() {"},{"line":402,"label":"void OdometryGpsFusion::local_odometry_callback("},{"line":421,"label":"void OdometryGpsFusion::reanchor_callback("},{"line":475,"label":"bool OdometryGpsFusion::local_odometry_is_fresh("},{"line":494,"label":"bool OdometryGpsFusion::innovation_is_acceptable("},{"line":554,"label":"void OdometryGpsFusion::publish_relocalizing(const bool relocalizing) {"},{"line":564,"label":"bool OdometryGpsFusion::validate_fix(const sensor_msgs::NavSatFix& message,"},{"line":596,"label":"bool OdometryGpsFusion::read_covariance("},{"line":651,"label":"OdometryGpsFusion::ProjectedPoint OdometryGpsFusion::project_to_map("},{"line":683,"label":"OdometryGpsFusion::ProjectedPoint OdometryGpsFusion::lever_arm_in_map("},{"line":698,"label":"OdometryGpsFusion::ProjectedPoint OdometryGpsFusion::correct_to_base_link("},{"line":711,"label":"geometry_msgs::PoseWithCovarianceStamped OdometryGpsFusion::make_pose("},{"line":766,"label":"void OdometryGpsFusion::gps_callback("},{"line":802,"label":"void OdometryGpsFusion::process_fix("}],"params":[]},"src/localization/src/supervisor/localization_supervisor_node.cpp":{"path":"src/localization/src/supervisor/localization_supervisor_node.cpp","sha256":"84fd252cc6fc77cb8dcd24dd372a0220bad80cd732ac7d872b34d48cb9798af6","text":"#include \u003cros/ros.h>\n\n#include \u003cexception>\n\n#include \"relocalization/relocalization_coordinator.hpp\"\n#include \"status_manager/localization_status_manager.hpp\"\n#include \"supervisor/localization_supervisor.hpp\"\n\nint main(int argc, char** argv) {\n  ros::init(argc, argv, \"localization_supervisor\");\n  try {\n    ros::NodeHandle node;\n    ros::NodeHandle private_node(\"~\");\n    mando_localization::LocalizationStatusManager status_manager(\n        node, private_node);\n    mando_localization::RelocalizationCoordinator recovery_coordinator(\n        node, private_node);\n    mando_localization::LocalizationSupervisor supervisor(node, private_node);\n    ros::spin();\n  } catch (const std::exception& error) {\n    ROS_FATAL_STREAM(\"LocalizationSupervisor 시작 실패: \" \u003c\u003c error.what());\n    return 1;\n  }\n  return 0;\n}","line_count":25,"redacted_lines":[],"functions":[],"params":[]},"src/localization/scripts/rddf_initializer_node.py":{"path":"src/localization/scripts/rddf_initializer_node.py","sha256":"af6aa5ed542bd62541aeae2ed3dcd120818a92207a16683e54ddc368cc69130b","text":"#!/usr/bin/python3\n\"\"\"GPS/RViz로 선택한 RDDF 위치에서 IMU와 두 EKF를 한 번 초기화한다.\"\"\"\nimport copy\nimport json\nimport math\nfrom pathlib import Path\nimport sys\nimport threading\nimport time\n\nsys.path.insert(0, str(Path(__file__).resolve().parent))\nimport numpy as np\nimport rospy\nfrom geometry_msgs.msg import PoseWithCovarianceStamped, TwistWithCovarianceStamped\nfrom nav_msgs.msg import Odometry\nfrom sensor_msgs.msg import NavSatFix\nfrom std_msgs.msg import Bool, String\nfrom robot_localization.srv import SetPose\nfrom mando_localization.srv import SetInitialHeading\nfrom rddf_initialization_core import RddfRouteMap\n\nPREFIX = '/mando_localization/internal/initialization/'\n\n\nclass RddfInitializer:\n    def __init__(self):\n        self.p = rospy.get_param('~initialization')\n        self.topics = rospy.get_param('~topics')\n        self.frames = rospy.get_param('~frames')\n        root = Path(rospy.get_param('~package_directory'))\n        directory = Path(self.p['rddf_directory'])\n        self.routes = RddfRouteMap(directory if directory.is_absolute() else root/directory)\n        reference = rospy.get_param('~reference')\n        if (abs(reference['latitude_deg']-self.routes.origin['lat']) > 1e-10 or\n                abs(reference['longitude_deg']-self.routes.origin['lng']) > 1e-10):\n            raise ValueError('RDDF origin and GPS datum differ')\n        for k,v in self.p.items():\n            if k != 'rddf_directory' and (isinstance(v,bool) or not isinstance(v,(int,float)) or\n                                         not math.isfinite(v) or v \u003c= 0):\n                raise ValueError('invalid initialization/'+k)\n        self.lever = rospy.get_param('~lever_arm')\n        self.quality = rospy.get_param('~quality')\n        self.lock = threading.RLock()\n        self.state, self.reason = 'WAITING_FOR_GPS', 'GPS 또는 시작 위치 선택 대기'\n        self.selected = None\n        self.manual = False\n        self.ready = False\n        self.speed = None\n        self.clock = None\n        self.last_gps_stamp = 0.\n        self.gps_candidates = []\n        self.epoch = 0\n        self.last_now = None\n        self.started = None\n        self.confirm_after = None\n        self.confirm = {'local': [], 'global': []}\n        self.transaction = 0\n        self.ready_pub = rospy.Publisher(PREFIX+'ready', Bool, queue_size=1, latch=True)\n        self.status_pub = rospy.Publisher(PREFIX+'status', String, queue_size=1, latch=True)\n        self.commit_pub = rospy.Publisher(PREFIX+'committed_pose', PoseWithCovarianceStamped,\n                                          queue_size=1, latch=True)\n        self.subscribers = [\n            rospy.Subscriber(self.topics['gps_fix'], NavSatFix, self.gps_callback, queue_size=10),\n            rospy.Subscriber(self.topics['encoder_twist'], TwistWithCovarianceStamped, self.speed_callback, queue_size=10),\n            rospy.Subscriber(rospy.get_param('~internal_topics/clock_ready'), Bool, self.clock_callback, queue_size=2),\n            rospy.Subscriber(PREFIX+'manual_request', String, self.manual_callback, queue_size=1),\n            rospy.Subscriber(PREFIX+'manual_active', Bool, self.manual_active_callback, queue_size=1),\n            rospy.Subscriber(self.topics['local_odometry'], Odometry, self.odom_callback, callback_args='local', queue_size=20),\n            rospy.Subscriber(self.topics['global_odometry'], Odometry, self.odom_callback, callback_args='global', queue_size=20),\n        ]\n        self.timer = rospy.Timer(rospy.Duration(.1), self.tick, reset=True)\n        self.publish()\n\n    def publish(self):\n        info = dict(state=self.state, reason=self.reason, ready=self.ready)\n        if self.selected: info.update({k:v for k,v in self.selected.items() if k in ('source','route','index','x','y','yaw','distance')})\n        self.ready_pub.publish(Bool(self.ready))\n        self.status_pub.publish(String(json.dumps(info,ensure_ascii=False)))\n\n    def tick(self, _):\n        with self.lock:\n            now = rospy.Time.now().to_sec()\n            if self.last_now is not None and now \u003c self.last_now-1e-6:\n                self.epoch += 1\n                self.ready = False\n                self.manual = False\n                self.selected = self.started = self.confirm_after = None\n                self.confirm = {'local': [], 'global': []}\n                self.gps_candidates.clear(); self.last_gps_stamp = 0.\n                self.speed = self.clock = None\n                self.state,self.reason = 'WAITING_FOR_GPS','ROS 시각 변경: 새 초기화 대기'\n            self.last_now = now\n            if self.started is not None and not self.ready and self.state != 'FAULT':\n                if time.monotonic()-self.started > self.p['confirmation_timeout_sec']:\n                    self.state,self.reason = 'FAULT','초기화 확인 시간 초과: 출력 차단'\n                    self.epoch += 1\n            self.publish()\n\n    def speed_callback(self,m):\n        with self.lock:\n            if m.header.frame_id==self.frames['base_link'] and math.isfinite(m.twist.twist.linear.x):\n                self.speed=(m.header.stamp.to_sec(),m.twist.twist.linear.x,rospy.Time.now().to_sec(),time.monotonic())\n            else: self.speed=None\n\n    def clock_callback(self,m):\n        with self.lock: self.clock=(bool(m.data),rospy.Time.now().to_sec(),time.monotonic())\n\n    def stationary(self, now):\n        return (self.speed is not None and 0 \u003c= now-self.speed[2] \u003c= self.p['speed_timeout_sec'] and\n                -self.p['max_future_sec'] \u003c= now-self.speed[0] \u003c= self.p['speed_timeout_sec'] and\n                time.monotonic()-self.speed[3] \u003c= self.p['speed_timeout_sec'] and\n                abs(self.speed[1]) \u003c= self.p['max_speed_mps'])\n\n    def clock_ready(self,now):\n        return (self.clock is not None and self.clock[0] and\n                0 \u003c= now-self.clock[1] \u003c= self.p['clock_timeout_sec'] and\n                time.monotonic()-self.clock[2] \u003c= self.p['clock_timeout_sec'])\n\n    def manual_active_callback(self,m):\n        with self.lock:\n            if self.ready or self.started is not None: return\n            self.manual=bool(m.data); self.gps_candidates.clear()\n            self.state='WAITING_FOR_MANUAL' if self.manual else 'WAITING_FOR_GPS'\n            self.reason='RDDF 위에 포인터를 놓고 클릭' if self.manual else 'GPS 대기'\n            self.publish()\n\n    def match(self,x,y,route=None):\n        return self.routes.match(x,y,self.p['max_snap_distance_m'],self.p['ambiguity_distance_m'],route_name=route)\n\n    def gps_callback(self,m):\n        with self.lock:\n            if self.manual or self.ready or self.started is not None: return\n            now=rospy.Time.now().to_sec(); stamp=m.header.stamp.to_sec()\n            try:\n                cov=np.asarray(m.position_covariance,dtype=float).reshape(3,3)\n                known=m.position_covariance_type!=NavSatFix.COVARIANCE_TYPE_UNKNOWN\n                valid=(m.position_covariance_type in (0,1,2,3) and m.status.status>=self.quality['minimum_fix_status'] and m.header.frame_id==self.frames['gps'] and\n                       stamp>self.last_gps_stamp and stamp>0 and math.isfinite(m.altitude) and\n                       -self.p['max_future_sec']\u003c=now-stamp\u003c=self.p['max_candidate_age_sec'] and\n                       self.clock_ready(now))\n                if known:\n                    valid=valid and np.isfinite(cov).all() and np.allclose(cov,cov.T,atol=1e-8) and np.linalg.eigvalsh(cov).min()>=-1e-8 and all(0\u003c=cov[i,i]\u003c=self.quality['max_horizontal_variance_m2'] for i in (0,1)) and 0\u003c=cov[2,2]\u003c=self.quality['max_vertical_variance_m2']\n                if not valid: raise ValueError('GPS 품질 또는 측정 시각 확인 대기')\n                self.last_gps_stamp=stamp\n                x,y=self.routes.project_gps(m.latitude,m.longitude)\n                candidate=self.match(x,y)\n                if candidate['accepted']:\n                    yaw=candidate['yaw'];lx,ly=self.lever['x_m'],self.lever['y_m']\n                    candidate=self.match(x-math.cos(yaw)*lx+math.sin(yaw)*ly,\n                                         y-math.sin(yaw)*lx-math.cos(yaw)*ly,candidate['route'])\n                if not candidate['accepted']: raise ValueError(candidate['reason'])\n            except (ValueError,TypeError,KeyError,np.linalg.LinAlgError) as error:\n                self.gps_candidates.clear();self.state='WAITING_FOR_GPS';self.reason=str(error);return\n            candidate.update(source='GPS_RDDF',stamp=stamp)\n            if self.gps_candidates:\n                first=self.gps_candidates[0]\n                if (candidate['route']!=first['route'] or stamp-self.gps_candidates[-1]['stamp']>self.p['max_candidate_age_sec'] or\n                    math.hypot(candidate['x']-first['x'],candidate['y']-first['y'])>self.p['gps_cluster_radius_m']):\n                    self.gps_candidates.clear()\n            self.gps_candidates.append(candidate)\n            self.gps_candidates=self.gps_candidates[-int(self.p[\"gps_consecutive_samples\"]):]\n            if len(self.gps_candidates)\u003cself.p['gps_consecutive_samples']:\n                self.reason='안정된 GPS 후보 수집';return\n            self.begin(candidate,now)\n\n    def manual_callback(self,m):\n        with self.lock:\n            if self.ready or self.started is not None: return\n            try:\n                data=json.loads(m.data);now=rospy.Time.now().to_sec()\n                if data['frame_id']!=self.frames['map'] or not 0\u003c=now-float(data['stamp'])\u003c=self.p['max_candidate_age_sec']:\n                    raise ValueError('수동 선택 frame 또는 시각 오류')\n                candidate=self.match(float(data['x']),float(data['y']),data['route'])\n                if not candidate['accepted']:raise ValueError(candidate['reason'])\n                # Heading is always recalculated from RDDF; the mouse never supplies arbitrary yaw.\n                candidate.update(source='MANUAL_RDDF',stamp=float(data['stamp']))\n                self.manual=True\n                self.begin(candidate,now)\n            except (ValueError,TypeError,KeyError) as error:\n                self.state,self.reason='WAITING_FOR_MANUAL',str(error)\n                self.publish()\n\n    def pose(self,target,stamp,frame):\n        m=PoseWithCovarianceStamped();m.header.stamp=stamp;m.header.frame_id=frame\n        m.pose.pose.position.x=target['x'];m.pose.pose.position.y=target['y']\n        m.pose.pose.orientation.z=math.sin(target['yaw']/2);m.pose.pose.orientation.w=math.cos(target['yaw']/2)\n        for i in (0,7):m.pose.covariance[i]=self.p['position_variance_m2']\n        for i in (14,21,28):m.pose.covariance[i]=1e6\n        m.pose.covariance[35]=math.radians(self.p['heading_standard_deviation_deg'])**2\n        return m\n\n    def begin(self,candidate,now):\n        if not self.stationary(now):\n            self.state,self.reason='WAITING_FOR_STATIONARY','fresh 엔코더 정지 확인 대기';return\n        self.selected=dict(candidate);self.started=time.monotonic();self.state='INITIALIZING';self.reason='IMU와 Local/Global 초기화'\n        self.transaction+=1;epoch=self.epoch;transaction=self.transaction\n        self.publish()\n        threading.Thread(target=self.initialize,args=(dict(candidate),epoch,transaction),daemon=True).start()\n\n    def initialize(self,target,epoch,transaction):\n        worker_started = time.monotonic()\n        try:\n            heading_name=rospy.get_param('~heading_service','/calibrated_imu/set_initial_heading')\n            local_name=rospy.get_param('~services/local_ekf_set_pose')\n            global_name=rospy.get_param('~services/global_ekf_set_pose')\n            # Availability checks precede all mutations. Calls run outside callbacks so heartbeat remains false.\n            for service in (heading_name,local_name,global_name):\n                while True:\n                    with self.lock:\n                        if epoch!=self.epoch or self.state=='FAULT':raise ValueError('초기화 시간 초과')\n                    try:\n                        rospy.wait_for_service(service,timeout=self.p['service_wait_sec']);break\n                    except rospy.ROSException:\n                        if time.monotonic()-worker_started>=self.p['confirmation_timeout_sec']:raise\n\n            with self.lock:\n                if epoch!=self.epoch or not self.stationary(rospy.Time.now().to_sec()):raise ValueError('초기화 전 차량 상태 변경')\n            while True:\n                with self.lock:\n                    if epoch!=self.epoch or self.state=='FAULT' or not self.stationary(rospy.Time.now().to_sec()):\n                        raise ValueError('초기화 대기 중 정지/시간 조건 변경')\n                result=rospy.ServiceProxy(heading_name,SetInitialHeading)(transaction,target['yaw'],target['source']+':'+target['route']+':'+str(target['index']),self.p['heading_standard_deviation_deg'])\n                if result.accepted:break\n                if result.reason!='WAITING_FOR_FRESH_IMU':raise ValueError(result.reason)\n                with self.lock:self.state,self.reason='WAITING_FOR_IMU','fresh IMU와 장착 TF 대기'\n                time.sleep(.03)\n            with self.lock:self.state='INITIALIZING'\n\n            for name,frame in ((local_name,self.frames['odom']),(global_name,self.frames['map'])):\n                with self.lock:\n                    if epoch!=self.epoch or not self.stationary(rospy.Time.now().to_sec()):raise ValueError('초기화 중 차량 상태 변경')\n                rospy.ServiceProxy(name,SetPose)(self.pose(target,rospy.Time.now(),frame))\n            with self.lock:\n                if epoch!=self.epoch:return\n                self.confirm_after=rospy.Time.now().to_sec();self.reason='Local/Global 위치·yaw 확인 대기'\n        except (rospy.ROSException,rospy.ServiceException,ValueError) as error:\n            with self.lock:\n                if epoch==self.epoch:self.state,self.reason='FAULT',str(error)\n\n    def odom_callback(self,m,key):\n        with self.lock:\n            if self.confirm_after is None or self.ready or self.state=='FAULT':return\n            now=rospy.Time.now().to_sec();stamp=m.header.stamp.to_sec()\n            if not self.stationary(now):self.state,self.reason='FAULT','초기화 확인 중 차량 이동';return\n            q=m.pose.pose.orientation;p=m.pose.pose.position\n            values=[p.x,p.y,p.z,q.x,q.y,q.z,q.w]+list(m.pose.covariance)\n            norm=q.x*q.x+q.y*q.y+q.z*q.z+q.w*q.w\n            if not all(math.isfinite(v) for v in values) or abs(norm-1)>1e-3:return\n            yaw=math.atan2(2*(q.w*q.z+q.x*q.y),1-2*(q.y*q.y+q.z*q.z))\n            angle=math.atan2(math.sin(yaw-self.selected['yaw']),math.cos(yaw-self.selected['yaw']))\n            okay=(m.header.frame_id==self.frames['odom' if key=='local' else 'map'] and m.child_frame_id==self.frames['base_link'] and stamp>self.confirm_after and\n                  -self.p['max_future_sec']\u003c=now-stamp\u003c=self.p['speed_timeout_sec'] and\n                  math.hypot(p.x-self.selected['x'],p.y-self.selected['y'])\u003c=self.p['confirmation_distance_m'] and abs(angle)\u003c=math.radians(self.p['confirmation_yaw_deg']))\n            if not okay:self.confirm[key].clear();return\n            if not self.confirm[key] or stamp>self.confirm[key][-1]:self.confirm[key].append(stamp)\n            if all(len(v)>=self.p['confirmation_samples'] and now-v[-1]\u003c=self.p['speed_timeout_sec'] for v in self.confirm.values()):\n                self.ready=True;self.state='READY';self.reason='RDDF 초기 위치·방향 적용 확인'\n                self.commit_pub.publish(self.pose(self.selected,rospy.Time.now(),self.frames['map']))\n                self.publish()\n\n\nif __name__=='__main__':\n    rospy.init_node('rddf_initializer')\n    try:node=RddfInitializer();rospy.spin()\n    except (ValueError,KeyError,OSError) as error:rospy.logfatal('RDDF initialization failed: %s',error);raise","line_count":265,"redacted_lines":[],"functions":[{"line":25,"label":"class RddfInitializer:"},{"line":26,"label":"def __init__(self):"},{"line":74,"label":"def publish(self):"},{"line":80,"label":"def tick(self, _):"},{"line":99,"label":"def speed_callback(self,m):"},{"line":105,"label":"def clock_callback(self,m):"},{"line":108,"label":"def stationary(self, now):"},{"line":114,"label":"def clock_ready(self,now):"},{"line":119,"label":"def manual_active_callback(self,m):"},{"line":127,"label":"def match(self,x,y,route=None):"},{"line":130,"label":"def gps_callback(self,m):"},{"line":166,"label":"def manual_callback(self,m):"},{"line":183,"label":"def pose(self,target,stamp,frame):"},{"line":192,"label":"def begin(self,candidate,now):"},{"line":200,"label":"def initialize(self,target,epoch,transaction):"},{"line":240,"label":"def odom_callback(self,m,key):"}],"params":[]},"src/localization/scripts/sensor_timing_monitor.py":{"path":"src/localization/scripts/sensor_timing_monitor.py","sha256":"6ebbb43409a5b2e0a66ab9e7b9c870f7264cd658a29d78ab153368f9ecef3794","text":"#!/usr/bin/python3\n\"\"\"Observe timing without restamping sensors or changing any system clock.\"\"\"\nfrom collections import deque\nimport json\nimport math\nfrom pathlib import Path\nimport sys\nimport threading\nimport time\n\nsys.path.insert(0, str(Path(__file__).resolve().parent))\nfrom timing_core import TimingWindow, check_host_clock, count, distribution, positive\n\nimport rospy\nfrom diagnostic_msgs.msg import DiagnosticArray, DiagnosticStatus, KeyValue\nfrom geometry_msgs.msg import TwistWithCovarianceStamped\nfrom sensor_msgs.msg import Imu, NavSatFix\nfrom std_msgs.msg import Bool\n\n\ndef status_message(name, level, message, values):\n    status = DiagnosticStatus(name=name, level=level, message=message, hardware_id='pc_clock_and_sensor_headers')\n    status.values = [KeyValue(key=str(key), value=json.dumps(value, ensure_ascii=False, allow_nan=False)\n                             if not isinstance(value, str) else value) for key, value in sorted(values.items())]\n    return status\n\n\nclass SensorTimingMonitor:\n    def __init__(self):\n        self.policy = rospy.get_param('~sensor_timing_monitor')\n        self.clock_policy = rospy.get_param('~clock_preflight')\n        self.sim = bool(rospy.get_param('/use_sim_time', False))\n        self.gps_receipt_mode = bool(rospy.get_param('~gps_driver/use_ros_time', False))\n        for key in ('publish_rate_hz', 'host_check_period_sec', 'host_check_stale_sec',\n                    'driver_diagnostics_stale_sec', 'window_sec', 'clock_jump_tolerance_sec',\n                    'future_tolerance_sec', 'max_header_age_p95_sec',\n                    'max_gnss_receipt_difference_sec'):\n            self.policy[key] = positive(self.policy[key], key)\n        self.policy['max_samples'] = count(self.policy['max_samples'], 'max_samples', 2)\n        self.policy['min_samples'] = count(self.policy['min_samples'], 'min_samples')\n        if self.policy['min_samples'] > self.policy['max_samples']:\n            raise ValueError('min_samples must not exceed max_samples')\n        self.lock = threading.RLock()\n        self.stop = threading.Event()\n        self.host = {'ready': False, 'status': 'HOST_CLOCK_NOT_CHECKED', 'hardware_sensor_sync_verified': False}\n        self.host_stamp = None\n        self.driver_values = {}\n        self.driver_level = DiagnosticStatus.STALE\n        self.driver_stamp = None\n        self.gnss_differences = deque(maxlen=int(self.policy['max_samples']))\n        self.windows = {}\n        for name, config in self.policy['sensors'].items():\n            for key in ('expected_interval_sec', 'max_gap_sec', 'stale_sec'):\n                config[key] = positive(config[key], name+'/'+key)\n            self.windows[name] = TimingWindow(self.policy['window_sec'], self.policy['max_samples'],\n                                              config['max_gap_sec'], self.policy['clock_jump_tolerance_sec'])\n        self.diagnostics = rospy.Publisher('~diagnostics', DiagnosticArray, queue_size=2)\n        self.clock_ready = rospy.Publisher(rospy.get_param('~internal_topics/clock_ready'), Bool,\n                                          queue_size=2, latch=False)\n        topics = rospy.get_param('~topics')\n        self.subscribers = [rospy.Subscriber(topics[key], cls, self._sensor_callback,\n                                             callback_args=name, queue_size=200)\n                            for name, key, cls in [('gps', 'gps_fix', NavSatFix), ('imu', 'imu_data', Imu),\n                                                   ('encoder', 'encoder_twist', TwistWithCovarianceStamped)]]\n        self.subscribers.append(rospy.Subscriber(rospy.get_param('~gps_driver_timing_topic'), DiagnosticArray,\n                                                 self._driver_callback, queue_size=100))\n        rospy.on_shutdown(self.stop.set)\n        self.host_worker = threading.Thread(target=self._host_loop, daemon=True)\n        self.publisher_worker = threading.Thread(target=self._publish_loop, daemon=True)\n        self.clock_ready.publish(Bool(data=False))\n        self.host_worker.start()\n        self.publisher_worker.start()\n\n    def _sensor_callback(self, message, name):\n        receipt_mono = time.monotonic()\n        receipt_ros = rospy.Time.now().to_sec()\n        with self.lock:\n            self.windows[name].add(message.header.stamp.to_sec(), receipt_ros, receipt_mono)\n\n    def _driver_callback(self, message):\n        received = time.monotonic()\n        for status in message.status:\n            if status.name != 'ublox_gps: measurement timing':\n                continue\n            values = {value.key: value.value for value in status.values}\n            values['_monitor_offset_parse_valid'] = 'false'\n            with self.lock:\n                self.driver_values = values\n                self.driver_level = status.level\n                self.driver_stamp = received\n                if values.get('utc_valid') == 'true':\n                    try:\n                        value = float(values['receipt_minus_utc_clock_offset_plus_transport_ns'])/1e9\n                        if math.isfinite(value):\n                            self.gnss_differences.append((received, value))\n                            values['_monitor_offset_parse_valid'] = 'true'\n                    except (KeyError, ValueError, OverflowError):\n                        pass\n\n    def _host_loop(self):\n        while not self.stop.is_set() and not rospy.is_shutdown():\n            try:\n                result = check_host_clock(self.clock_policy, self.sim)\n            except Exception as error:\n                result = {'ready': False, 'status': 'HOST_CLOCK_CHECK_FAILED', 'reason': str(error),\n                          'hardware_sensor_sync_verified': False}\n            with self.lock:\n                self.host, self.host_stamp = result, time.monotonic()\n            self.stop.wait(self.policy['host_check_period_sec'])\n\n    def _sensor_status(self, name, now):\n        window = self.windows[name].snapshot(now)\n        config = self.policy['sensors'][name]\n        level, reasons = DiagnosticStatus.OK, []\n        age = window['last_receipt_age_sec']\n        if age is None or age > config['stale_sec']:\n            level = DiagnosticStatus.ERROR\n            reasons.append('NOT_RECEIVED' if age is None else 'STALE_RECEIPT')\n        if window['invalid_count'] or window['backwards_count']:\n            level = max(level, DiagnosticStatus.ERROR)\n            reasons.append('INVALID_OR_BACKWARDS_STAMP')\n        if window['age']['count'] \u003c self.policy['min_samples']:\n            level = max(level, DiagnosticStatus.WARN)\n            reasons.append('WARMUP_OR_TOO_FEW_SAMPLES')\n        if window['duplicate_count'] or window['gap_count'] or window['clock_jump_count']:\n            level = max(level, DiagnosticStatus.WARN)\n            reasons.append('DUPLICATE_GAP_OR_CLOCK_JUMP')\n        if window['age']['count']:\n            if (window['age']['p95_sec'] > self.policy['max_header_age_p95_sec'] or\n                    window['age']['min_sec'] \u003c -self.policy['future_tolerance_sec']):\n                level = max(level, DiagnosticStatus.WARN)\n                reasons.append('RECEIPT_HEADER_DIFFERENCE_OUTSIDE_LIMIT')\n        semantics = config['stamp_semantics']\n        if name == 'gps':\n            actual = self.driver_values.get('stamp_source', 'driver_confirmation_unavailable')\n            semantics += '; actual='+actual\n        window.update(stamp_semantics=semantics, physical_measurement_sync_verified=False,\n                      pre_stamp_device_latency_measured=False,\n                      receipt_minus_header_scope='clock difference plus post-stamp path; never hardware latency alone',\n                      configured_expected_interval_sec=config['expected_interval_sec'],\n                      use_sim_time=self.sim)\n        return status_message('sensor_timing/'+name, level, ', '.join(reasons) or 'HEADER_TIMING_OBSERVED', window)\n\n    def _driver_status(self, now):\n        while self.gnss_differences and self.gnss_differences[0][0] \u003c now-self.policy['window_sec']:\n            self.gnss_differences.popleft()\n        values = dict(self.driver_values)\n        age = None if self.driver_stamp is None else now-self.driver_stamp\n        metrics = distribution(value for _, value in self.gnss_differences)\n        values.update(diagnostic_receipt_age_sec=age, receipt_minus_utc_stats=metrics,\n                      offset_scope='PC UTC clock offset + transport/callback delay, not transport latency alone',\n                      configured_gps_receipt_mode=self.gps_receipt_mode,\n                      hardware_sensor_sync_verified=False)\n        if age is None or age > self.policy['driver_diagnostics_stale_sec']:\n            return status_message('sensor_timing/gnss_utc', DiagnosticStatus.ERROR,\n                                  'GNSS_TIMING_DIAGNOSTICS_MISSING_OR_STALE', values)\n        level = self.driver_level\n        reasons = []\n        if values.get('utc_valid') != 'true':\n            level = max(level, DiagnosticStatus.ERROR); reasons.append('GNSS_UTC_INVALID')\n        elif values.get('_monitor_offset_parse_valid') != 'true':\n            level = max(level, DiagnosticStatus.ERROR); reasons.append('GNSS_TIMING_OFFSET_MISSING_OR_MALFORMED')\n        if values.get('stamp_source') != 'gnss_utc':\n            level = max(level, DiagnosticStatus.WARN); reasons.append('RECEIPT_STAMP_NOT_MEASUREMENT_TIME')\n        if metrics['count']:\n            if (metrics['p95_sec'] > self.policy['max_gnss_receipt_difference_sec'] or\n                    metrics['min_sec'] \u003c -self.policy['future_tolerance_sec']):\n                level = max(level, DiagnosticStatus.ERROR); reasons.append('PC_GNSS_CLOCK_PLUS_TRANSPORT_DIFFERENCE')\n        return status_message('sensor_timing/gnss_utc', level, ', '.join(reasons) or 'GNSS_UTC_DIAGNOSTICS_OBSERVED', values)\n\n    def publish_once(self):\n        now = time.monotonic()\n        with self.lock:\n            host = dict(self.host)\n            age = None if self.host_stamp is None else now-self.host_stamp\n            ready = bool(host.get('ready')) and age is not None and age \u003c= self.policy['host_check_stale_sec']\n            host['check_receipt_age_sec'] = age\n            host['ready'] = ready\n            if age is None or age > self.policy['host_check_stale_sec']:\n                host['status'] = 'HOST_CLOCK_CHECK_MISSING_OR_STALE'\n            level = DiagnosticStatus.WARN if ready and self.sim else DiagnosticStatus.OK if ready else DiagnosticStatus.ERROR\n            status = [status_message('sensor_timing/host_clock', level, host['status'], host)]\n            status.extend(self._sensor_status(name, now) for name in self.windows)\n            status.append(self._driver_status(now))\n        self.clock_ready.publish(Bool(data=ready))\n        array = DiagnosticArray()\n        array.header.stamp = rospy.Time.now()\n        array.status = status\n        self.diagnostics.publish(array)\n\n    def _publish_loop(self):\n        while not self.stop.is_set() and not rospy.is_shutdown():\n            try:\n                self.publish_once()\n            except Exception as error:\n                self.clock_ready.publish(Bool(data=False))\n                rospy.logerr_throttle(5., 'Timing monitor publication failed: %s', error)\n            self.stop.wait(1./self.policy['publish_rate_hz'])\n\n\nif __name__ == '__main__':\n    rospy.init_node('sensor_timing_monitor')\n    SensorTimingMonitor()\n    rospy.spin()","line_count":204,"redacted_lines":[],"functions":[{"line":21,"label":"def status_message(name, level, message, values):"},{"line":28,"label":"class SensorTimingMonitor:"},{"line":29,"label":"def __init__(self):"},{"line":74,"label":"def _sensor_callback(self, message, name):"},{"line":80,"label":"def _driver_callback(self, message):"},{"line":100,"label":"def _host_loop(self):"},{"line":111,"label":"def _sensor_status(self, name, now):"},{"line":144,"label":"def _driver_status(self, now):"},{"line":171,"label":"def publish_once(self):"},{"line":191,"label":"def _publish_loop(self):"}],"params":[]},"src/localization/launch/safety_and_tf.launch":{"path":"src/localization/launch/safety_and_tf.launch","sha256":"f3b32656376a798a314f47c0e5a48cf03cb6aac4083f8ffd7e4007c4100a58ea","text":"\u003claunch>\n  \u003carg name=\"start_rddf_initialization\" default=\"false\"/>\n  \u003carg name=\"rddf_initialization_config\" default=\"$(find mando_localization)/config/rddf_initialization.yaml\"/>\n  \u003carg name=\"interfaces_config\" default=\"$(find mando_localization)/config/localization_interfaces.yaml\"/>\n  \u003carg name=\"status_policy_config\" default=\"$(find mando_localization)/config/status_policy.yaml\"/>\n  \u003carg name=\"relocalization_policy_config\" default=\"$(find mando_localization)/config/relocalization_policy.yaml\"/>\n  \u003carg name=\"gps_reference_config\" default=\"$(find mando_localization)/config/gps_reference.yaml\"/>\n  \u003carg name=\"tf_config\" default=\"$(find mando_localization)/config/tf_configuration.yaml\"/>\n  \u003carg name=\"enable_gps_fusion\" default=\"true\"/>\n  \u003c!-- deprecated compatibility alias: 새 호출은 start_supervisor를 사용한다. -->\n  \u003carg name=\"start_status_manager\" default=\"true\"/>\n  \u003carg name=\"start_supervisor\" default=\"$(arg start_status_manager)\"/>\n  \u003carg name=\"start_output_gate\" default=\"true\"/>\n  \u003carg name=\"start_static_tf_publisher\" default=\"true\"/>\n  \u003carg name=\"supervisor_node_name\" default=\"localization_supervisor\"/>\n  \u003carg name=\"output_gate_node_name\" default=\"localization_output_gate\"/>\n  \u003carg name=\"static_tf_publisher_node_name\" default=\"localization_static_tf_publisher\"/>\n  \u003carg name=\"imu_driver_node_name\" default=\"xsens_mti_node\"/>\n  \u003carg name=\"gps_driver_node_name\" default=\"ublox_gps_node\"/>\n  \u003carg name=\"local_ekf_node_name\" default=\"imu_encoder_local_ekf\"/>\n  \u003carg name=\"global_ekf_node_name\" default=\"odometry_gps_global_ekf\"/>\n\n  \u003cgroup if=\"$(arg start_static_tf_publisher)\">\n    \u003cnode pkg=\"mando_localization\" type=\"static_transform_publisher_node\"\n          name=\"$(arg static_tf_publisher_node_name)\" output=\"screen\" clear_params=\"true\">\n      \u003crosparam command=\"load\" file=\"$(arg tf_config)\"/>\n      \u003crosparam command=\"load\" file=\"$(arg interfaces_config)\"/>\n      \u003cparam name=\"static_transforms_parameter\" value=\"static_transforms\"/>\n      \u003cparam name=\"expected_local_owner\" value=\"$(arg local_ekf_node_name)\"/>\n      \u003cparam name=\"expected_global_owner\" value=\"$(arg global_ekf_node_name)\"/>\n    \u003c/node>\n  \u003c/group>\n\n  \u003cgroup if=\"$(arg start_supervisor)\">\n    \u003cnode pkg=\"mando_localization\" type=\"localization_supervisor_node\"\n          name=\"$(arg supervisor_node_name)\" output=\"screen\" clear_params=\"true\">\n      \u003crosparam command=\"load\" file=\"$(arg interfaces_config)\"/>\n      \u003crosparam command=\"load\" file=\"$(arg status_policy_config)\"/>\n      \u003cparam name=\"initialization/required\" value=\"$(arg start_rddf_initialization)\"/>\n      \u003crosparam command=\"load\" file=\"$(arg relocalization_policy_config)\"/>\n      \u003crosparam command=\"load\" file=\"$(arg gps_reference_config)\"/>\n      \u003cparam name=\"absolute_sources/gps_enabled\" value=\"$(arg enable_gps_fusion)\"/>\n      \u003cparam name=\"nodes/imu_driver\" value=\"$(arg imu_driver_node_name)\"/>\n      \u003cparam name=\"nodes/gps_driver\" value=\"$(arg gps_driver_node_name)\"/>\n    \u003c/node>\n  \u003c/group>\n\n  \u003cgroup if=\"$(arg start_output_gate)\">\n    \u003cnode pkg=\"mando_localization\" type=\"localization_output_gate_node\"\n          name=\"$(arg output_gate_node_name)\" output=\"screen\" clear_params=\"true\">\n      \u003crosparam command=\"load\" file=\"$(arg interfaces_config)\"/>\n      \u003crosparam command=\"load\" file=\"$(arg status_policy_config)\"/>\n      \u003cparam name=\"initialization/required\" value=\"$(arg start_rddf_initialization)\"/>\n    \u003c/node>\n  \u003c/group>\n\u003c/launch>","line_count":56,"redacted_lines":[],"functions":[],"params":[]},"src/localization/launch/visualization.launch":{"path":"src/localization/launch/visualization.launch","sha256":"0e066e71c98e182a7b558afde3eb3ab20784427e8570f0746fedca47f28066d5","text":"\u003claunch>\n  \u003carg name=\"interfaces_config\" default=\"$(find mando_localization)/config/localization_interfaces.yaml\"/>\n  \u003carg name=\"visualization_config\" default=\"$(find mando_localization)/config/visualization.yaml\"/>\n  \u003carg name=\"rviz_config\" default=\"$(find mando_localization)/config/localization_viewer.yaml\"/>\n  \u003carg name=\"start_visualization\" default=\"true\"/>\n  \u003carg name=\"start_rviz\" default=\"true\"/>\n  \u003carg name=\"visualization_node_name\" default=\"localization_visualization\"/>\n  \u003carg name=\"rviz_node_name\" default=\"mando_localization_rviz\"/>\n  \u003carg name=\"lidar_front_config\" default=\"$(find mando_localization)/config/lidar_front_visualization.yaml\"/>\n  \u003carg name=\"start_lidar_front_visualization\" default=\"true\"/>\n  \u003carg name=\"lidar_front_node_name\" default=\"lidar_front_scan_visualizer\"/>\n\n  \u003c!-- RViz 패널은 이 전역 인터페이스 경로에서 상태 토픽을 읽는다. -->\n  \u003crosparam command=\"load\" file=\"$(arg interfaces_config)\" ns=\"/mando_localization/interfaces\"/>\n  \u003crosparam command=\"load\" file=\"$(arg visualization_config)\" ns=\"/mando_localization/visualization\"/>\n\n  \u003cgroup if=\"$(arg start_lidar_front_visualization)\">\n    \u003cnode pkg=\"mando_localization\" type=\"lidar_front_scan_visualizer.py\"\n          name=\"$(arg lidar_front_node_name)\" output=\"screen\" clear_params=\"true\">\n      \u003crosparam command=\"load\" file=\"$(arg interfaces_config)\"/>\n      \u003crosparam command=\"load\" file=\"$(arg lidar_front_config)\"/>\n    \u003c/node>\n  \u003c/group>\n\n  \u003cgroup if=\"$(arg start_visualization)\">\n    \u003cnode pkg=\"mando_localization\" type=\"localization_visualization_node\"\n          name=\"$(arg visualization_node_name)\" output=\"screen\" clear_params=\"true\">\n      \u003crosparam command=\"load\" file=\"$(arg interfaces_config)\"/>\n      \u003crosparam command=\"load\" file=\"$(arg visualization_config)\"/>\n    \u003c/node>\n  \u003c/group>\n\n  \u003cgroup if=\"$(arg start_rviz)\">\n    \u003cinclude file=\"$(find mando_localization)/launch/viewer.launch\">\n      \u003carg name=\"config\" value=\"$(arg rviz_config)\"/>\n      \u003carg name=\"node_name\" value=\"$(arg rviz_node_name)\"/>\n    \u003c/include>\n  \u003c/group>\n\u003c/launch>","line_count":39,"redacted_lines":[],"functions":[],"params":[]},"src/sensor_drivers/imu/imu_bringup/launch/xsens_mti.launch":{"path":"src/sensor_drivers/imu/imu_bringup/launch/xsens_mti.launch","sha256":"995e05f480b454f626e0df41ea80499bf493205bf50e4539ddffc95c2f90b3c8","text":"\u003claunch>\n  \u003carg name=\"device\" default=\"/dev/imu\" />\n  \u003carg name=\"baudrate\" default=\"115200\" />\n  \u003carg name=\"frame_id\" default=\"imu_link\" />\n  \u003carg name=\"raw_topic\" default=\"/imu/data_raw\" />\n  \u003carg name=\"output_topic\" default=\"/imu/data\" />\n  \u003carg name=\"apply_measured_covariance\" default=\"true\" />\n  \u003carg name=\"device_config\"\n       default=\"$(find xsens_mti_driver)/param/xsens_mti_node.yaml\" />\n  \u003carg name=\"covariance_config\"\n       default=\"$(find imu_bringup)/config/imu_covariance.yaml\" />\n\n  \u003cnode name=\"xsens_mti_node\"\n        pkg=\"xsens_mti_driver\"\n        type=\"xsens_mti_node\"\n        output=\"screen\">\n    \u003crosparam command=\"load\" file=\"$(arg device_config)\" />\n    \u003cparam name=\"scan_for_devices\" value=\"false\" />\n    \u003cparam name=\"port\" value=\"$(arg device)\" />\n    \u003cparam name=\"baudrate\" value=\"$(arg baudrate)\" />\n    \u003cparam name=\"frame_id\" value=\"$(arg frame_id)\" />\n    \u003c!-- README TF tree is owned outside the sensor driver. Avoid world -> imu_link. -->\n    \u003cparam name=\"pub_transform\" value=\"false\" />\n    \u003c!-- 원본 Xsens 메시지는 covariance가 모두 0이므로 별도 토픽으로 격리한다. -->\n    \u003cremap from=\"imu/data\" to=\"$(arg raw_topic)\" />\n  \u003c/node>\n\n  \u003cnode if=\"$(arg apply_measured_covariance)\"\n        name=\"imu_covariance_override\"\n        pkg=\"imu_bringup\"\n        type=\"imu_covariance_override_node\"\n        output=\"screen\"\n        clear_params=\"true\"\n        required=\"true\">\n    \u003crosparam command=\"load\" file=\"$(arg covariance_config)\" />\n    \u003cparam name=\"input_topic\" value=\"$(arg raw_topic)\" />\n    \u003cparam name=\"output_topic\" value=\"$(arg output_topic)\" />\n  \u003c/node>\n\u003c/launch>","line_count":39,"redacted_lines":[],"functions":[],"params":[]},"src/sensor_drivers/imu/xsens_ros_mti_driver/param/xsens_mti_node.yaml":{"path":"src/sensor_drivers/imu/xsens_ros_mti_driver/param/xsens_mti_node.yaml","sha256":"0cece80b0ffdc437d6389d5b41071f4428598b56709d5b141f7cbb4437c2a072","text":"# Device Scanning Configuration\n# -----------------------------\n# This section allows you to configure how the ROS driver searches for devices.\n# You have two options:\n# 1. Automatic scanning for devices.\n# 2. Manual specification of port and baudrate.\n\n# Option 1: Automatic Device Scanning\n# If set to 'true', the driver will ignore 'port' and 'baudrate' settings.\n# It will automatically scan all ports and select the first device found.\nscan_for_devices: true\n\n# Option 2: Manual Device Configuration\n# If you prefer to manually specify the device port and baudrate,\n# first set 'scan_for_devices' to 'false', then uncomment and update\n# the 'port' and 'baudrate' settings below according to your device's specifications.\n#\n# To find your device's port, you can use the command: ls -l /dev/ttyUSB*\n#\n# Default baudrate is 115200. You can also use external tools like MT Manager\n# or Cutecom for baudrate configuration. For example, \n# to set baudrate to 115200, send the command: FA FF 30 00 D1, \n# or to set it to 921600, send: FA FF 18 01 80 68.\n\n#port: '/dev/ttyUSB0' # Uncomment and set your device's port.\n#baudrate: 115200     # Uncomment and set your device's baudrate.\n\n# Scan and serial communication timeout\n# -------------------------------------\n# the Xsens xspublic library default value is 100ms,  it indicates how long it waits for the reply, \n# for Jetson Nano, the /dev/ttyTSH1 port needs to set a higher value like 150ms\n# serial_timeout: 150\n\n# Device Scanning Selection\n# ----------------\n# Specify the device ID when operating multiple devices to select a specific one.\n# Format: Uppercase hexadecimal string.\n# Example: device_id: '00800210C2'\n#device_id: '00800210C2' \n\n# Publisher Configuration\npublisher_queue_size: 5\n\n# Time Options\n# ------------\n# Choose how timestamps are generated for the ROS Node:\n# 1) 0: Use UTCTime from MTI, recommended for accurate time synchronization.\n# 2) 1: Use UTCTime based on the SampleTimeFine from MTI.\n# 3) 2: Use UTCTime from the host device.\n# Note: Ensure \"UTC Time\" or \"Sample Time Fine\" is selected in MT Manager under Device Settings > Output Configurations, \n# or you could also set 'enable_outputConfig: true' for once to configure output.\ntime_option: 0\n\n# Logging Configuration\n# ---------------------\n# Enable or disable logging of sensor data into .mtb file. If enabled, logs are stored in /home/[user_name]/xsens_log/.\nenable_logging: false\n\n# Transform Frame ID\n# ------------------\n# Default frame_id is \"imu_link\". Change this if using multiple devices to avoid conflicts.\n# frame_id: \"imu_link\"\n\n\n# Sensor Configuration\n# ---------------------------\n# If you want to configure your sensor, firstly set this flag to true, then change desired values for the parameters below.\n# Note: This configuration is required only once, once it is successful, the configurations are stored in the sensor, then you could set this to false.\nenable_deviceConfig: false\n\n# Sensor Extended Kalman Filter Option Configurations:\n# --------------------------\n# ref: https://base.movella.com/s/article/article/MTi-Filter-Profiles-1605869708823\n# If you want to configure the filter option, firstly set the 'enable_filter_config', then:\n# For MTi-3/7/8/30/300/G-710/670(G)/680(G): change the 'mti_filter_option' to desired index below for your model.\n# For MTi-620(R)/MTi-630(R): change the 'mti620630filterlabel_rollpitch' and 'mti620630filterlabel_yaw' to the exact labels.\nenable_filter_config: false\n# ---------------------------\n# For MTi-670(G): 3 options: 0 = \"General\", 1 = \"GeneralNoBaro\", 2 = \"GeneralMag\"\n# For MTi-680(G), 3 options: 0 = \"General_RTK\", 1 = \"GeneralNoBaro_RTK\", 2 = \"GeneralMag_RTK\"\n# For MTi-3: 4 options: 0 = \"general\", 1 = \"high_mag_dep\", 2 = \"dynamic\", 3 = \"north_reference\", 4 = \"vru_general\"\n# For MTi-7:  3 options: 0 = \"General\", 1 = \"GeneralMag\",  2 = \"GeneralNoBaro\"\n# For MTi-8: 3 options: 0 = \"General_RTK\", 1 = \"GeneralNoBaro_RTK\", 2 = \"GeneralMag_RTK\"\n# For MTi-300: 0 = \"general\", 1 = \"high_mag_dep\", 2 = \"dynamic\", 3 = \"lwo_mag_dep\", 4 = \"vru_general\"\n# For MTI-G-710: 3 options: 0 = \"General\", 1 = \"GeneralNoBaro\",  2 = \"GeneralMag\", 3 = \"Automotive\", 4 = \"HighPerformanceEDR\"\nmti_filter_option: 4\n\n# For MTi-620(R) and MTi-630(R) roll pitch options: \"Responsive\", \"General\", \"Robust\"\nmti620630filterlabel_rollpitch: \"Robust\"\n# MTI-620(R) yaw has 2 options: \"VRU\", \"VRUAHS\" \n# MTI-630(R) yaw has 3 options: \"FixedMagRef\", \"NorthReference\", \"VRU\", \"VRUAHS\" \nmti620630filterlabel_yaw: \"NorthReference\"\n\n\n# MTi-2/320/200: filter only has VRU, you could enable the AHS options:\n# valid for MTI-2/3/320, MTi-20/30, MTI-200/300 when using the VRU filter options.\nenable_active_heading_stabilization: false\n\n\n# GNSS Lever Arm Configuration \n# -----------------------------------------------\n# Note: Adjust the GNSS lever arm settings only if the antenna's position relative to the sensor has changed.\n\n# GNSS Lever Arm (meters): [X, Y, Z]\n# Applicable to: MTi-8/680(G)\n# Default: [0.0, 0.0, 0.0] for unchanged antenna position.\nGNSS_LeverArm: [0.0, 0.0, 0.0] \n\n# u-blox GNSS Platform Settings\n# -----------------------------\n# Options:\n# 0 = Portable\n# 2 = Stationary\n# 3 = Pedestrian\n# 4 = Automotive\n# 5 = AtSea\n# 6 = Airborne \u003c 1g\n# 7 = Airborne \u003c 2g\n# 8 = Airborne \u003c 4g\n# 9 = Wrist\n# Applicable to: MTi-7/8/670(G)/680(G)/G-710 (GNSS/INS versions).\nublox_platform: 4 \n\n# u-blox GNSS Receiver Settings\n# -----------------------------\n# If set true: Enables Beidou, disables GLONASS\n# If set false: Disables Beidou, enables GLONASS\n# valid for MTi-7/8/670/680/710\nenable_beidou: false\n\n\n# Message Publishers, Also the output configurations if enable_outputConfig is set to true\n# ------------------\n# Enable or disable publication of various sensor data:\npub_utctime: true\npub_sampletime: true\npub_imu: true\npub_quaternion: true\npub_euler: true\npub_free_acceleration: true\npub_angular_velocity: true\npub_acceleration: true\npub_dq: false\npub_dv: false\npub_mag: true\npub_temperature: true\npub_pressure: false\npub_accelerationhr: false #High Rate Data Acceleration, when this is true, set enable_high_rate to true as well\npub_angular_velocity_hr: false #High Rate Data Angular Velocity,  when this is true, set enable_high_rate to true as well\npub_transform: true\npub_status: true\npub_twist: true         # For GNSS/INS Version of MTI only\npub_gnss: true          # For GNSS/INS Version of MTI only\npub_positionLLA: true   # For GNSS/INS Version of MTI only\npub_velocity: true      # For GNSS/INS Version of MTI only\npub_nmea: true          # For GNSS/INS Version of MTI only\npub_gnsspose: true      # For GNSS/INS Version of MTI only\n\n\n\n# Output Data Rate\n# ----------------\n# Set the desired output data rate in Hz. The driver will automatically configure the device to match this rate. \n# options for MTi-610/620/630/670/680/710 quaternion/euler/temperature/dq/dv/rateofturn/acc/free_acc: 1, 2, 4, 5, 8, 10, 16, 20, 25, 40, 50, 80, 100, 200, 400\n# options for MTi-670/680/710 position/velocity: 1, 2, 4, 5, 8, 10, 16, 20, 25, 40, 50, 80, 100, 200, 400\n# Change 'output_data_rate' if you are using mti-600 or 100 series\noutput_data_rate: 100\n# options for MTi-1/2/3/7/8: 1, 2, 4, 5, 10, 20, 25, 50, 100\n# options for MTi-600 and 710 series: mag, baro pressure, max 100Hz:1, 2, 4, 5, 10, 20, 25, 50, 100\n# options for MTi-7/8 series: baro pressure, max 50Hz:1, 2, 5, 10, 25, 50\n# Change 'output_data_rate_lower' if you are using mti-1 series or if you want to change output rate for mag, baro for other product series\noutput_data_rate_lower: 100\n# Change 'output_data_rate_baro_mtione' if you use mti-7/8 only.\noutput_data_rate_baro_mtione: 50\n\n# High Rate Data for AccelerationHR and RateOfTurn:\n# ------------------------------------------------\n# if you want to enable high rate data, firstly change the 'enable_high_rate' to true, then change the data rate according to your sensor model.\nenable_high_rate: false\n#options for MTi-1 v2: 800, 400, 200, 160\n#options for MTi-1 v3: 1000, 500, 250, 200, 125\n#options for MTi-600: 2000, 1000, 500\n#option for MTi-100/200/300: 1000\noutput_data_rate_acchr: 1000\n#options for MTi-1 v2: 800, 400, 200, 160\n#options for MTi-1 v3: 1000, 500, 250, 200, 125\n#options for MTI-600: 1600, 800\n#option for MTi-100/200/300: 1000\noutput_date_rate_gyrohr: 800\n\n\n# Filtering Option Flags \n# -------------------------------------\nenable_orientation_smoother: true #valid for MTi-G-710, MTi-670(G), MTi-680(G)\nenable_position_velocity_smoother: true #valid for MTi-680(G) only\nenable_continuous_zero_rotation_update: true #valid for MTi-680(G) only\n\n# Other option flags:\n# valid for MTi-2/3/7/8/20/30/620/630/670/680/200/300/710\nenable_inrun_compass_calibration: false\n\n\n# Set baudrate\n# ---------------\n#This is necessary if you have hig output rate, and if you see error message of 'data overflow' \nenable_setting_baudrate: false\n#options: 115200, 230400, 460800, 921600, 2000000\nset_baudrate_value: 921600\n\n\n# Manual Gyro Bias Estimation (MGBE) Configuration\n# ------------------------------------------------\n\n# Enable or disable manual gyro bias estimation.\n# If enabled, specify the 'event_interval' and 'duration' in 'manual_gyro_bias_param'.\nenable_manual_gyro_bias: false\n\n# Parameters for manual gyro bias estimation:\n# - 'event_interval': Time in seconds between two consecutive invocations.\n# - 'duration': Time in seconds for which the MGBE process executes each time.\n#   The minimum value for 'event_interval' is 10 seconds, for 'duration' is 2 seconds.\nmanual_gyro_bias_param: [15, 5] # [event_interval, duration]\n\n# Monitoring MGBE Success:\n# To verify if MGBE was successful, use 'rostopic echo /status'.\n# If the 'no_rotation_update_status' changes from 3 to 0, MGBE was successful.\n\n# RotSensor Frame changes\n# roll, pitch, yaw values\n# if your MTi-630 is installed upside-down(connector to the upside), then use 180deg for the roll.\nenable_rotsensor_frame_config: false\nrotsensor_rotation_euler: [180.0, 0.0, 0.0] \n\n# Sensor Standard Deviation (Optional)\n# ------------------------------------\n# Override the covariance matrix in sensor_msgs/Imu and sensor_msgs/MagneticField messages:\nlinear_acceleration_stddev: [0.0, 0.0, 0.0] # [m/s^2] Standard deviation for linear acceleration\nangular_velocity_stddev: [0.0, 0.0, 0.0]   # [rad/s] Standard deviation for angular velocity\norientation_stddev: [0.0, 0.0, 0.0]        # [rad]   Standard deviation for orientation\nmagnetic_field_stddev: [0.0, 0.0, 0.0]     # [Tesla] Standard deviation for magnetic field\n\n\n\n\n##Popular Xbus command\n# 1) GoToConfig: FA FF 30 00 D1, GoToMeasurement: FA FF 10 00 F1\n# 2) SetBaudrate: FA FF 18 01 80 68 (921k6) or FA FF 18 01 02 E6 (115k2) \n# 3) Set Filter Profile for MTi-680(G) with GeneralMag_RTK: FA FF 64 0E 47 65 6E 65 72 61 6C 4D 61 67 5F 52 54 4B 6C\n# 4) RestoreFactoryDef: FA FF 0E 00 F3\n# 5) SetOutputConfiguration \n## 5.1) MTi-670(G)/680(G)/MTi-G-710, 400Hz: FA FF C0 34 10 20 FF FF 10 60 FF FF 10 10 FF FF 20 10 01 90 40 20 01 90 80 20 01 90 C0 20 00 64 08 10 01 90 E0 20 FF FF 50 42 01 90 50 22 01 90 D0 12 01 90 70 10 FF FF 6E\n## 5.2) MTi-7/8/670(G)/680(G)/MTi-G-710, 100Hz:  FA FF C0 34 10 20 FF FF 10 60 FF FF 10 10 FF FF 20 10 00 64 40 20 00 64 80 20 00 64 C0 20 00 64 08 10 00 64 E0 20 FF FF 50 42 00 64 50 22 00 64 D0 12 00 64 70 10 FF FF A9\n## 5.3) MTi-630(R)/MTi-300, 400Hz: FA FF C0 24 10 20 FF FF 10 60 FF FF 10 10 FF FF 20 10 01 90 40 20 01 90 80 20 01 90 C0 20 00 64 08 10 01 90 E0 20 FF FF 95\n## 5.4) MTi-3/630(R)/MTi-300, 100Hz: FA FF C0 24 10 20 FF FF 10 60 FF FF 10 10 FF FF 20 10 00 64 40 20 00 64 80 20 00 64 C0 20 00 64 08 10 00 64 E0 20 FF FF 49","line_count":254,"redacted_lines":[],"functions":[],"params":[["scan_for_devices",true],["publisher_queue_size",5],["time_option",0],["enable_logging",false],["enable_deviceConfig",false],["enable_filter_config",false],["mti_filter_option",4],["mti620630filterlabel_rollpitch","Robust"],["mti620630filterlabel_yaw","NorthReference"],["enable_active_heading_stabilization",false],["GNSS_LeverArm",[0.0,0.0,0.0]],["ublox_platform",4],["enable_beidou",false],["pub_utctime",true],["pub_sampletime",true],["pub_imu",true],["pub_quaternion",true],["pub_euler",true],["pub_free_acceleration",true],["pub_angular_velocity",true],["pub_acceleration",true],["pub_dq",false],["pub_dv",false],["pub_mag",true],["pub_temperature",true],["pub_pressure",false],["pub_accelerationhr",false],["pub_angular_velocity_hr",false],["pub_transform",true],["pub_status",true],["pub_twist",true],["pub_gnss",true],["pub_positionLLA",true],["pub_velocity",true],["pub_nmea",true],["pub_gnsspose",true],["output_data_rate",100],["output_data_rate_lower",100],["output_data_rate_baro_mtione",50],["enable_high_rate",false],["output_data_rate_acchr",1000],["output_date_rate_gyrohr",800],["enable_orientation_smoother",true],["enable_position_velocity_smoother",true],["enable_continuous_zero_rotation_update",true],["enable_inrun_compass_calibration",false],["enable_setting_baudrate",false],["set_baudrate_value",921600],["enable_manual_gyro_bias",false],["manual_gyro_bias_param",[15,5]],["enable_rotsensor_frame_config",false],["rotsensor_rotation_euler",[180.0,0.0,0.0]],["linear_acceleration_stddev",[0.0,0.0,0.0]],["angular_velocity_stddev",[0.0,0.0,0.0]],["orientation_stddev",[0.0,0.0,0.0]],["magnetic_field_stddev",[0.0,0.0,0.0]]]},"src/localization/config/imu_driver.yaml":{"path":"src/localization/config/imu_driver.yaml","sha256":"3054c873cb9e6cb81a3d9c81f39b9ce3e1dfcb57f4998e9b4e5de5f0d24577f6","text":"# xsens_mti_driver 파라미터. Xsens DB8GG04M은 udev에서 /dev/imu로 고정한다.\nport: /dev/imu\n# 2026-08-30 실제 MTi-3 자동 탐색 결과: device ID 03889250, 115200 baud.\ndevice_id: \"03889250\"\nbaudrate: 115200\nframe_id: imu_link\npublisher_queue_size: 10\n# MTi-3의 미동기화 UTC 대신 PC 수신시각을 사용한다.\ntime_option: 2\n\n# MTi-3 온보드 필터 설정은 장치 비휘발성 메모리에 유지된다.\n# 프로파일을 바꿀 때만 두 en
