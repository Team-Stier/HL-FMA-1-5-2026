\n\n  recovery_active_ = true;\n  const bool twist_healthy = twistIsFresh(now);\n  const double speed_mps = twist_healthy\n      ? twist_.message.twist.twist.linear.x\n      : 0.0;\n  const bool gps_only_candidate_is_stationary = twist_healthy &&\n      std::abs(speed_mps) \u003c= policy_.config().max_stationary_speed_mps;\n  const bool new_candidate_epoch = last_candidate_stamp_.isZero() ||\n      message->header.stamp > last_candidate_stamp_;\n\n  // 정지 중 수신한 서로 다른 GPS epoch만 후보로 센다.\n  if (!new_candidate_epoch) {\n    resetCandidateCluster();\n\n  } else if (gps_only_candidate_is_stationary) {\n    last_candidate_stamp_ = message->header.stamp;\n    updateCandidateCluster(*message);\n  } else {\n    last_candidate_stamp_ = message->header.stamp;\n    resetCandidateCluster();\n  }\n\n  RelocalizationObservation observation;\n  observation.have_prior_anchor = true;\n  observation.long_outage = true;\n  observation.twist_healthy = twist_healthy;\n  observation.speed_mps = speed_mps;\n  observation.global_odometry_healthy = globalOdometryIsFresh(now);\n  observation.consecutive_candidates = consecutive_candidates_;\n\n  const RelocalizationDecision decision = policy_.evaluate(observation);\n  publishRecoveryStatus(decision.state, decision.relocalizing);\n  if (decision.action == RecoveryAction::RESET_WITH_GPS &&\n             requestGpsOnlyReset(*message, now)) {\n    publishRecoveryStatus(\"WAITING_FOR_GLOBAL_CONFIRMATION\", true);\n  }\n}\n\nvoid RelocalizationCoordinator::gpsGatePoseCallback(\n    const geometry_msgs::PoseWithCovarianceStampedConstPtr& message) {\n  const ros::Time now = ros::Time::now();\n  if (!validatePose(*message, now)) {\n    return;\n  }\n  // 재앵커 handshake 중에는 gate 적용 ack가 공개 승인보다 먼저 와야 한다.\n  if (reanchor_pending_) {\n    return;\n  }\n  gps_pose_publisher_.publish(message);\n  have_prior_anchor_ = true;\n  last_gate_pose_receipt_time_ = now;\n  resetCandidateCluster();\n  last_candidate_stamp_ = ros::Time(0);\n  reset_pending_ = false;\n  consecutive_global_confirmations_ = 0;\n  recovery_active_ = false;\n  publishRecoveryStatus(\"TRACKING\", false);\n}\n\nvoid RelocalizationCoordinator::twistCallback(\n    const geometry_msgs::TwistWithCovarianceStampedConstPtr& message) {\n  twist_.seen = true;\n  twist_.receipt_time = ros::Time::now();\n  twist_.message = *message;\n  twist_.valid = !message->header.stamp.isZero() &&\n                 std::isfinite(message->twist.twist.linear.x);\n}\n\nvoid RelocalizationCoordinator::globalOdometryCallback(\n    const nav_msgs::OdometryConstPtr& message) {\n  const ros::Time now = ros::Time::now();\n  global_odometry_.seen = true;\n  global_odometry_.receipt_time = now;\n  global_odometry_.message = *message;\n  global_odometry_.valid = !message->header.stamp.isZero() &&\n      message->header.frame_id == map_frame_ &&\n      std::isfinite(message->pose.pose.position.x) &&\n      std::isfinite(message->pose.pose.position.y) &&\n      finiteQuaternion(message->pose.pose.orientation);\n\n  if (reset_pending_) {\n    const bool post_reset_output =\n        message->header.stamp >= reset_request_time_;\n    const bool matches_target = globalOdometryIsFresh(now) &&\n        planarDistance(message->pose.pose.position,\n                       reset_target_.pose.pose.position) \u003c=\n            max_global_confirmation_distance_m_;\n    const bool new_confirmation_stamp =\n        last_global_confirmation_stamp_.isZero() ||\n        message->header.stamp > last_global_confirmation_stamp_;\n    if (post_reset_output && matches_target) {\n      if (new_confirmation_stamp) {\n        ++consecutive_global_confirmations_;\n        last_global_confirmation_stamp_ = message->header.stamp;\n        if (consecutive_global_confirmations_ >=\n            required_global_confirmations_) {\n          reset_pending_ = false;\n          consecutive_global_confirmations_ = 0;\n          requestGateReanchor(reset_target_, \"RECOVERED_WITH_GPS_RESET\");\n        }\n      }\n    } else {\n      consecutive_global_confirmations_ = 0;\n      last_global_confirmation_stamp_ = ros::Time(0);\n    }\n  }\n}\n\nvoid RelocalizationCoordinator::gateRelocalizingCallback(\n    const std_msgs::BoolConstPtr& message) {\n  gate_relocalizing_ = message->data;\n  if (!recovery_active_ && !reset_pending_ && !reanchor_pending_) {\n    publishRecoveryStatus(gate_relocalizing_ ? \"SHORT_RECOVERY\" : \"TRACKING\",\n                          gate_relocalizing_);\n  }\n}\n\nvoid RelocalizationCoordinator::reanchorAcceptedCallback(\n    const mando_localization::GpsGateReanchorConstPtr& message) {\n  const ros::Time now = ros::Time::now();\n  if (!reanchor_pending_) {\n    return;\n  }\n  if (!validatePose(message->pose, now)) {\n    ROS_WARN(\"Ignoring invalid or stale GPS gate reanchor ack\");\n    return;\n  }\n  const double stamp_gap = std::abs(\n      (message->pose.header.stamp - reanchor_target_.header.stamp).toSec());\n  const double position_gap = planarDistance(\n      message->pose.pose.pose.position,\n      reanchor_target_.pose.pose.position);\n  if (message->transaction_id != pending_reanchor_transaction_id_ ||\n      stamp_gap > 1.0e-6 || position_gap > 1.0e-6) {\n    ROS_WARN_STREAM(\"Ignoring mismatched GPS gate reanchor ack: transaction \"\n                    \u003c\u003c message->transaction_id \u003c\u003c \"/\"\n                    \u003c\u003c pending_reanchor_transaction_id_ \u003c\u003c \", stamp gap \"\n                    \u003c\u003c stamp_gap \u003c\u003c \" s, position gap \" \u003c\u003c position_gap\n                    \u003c\u003c \" m\");\n    return;\n  }\n  ROS_INFO_STREAM(\"GPS gate reanchor ack accepted: transaction \"\n                  \u003c\u003c message->transaction_id);\n  finishRecovery(reanchor_target_, pending_completion_state_);\n}\n\nvoid RelocalizationCoordinator::timerCallback(const ros::TimerEvent&) {\n  if (reset_pending_) {\n    const double age = (ros::Time::now() - reset_request_time_).toSec();\n    if (!std::isfinite(age) || age > global_confirmation_timeout_sec_) {\n      reset_pending_ = false;\n      recovery_active_ = true;\n      consecutive_global_confirmations_ = 0;\n      last_global_confirmation_stamp_ = ros::Time(0);\n      resetCandidateCluster();\n      recovery_state_ = \"GLOBAL_CONFIRMATION_TIMEOUT\";\n    }\n  }\n  if (reanchor_pending_) {\n    const double age =\n        (ros::Time::now() - reanchor_request_time_).toSec();\n    if (!std::isfinite(age) || age > reanchor_ack_timeout_sec_) {\n      reanchor_pending_ = false;\n      pending_reanchor_transaction_id_ = 0U;\n      recovery_active_ = true;\n      resetCandidateCluster();\n      recovery_state_ = \"GPS_GATE_REANCHOR_TIMEOUT\";\n      ROS_WARN(\"GPS gate reanchor ack timed out; recovery remains fail-closed\");\n    }\n  }\n  // Supervisor가 GPS callback 중단을 곧바로 stale fault로 오인하지 않도록\n  // Coordinator 자체의 상태 heartbeat는 센서 수신과 독립적으로 유지한다.\n  publishRecoveryStatus(recovery_state_, recovery_active_);\n}\n\nbool RelocalizationCoordinator::validatePose(\n    const geometry_msgs::PoseWithCovarianceStamped& message,\n    const ros::Time& now) const {\n  if (message.header.stamp.isZero() ||\n      message.header.frame_id != map_frame_ ||\n      !std::isfinite(message.pose.pose.position.x) ||\n      !std::isfinite(message.pose.pose.position.y) ||\n      !std::isfinite(message.pose.pose.position.z) ||\n      !finiteQuaternion(message.pose.pose.orientation)) {\n    return false;\n  }\n  const double age = (now - message.header.stamp).toSec();\n  return std::isfinite(age) && age >= -candidate_max_future_stamp_sec_ &&\n         age \u003c= candidate_max_message_age_sec_ &&\n         std::isfinite(message.pose.covariance[0]) &&\n         std::isfinite(message.pose.covariance[7]) &&\n         message.pose.covariance[0] >= 0.0 &&\n         message.pose.covariance[7] >= 0.0;\n}\n\nbool RelocalizationCoordinator::twistIsFresh(const ros::Time& now) const {\n  if (!twist_.seen || !twist_.valid || twist_.receipt_time.isZero()) {\n    return false;\n  }\n  const double receipt_age = (now - twist_.receipt_time).toSec();\n  const double stamp_age = (now - twist_.message.header.stamp).toSec();\n  return std::isfinite(receipt_age) && std::isfinite(stamp_age) &&\n         receipt_age >= 0.0 && receipt_age \u003c= twist_timeout_sec_ &&\n         stamp_age >= -candidate_max_future_stamp_sec_ &&\n         stamp_age \u003c= twist_timeout_sec_;\n}\n\nbool RelocalizationCoordinator::globalOdometryIsFresh(\n    const ros::Time& now) const {\n  if (!global_odometry_.seen || !global_odometry_.valid ||\n      global_odometry_.receipt_time.isZero()) {\n    return false;\n  }\n  const double receipt_age = (now - global_odometry_.receipt_time).toSec();\n  const double stamp_age = (now - global_odometry_.message.header.stamp).toSec();\n  return std::isfinite(receipt_age) && std::isfinite(stamp_age) &&\n         receipt_age >= 0.0 && receipt_age \u003c= global_odometry_timeout_sec_ &&\n         stamp_age >= -candidate_max_future_stamp_sec_ &&\n         stamp_age \u003c= global_odometry_timeout_sec_;\n}\n\nvoid RelocalizationCoordinator::updateCandidateCluster(\n    const geometry_msgs::PoseWithCovarianceStamped& candidate) {\n  if (!have_candidate_cluster_anchor_ ||\n      planarDistance(candidate.pose.pose.position,\n                     candidate_cluster_anchor_position_) >\n          candidate_cluster_radius_m_) {\n    consecutive_candidates_ = 1;\n    candidate_cluster_anchor_position_ = candidate.pose.pose.position;\n    have_candidate_cluster_anchor_ = true;\n  } else {\n    ++consecutive_candidates_;\n  }\n}\n\nvoid RelocalizationCoordinator::resetCandidateCluster() {\n  consecutive_candidates_ = 0;\n  have_candidate_cluster_anchor_ = false;\n}\n\nbool RelocalizationCoordinator::requestGpsOnlyReset(\n    const geometry_msgs::PoseWithCovarianceStamped& candidate,\n    const ros::Time& now) {\n  if (!set_pose_client_.waitForExistence(\n          ros::Duration(set_pose_service_wait_timeout_sec_))) {\n    publishRecoveryStatus(\"SET_POSE_SERVICE_UNAVAILABLE\", true);\n    return false;\n  }\n\n  robot_localization::SetPose service;\n  service.request.pose.header.stamp = now;\n  service.request.pose.header.frame_id = map_frame_;\n  service.request.pose.pose = global_odometry_.message.pose;\n  service.request.pose.pose.pose.position.x = candidate.pose.pose.position.x;\n  service.request.pose.pose.pose.position.y = candidate.pose.pose.position.y;\n  service.request.pose.pose.covariance[0] = candidate.pose.covariance[0];\n  service.request.pose.pose.covariance[1] = candidate.pose.covariance[1];\n  service.request.pose.pose.covariance[6] = candidate.pose.covariance[6];\n  service.request.pose.pose.covariance[7] = candidate.pose.covariance[7];\n  if (!set_pose_client_.call(service)) {\n    publishRecoveryStatus(\"SET_POSE_CALL_FAILED\", true);\n    return false;\n  }\n\n  reset_target_ = candidate;\n  reset_request_time_ = now;\n  reset_pending_ = true;\n  consecutive_global_confirmations_ = 0;\n  last_global_confirmation_stamp_ = ros::Time(0);\n  recovery_active_ = true;\n  return true;\n}\n\nvoid RelocalizationCoordinator::requestGateReanchor(\n    const geometry_msgs::PoseWithCovarianceStamped& candidate,\n    const std::string& completion_state) {\n  reanchor_target_ = candidate;\n  pending_reanchor_transaction_id_ = next_reanchor_transaction_id_++;\n  if (next_reanchor_transaction_id_ == 0U) {\n    next_reanchor_transaction_id_ = 1U;\n  }\n  pending_completion_state_ = completion_state;\n  reanchor_request_time_ = ros::Time::now();\n  reanchor_pending_ = true;\n  recovery_active_ = true;\n  mando_localization::GpsGateReanchor command;\n  command.transaction_id = pending_reanchor_transaction_id_;\n  command.pose = reanchor_target_;\n  gps_reanchor_publisher_.publish(command);\n  publishRecoveryStatus(\"WAITING_FOR_GPS_GATE_REANCHOR\", true);\n}\n\nvoid RelocalizationCoordinator::finishRecovery(\n      const geometry_msgs::PoseWithCovarianceStamped& candidate,\n      const std::string& state) {\n  gps_pose_publisher_.publish(candidate);\n  have_prior_anchor_ = true;\n  last_gate_pose_receipt_time_ = ros::Time::now();\n  reset_pending_ = false;\n  reanchor_pending_ = false;\n  pending_reanchor_transaction_id_ = 0U;\n  recovery_active_ = false;\n  gate_relocalizing_ = false;\n  consecutive_global_confirmations_ = 0;\n  last_global_confirmation_stamp_ = ros::Time(0);\n  resetCandidateCluster();\n  last_candidate_stamp_ = ros::Time(0);\n  publishRecoveryStatus(state, false);\n}\n\nvoid RelocalizationCoordinator::publishRecoveryStatus(\n    const std::string& state, const bool active) {\n  recovery_state_ = state;\n  recovery_active_ = active;\n  std_msgs::String state_message;\n  state_message.data = state;\n  recovery_state_publisher_.publish(state_message);\n  std_msgs::Bool active_message;\n  active_message.data = active;\n  recovery_active_publisher_.publish(active_message);\n  gps_relocalizing_publisher_.publish(active_message);\n}\n\n}  // namespace mando_localization","line_count":497,"redacted_lines":[],"functions":[{"line":163,"label":"void RelocalizationCoordinator::gpsCandidateCallback("},{"line":212,"label":"void RelocalizationCoordinator::gpsGatePoseCallback("},{"line":233,"label":"void RelocalizationCoordinator::twistCallback("},{"line":242,"label":"void RelocalizationCoordinator::globalOdometryCallback("},{"line":282,"label":"void RelocalizationCoordinator::gateRelocalizingCallback("},{"line":291,"label":"void RelocalizationCoordinator::reanchorAcceptedCallback("},{"line":320,"label":"void RelocalizationCoordinator::timerCallback(const ros::TimerEvent&) {"},{"line":349,"label":"bool RelocalizationCoordinator::validatePose("},{"line":369,"label":"bool RelocalizationCoordinator::twistIsFresh(const ros::Time& now) const {"},{"line":381,"label":"bool RelocalizationCoordinator::globalOdometryIsFresh("},{"line":395,"label":"void RelocalizationCoordinator::updateCandidateCluster("},{"line":409,"label":"void RelocalizationCoordinator::resetCandidateCluster() {"},{"line":414,"label":"bool RelocalizationCoordinator::requestGpsOnlyReset("},{"line":447,"label":"void RelocalizationCoordinator::requestGateReanchor("},{"line":466,"label":"void RelocalizationCoordinator::finishRecovery("},{"line":484,"label":"void RelocalizationCoordinator::publishRecoveryStatus("}],"params":[]},"src/localization/src/relocalization/relocalization_policy.cpp":{"path":"src/localization/src/relocalization/relocalization_policy.cpp","sha256":"686e4e15e2ac70f125f3594eabb780d738547d5a6238763ecb99bdeb591d3156","text":"#include \"relocalization/relocalization_policy.hpp\"\n\n#include \u003ccmath>\n#include \u003cstdexcept>\n\nnamespace mando_localization {\n\nRelocalizationPolicy::RelocalizationPolicy(RelocalizationPolicyConfig config)\n    : config_(config) {\n  if (!std::isfinite(config_.max_stationary_speed_mps) ||\n      config_.max_stationary_speed_mps \u003c 0.0 ||\n      config_.gps_only_required_consecutive_candidates \u003c= 0) {\n    throw std::invalid_argument(\"재정합 정책 파라미터가 유효하지 않습니다.\");\n  }\n}\n\nRelocalizationDecision RelocalizationPolicy::evaluate(\n    const RelocalizationObservation& observation) const {\n  if (!observation.have_prior_anchor || !observation.long_outage) {\n    return {RecoveryAction::NONE, false, \"IDLE\", \"no_long_outage\"};\n  }\n\n  if (!config_.automatic_gps_only_reset_enabled) {\n    return {RecoveryAction::NONE, true, \"GPS_ONLY_BLOCKED\",\n            \"automatic_gps_only_reset_disabled\"};\n  }\n  if (config_.require_measured_datum && !config_.gps_datum_measured) {\n    return {RecoveryAction::NONE, true, \"GPS_ONLY_BLOCKED_DATUM\",\n            \"measured_map_datum_required\"};\n  }\n  if (!observation.twist_healthy ||\n      !std::isfinite(observation.speed_mps) ||\n      std::abs(observation.speed_mps) > config_.max_stationary_speed_mps) {\n    return {RecoveryAction::NONE, true, \"WAITING_FOR_STATIONARY\",\n            \"vehicle_not_confirmed_stationary\"};\n  }\n  if (!observation.global_odometry_healthy) {\n    return {RecoveryAction::NONE, true, \"WAITING_FOR_GLOBAL_ODOMETRY\",\n            \"global_odometry_not_healthy\"};\n  }\n  if (observation.consecutive_candidates \u003c\n      config_.gps_only_required_consecutive_candidates) {\n    return {RecoveryAction::NONE, true, \"VALIDATING_GPS_ONLY\",\n            \"waiting_for_stable_gps_cluster\"};\n  }\n  return {RecoveryAction::RESET_WITH_GPS, true, \"GPS_ONLY_RESET_READY\",\n          \"stable_stationary_gps_confirmed\"};\n}\n\n}  // namespace mando_localization","line_count":50,"redacted_lines":[],"functions":[{"line":17,"label":"RelocalizationDecision RelocalizationPolicy::evaluate("}],"params":[]},"src/localization/config/imu_heading_calibration.yaml":{"path":"src/localization/config/imu_heading_calibration.yaml","sha256":"40b722d01ae321fff4c4262147d72c9de9598ad7d2ea1053c2eb0ed71a9aaa46","text":"# CalibratedIMU: 정지 드리프트를 제외하고 시작 방향/GNSS offset을 적용한다.\n# 잠정 시작 기준이며 실차 정확도를 검증한 수치가 아니다.\nencoder_yaw_hold:\n  enabled: true\n  # alive가 갱신되는 feedback.encoder==0 및 speed==0이면 yaw와 차량 Z 각속도를 고정한다.\n  # 비영점 tick(±1 포함)은 즉시 이동으로 처리한다. raw/normalized IMU는 보존한다.\n  max_feedback_age_sec: 0.30\n  # IMU 시각 이전 feedback만 사용한다. 수신 중단/중복 alive는 정지 증거가 아니다.\n  history_max_samples: 500\n  # Header 없는 feedback의 PC 수신 시각 이력 상한. 시간 역행 시 초기화한다.\n\nimu_heading_calibration:\n  enabled: true\n  # GNSS 기반 yaw 보정 사용 여부. false이면 새 보정을 수행하지 않는다.\n\n  direction_mode: forward_start\n  # forward_start: 첫 보정까지 전진 직진을 가정. signed_encoder: 검증된 속도 부호로 후진도 구분한다.\n  # Gear=0만으로 전진을 판단하지 않는다. signed_encoder는 실제 전·후진 속도 부호 검증 후 사용한다.\n\n  one_shot: true\n  # true이면 세션에서 한 번 정합한 뒤 offset을 유지한다. false이면 조건 충족 시 다시 정합한다.\n\n  max_correction_rate_degps: 90.0\n  # 보정각 적용 속도 상한 [도/초]. 목표 offset까지 서서히 바꾼다.\n\n  history_sec: 2.0\n  # 시각 정합용 IMU·엔코더 기록 보관 시간 [초]. GNSS 최대 허용 지연보다 길어야 한다.\n\n  history_max_samples: 500\n  # IMU·엔코더 기록을 각각 최대 몇 개까지 보관할지 정한다.\n\n  max_imu_gap_sec: 0.10\n  # IMU 보간에 허용하는 두 표본 사이 최대 간격 [초]. 보정각 적용 시간 간격도 이 값으로 제한한다.\n\n  max_imu_age_sec: 0.25\n  # 현재 ROS 시각에서 IMU 측정 시각까지 허용하는 최대 지연 [초].\n\n  max_encoder_age_sec: 0.30\n  # 엔코더 최대 지연 [초]. GNSS 시각에 대응시키는 직전 엔코더 표본의 나이에도 적용한다.\n\n  max_gnss_age_sec: 1.0\n  # 현재 ROS 시각에서 GNSS 측정 시각까지 허용하는 최대 지연 [초].\n\n  max_gnss_time_accuracy_sec: 0.05\n  # GNSS가 보고한 시각 불확실성의 허용 상한 [초]. 실제 센서 간 지연과는 다르다.\n\n  max_future_sec: 0.05\n  # 센서 측정 시각이 현재 ROS 시각보다 앞서는 것을 허용하는 최대 범위 [초].\n\n  pending_wait_sec: 0.15\n  # GNSS와 같은 시각의 IMU·엔코더가 도착하기를 기다리는 실제 시간 상한 [초].\n\n  pending_max_samples: 20\n  # 시각 정합을 기다리는 GNSS 최대 개수. 넘으면 가장 오래된 표본을 버린다.\n\n  clock_ready_timeout_sec: 3.0\n  # 시간 동기화 준비 상태의 유효 시간 [초]. ROS 시각과 실제 경과 시간 모두 확인한다.\n\n  min_speed_mps: 1.0\n  # 보정에 필요한 최소 GNSS 이동 속도 [m/s]. 저속에서 불안정한 이동 방향을 제외한다.\n\n  min_encoder_speed_mps: 0.5\n  # 보정에 필요한 최소 엔코더 속력 [m/s]. 절댓값을 비교한다.\n\n  max_speed_difference_mps: 0.75\n  # GNSS·엔코더 속력 차이 허용값 [m/s]. 아래 비율로 계산한 값과 비교해 큰 쪽을 사용한다.\n\n  max_speed_difference_ratio: 0.4\n  # 속력 차이 허용 비율. GNSS 속력 × 0.4와 위 절대 허용값 중 큰 쪽을 적용한다.\n\n  min_satellites: 6\n  # 유효 GNSS fix와 함께 요구하는 최소 위성 수.\n\n  max_horizontal_accuracy_m: 2.0\n  # GNSS가 보고한 수평 위치 불확실성의 허용 상한 [m].\n\n  max_speed_accuracy_mps: 0.5\n  # GNSS가 보고한 속도 불확실성의 허용 상한 [m/s].\n\n  max_heading_accuracy_deg: 10.0\n  # GNSS가 보고한 이동 방향 불확실성의 허용 상한 [도].\n\n  max_velocity_heading_difference_deg: 5.0\n  # GNSS heading과 동·북 속도 성분으로 계산한 이동 방향의 최대 허용 차이 [도].\n\n  min_window_sec: 3.0\n  # 보정 후보가 연속으로 조건을 만족해야 하는 최소 관측 구간 [초].\n\n  min_samples: 6\n  # 보정 확정에 필요한 최소 GNSS 후보 개수. 시간·거리 조건도 함께 충족해야 한다.\n\n  max_gnss_gap_sec: 0.5\n  # 연속 후보 GNSS 사이 최대 간격 [초]. 넘으면 모아 둔 후보 구간을 초기화한다.\n\n  min_displacement_m: 3.0\n  # 후보 구간의 처음과 끝 GPS 위치 사이 최소 직선 거리 [m]. 누적 주행거리가 아니다.\n\n  max_window_sec: 12.0\n  # 보정 후보 구간에 보관할 최대 시간 [초]. 오래된 후보는 제외한다.\n\n  max_course_spread_deg: 8.0\n  # 후보 구간에서 GNSS 이동 방향의 최대 허용 변화 폭 [도]. 직진 여부를 판단한다.\n\n  max_offset_spread_deg: 5.0\n  # 후보 구간에서 GNSS 방향 − IMU 차량 yaw 차이의 최대 허용 변화 폭 [도].\n\n  max_yaw_rate_degps: 3.0\n  # IMU 자세·자이로로 계산한 yaw 회전 속도의 절댓값 상한 [도/초]. 선회 구간을 제외한다.\n\n  max_tilt_deg: 15.0\n  # 차량 roll·pitch 및 IMU pitch의 절댓값 상한 [도]. 큰 기울기에서 보정을 제외한다.\n\n  max_displacement_course_difference_deg: 15.0\n  # 구간 처음→끝 GPS 변위 방향과 평균 GNSS 이동 방향의 최대 허용 차이 [도].\n\n  heading_stddev_floor_deg: 10.0\n  # 보정 후 추가할 yaw 불확실성의 표준편차 하한 [도]. 구간 내 최대 GNSS 방향 불확실성과 큰 쪽을 사용한다.\n  # 연속 GNSS 표본은 독립이 아니므로 표본 수가 많아도 분산을 나누어 줄이지 않는다.\n\n  held_heading_uncertainty_deg_per_sec: 0.1\n  # 마지막 정합 후 경과 시간에 비례해 추가하는 불확실성 증가율 [도/초]. yaw 값 자체를 돌리는 설정은 아니다.","line_count":121,"redacted_lines":[],"functions":[],"params":[["encoder_yaw_hold.enabled",true],["encoder_yaw_hold.max_feedback_age_sec",0.3],["encoder_yaw_hold.history_max_samples",500],["imu_heading_calibration.enabled",true],["imu_heading_calibration.direction_mode","forward_start"],["imu_heading_calibration.one_shot",true],["imu_heading_calibration.max_correction_rate_degps",90.0],["imu_heading_calibration.history_sec",2.0],["imu_heading_calibration.history_max_samples",500],["imu_heading_calibration.max_imu_gap_sec",0.1],["imu_heading_calibration.max_imu_age_sec",0.25],["imu_heading_calibration.max_encoder_age_sec",0.3],["imu_heading_calibration.max_gnss_age_sec",1.0],["imu_heading_calibration.max_gnss_time_accuracy_sec",0.05],["imu_heading_calibration.max_future_sec",0.05],["imu_heading_calibration.pending_wait_sec",0.15],["imu_heading_calibration.pending_max_samples",20],["imu_heading_calibration.clock_ready_timeout_sec",3.0],["imu_heading_calibration.min_speed_mps",1.0],["imu_heading_calibration.min_encoder_speed_mps",0.5],["imu_heading_calibration.max_speed_difference_mps",0.75],["imu_heading_calibration.max_speed_difference_ratio",0.4],["imu_heading_calibration.min_satellites",6],["imu_heading_calibration.max_horizontal_accuracy_m",2.0],["imu_heading_calibration.max_speed_accuracy_mps",0.5],["imu_heading_calibration.max_heading_accuracy_deg",10.0],["imu_heading_calibration.max_velocity_heading_difference_deg",5.0],["imu_heading_calibration.min_window_sec",3.0],["imu_heading_calibration.min_samples",6],["imu_heading_calibration.max_gnss_gap_sec",0.5],["imu_heading_calibration.min_displacement_m",3.0],["imu_heading_calibration.max_window_sec",12.0],["imu_heading_calibration.max_course_spread_deg",8.0],["imu_heading_calibration.max_offset_spread_deg",5.0],["imu_heading_calibration.max_yaw_rate_degps",3.0],["imu_heading_calibration.max_tilt_deg",15.0],["imu_heading_calibration.max_displacement_course_difference_deg",15.0],["imu_heading_calibration.heading_stddev_floor_deg",10.0],["imu_heading_calibration.held_heading_uncertainty_deg_per_sec",0.1]]},"src/localization/config/initial_heading.yaml":{"path":"src/localization/config/initial_heading.yaml","sha256":"ae247a7705d90e7e82f8f3abc14b15fea26e4661be862c7a5b016d749ac471fd","text":"# 용인 RDDF 1_right, index=0의 path_yaw_rad. ENU: 동쪽 0, 반시계 양수.\n# 차량을 이 출발 방향에 놓고 실행한다. 자동 현재 위치/도로 선택은 하지 않는다.\n# 시작 경로를 바꾸면 RDDF 원본의 해당 yaw와 source를 함께 갱신한다.\ninitial_heading:\n  yaw_rad: &start_yaw 2.8181825146\n  standard_deviation_deg: 10.0\n  # 배치 방향의 잠정 불확실성이다. 측량 정확도가 아니다.\n  source: rddf/yongin_1_right.csv#index=0\n\n# 같은 yaw를 두 EKF에도 먼저 설정한다. 엔코더가 IMU보다 먼저 와도 yaw=0으로 시작하지 않는다.\n# x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az\ninitial_state: [0, 0, 0, 0, 0, *start_yaw, 0, 0, 0, 0, 0, 0, 0, 0, 0]","line_count":12,"redacted_lines":[],"functions":[],"params":[["initial_heading.yaw_rad",2.8181825146],["initial_heading.standard_deviation_deg",10.0],["initial_heading.source","rddf/yongin_1_right.csv#index=0"],["initial_state",[0,0,0,0,0,2.8181825146,0,0,0,0,0,0,0,0,0]]]},"src/localization/config/gps_reference.yaml":{"path":"src/localization/config/gps_reference.yaml","sha256":"6b63e1d4cec7285172ba2e29df2b7a167b75bb3e312b9cfd6807b729cdf56ec0","text":"reference:\n  # first_fix는 지도 없이 개발할 때만 쓴다. 실제 map 사용 시 manual_datum으로 바꾼다.\n  mode: first_fix\n  measured: false\n  measured_at: \"\"\n  source: \"\"\n  latitude_deg: 0.0\n  longitude_deg: 0.0\n  altitude_m: 0.0\n  yaw_offset_rad: 0.0\n  map_x_m: 0.0\n  map_y_m: 0.0\n  map_z_m: 0.0\n\n# NavSatFix는 gps_link(안테나 위상 중심)의 위치다. Global EKF에는 base_link\n# 위치를 넣어야 하므로 GPS 측정 시각의 Local Odometry yaw로 레버암을 map 좌표계에\n# 회전한 뒤 제거한다. x/y는 base_link -> gps_link 기준이다.\nlever_arm:\n  x_m: 0.65\n  y_m: 0.0\n  # 기존 키 유지: 이제 GPS를 둘러싼 Local 보간 표본 사이의 최대 간격이다.\n  # 최신 Local과 GPS 측정 시각의 차이는 이 값으로 제한하지 않는다.\n  max_yaw_stamp_skew_sec: 0.10\n  manual_datum_base_yaw_rad: 0.0\n  calibration_state: provisional\n  source: \"user_report_2026-09-04_longitudinal_only\"\n\ntiming:\n  local_history_duration_sec: 2.0\n  local_history_max_samples: 200\n  pending_wait_sec: 0.10\n  pending_max_samples: 20\n  require_clock_ready: true\n  clock_ready_timeout_sec: 3.0\n\nquality:\n  minimum_fix_status: 0\n  max_message_age_sec: 1.0\n  max_future_stamp_sec: 0.10\n  fallback_horizontal_variance_m2: 25.0\n  fallback_vertical_variance_m2: 100.0\n  max_horizontal_variance_m2: 25.0\n  max_vertical_variance_m2: 100.0\n  max_step_distance_m: 50.0\n  unobserved_variance: 1000000.0\n  max_position_innovation_m: 10.0\n  max_mahalanobis_distance: 5.0\n  max_reanchor_candidate_distance_m: 2.0","line_count":48,"redacted_lines":[],"functions":[],"params":[["reference.mode","first_fix"],["reference.measured",false],["reference.measured_at",""],["reference.source",""],["reference.latitude_deg",0.0],["reference.longitude_deg",0.0],["reference.altitude_m",0.0],["reference.yaw_offset_rad",0.0],["reference.map_x_m",0.0],["reference.map_y_m",0.0],["reference.map_z_m",0.0],["lever_arm.x_m",0.65],["lever_arm.y_m",0.0],["lever_arm.max_yaw_stamp_skew_sec",0.1],["lever_arm.manual_datum_base_yaw_rad",0.0],["lever_arm.calibration_state","provisional"],["lever_arm.source","user_report_2026-09-04_longitudinal_only"],["timing.local_history_duration_sec",2.0],["timing.local_history_max_samples",200],["timing.pending_wait_sec",0.1],["timing.pending_max_samples",20],["timing.require_clock_ready",true],["timing.clock_ready_timeout_sec",3.0],["quality.minimum_fix_status",0],["quality.max_message_age_sec",1.0],["quality.max_future_stamp_sec",0.1],["quality.fallback_horizontal_variance_m2",25.0],["quality.fallback_vertical_variance_m2",100.0],["quality.max_horizontal_variance_m2",25.0],["quality.max_vertical_variance_m2",100.0],["quality.max_step_distance_m",50.0],["quality.unobserved_variance",1000000.0],["quality.max_position_innovation_m",10.0],["quality.max_mahalanobis_distance",5.0],["quality.max_reanchor_candidate_distance_m",2.0]]},"src/localization/config/time_sync.yaml":{"path":"src/localization/config/time_sync.yaml","sha256":"6eefe4d5e8951a3f51ecaf9a29925cfd6c96094db0ea43aa9dd0063bd30ecca9","text":"# NTP는 PC UTC 정렬만 검사한다. IMU/encoder 측정 epoch, PPS 또는 USB 지연을 보장하지 않는다.\nclock_preflight:\n  backend: auto\n  command_timeout_sec: 2.0\n  max_abs_offset_sec: 0.05\n  max_root_distance_sec: 0.05\n  # timesyncd의 현재 최대 poll 2048초를 수용하는 잠정 운영 기준이다.\n  max_sample_age_sec: 3600.0\n  max_poll_interval_sec: 2048.0\n  max_poll_age_factor: 2.0\n  min_sample_age_limit_sec: 120.0\n  future_sample_tolerance_sec: 1.0\n\ngps_driver_timing_topic: /mando_localization/internal/driver/gps_timing\nsensor_timing_monitor:\n  publish_rate_hz: 1.0\n  host_check_period_sec: 5.0\n  host_check_stale_sec: 15.0\n  driver_diagnostics_stale_sec: 1.0\n  window_sec: 30.0\n  max_samples: 6000\n  clock_jump_tolerance_sec: 0.1\n  min_samples: 5\n  future_tolerance_sec: 0.02\n  # signed receipt-header에는 PC clock offset도 포함된다. 실제 전송 지연 단독 측정값이 아니다.\n  max_header_age_p95_sec: 0.2\n  # GPS gate가 허용하는 최대 측정 age 1.0초와 맞춘다. 0.2초 초과는 위 성능 WARN으로 남긴다.\n  max_gnss_receipt_difference_sec: 1.0\n  sensors:\n    gps:\n      expected_interval_sec: 0.1\n      max_gap_sec: 0.3\n      stale_sec: 0.5\n      stamp_semantics: gnss_utc_requires_driver_confirmation\n    imu:\n      expected_interval_sec: 0.01\n      max_gap_sec: 0.05\n      stale_sec: 0.2\n      stamp_semantics: pc_driver_receipt_not_measurement_epoch\n    encoder:\n      expected_interval_sec: 0.13\n      max_gap_sec: 0.4\n      stale_sec: 0.6\n      stamp_semantics: pc_adapter_receipt_not_measurement_epoch","line_count":44,"redacted_lines":[],"functions":[],"params":[["clock_preflight.backend","auto"],["clock_preflight.command_timeout_sec",2.0],["clock_preflight.max_abs_offset_sec",0.05],["clock_preflight.max_root_distance_sec",0.05],["clock_preflight.max_sample_age_sec",3600.0],["clock_preflight.max_poll_interval_sec",2048.0],["clock_preflight.max_poll_age_factor",2.0],["clock_preflight.min_sample_age_limit_sec",120.0],["clock_preflight.future_sample_tolerance_sec",1.0],["gps_driver_timing_topic","/mando_localization/internal/driver/gps_timing"],["sensor_timing_monitor.publish_rate_hz",1.0],["sensor_timing_monitor.host_check_period_sec",5.0],["sensor_timing_monitor.host_check_stale_sec",15.0],["sensor_timing_monitor.driver_diagnostics_stale_sec",1.0],["sensor_timing_monitor.window_sec",30.0],["sensor_timing_monitor.max_samples",6000],["sensor_timing_monitor.clock_jump_tolerance_sec",0.1],["sensor_timing_monitor.min_samples",5],["sensor_timing_monitor.future_tolerance_sec",0.02],["sensor_timing_monitor.max_header_age_p95_sec",0.2],["sensor_timing_monitor.max_gnss_receipt_difference_sec",1.0],["sensor_timing_monitor.sensors.gps.expected_interval_sec",0.1],["sensor_timing_monitor.sensors.gps.max_gap_sec",0.3],["sensor_timing_monitor.sensors.gps.stale_sec",0.5],["sensor_timing_monitor.sensors.gps.stamp_semantics","gnss_utc_requires_driver_confirmation"],["sensor_timing_monitor.sensors.imu.expected_interval_sec",0.01],["sensor_timing_monitor.sensors.imu.max_gap_sec",0.05],["sensor_timing_monitor.sensors.imu.stale_sec",0.2],["sensor_timing_monitor.sensors.imu.stamp_semantics","pc_driver_receipt_not_measurement_epoch"],["sensor_timing_monitor.sensors.encoder.expected_interval_sec",0.13],["sensor_timing_monitor.sensors.encoder.max_gap_sec",0.4],["sensor_timing_monitor.sensors.encoder.stale_sec",0.6],["sensor_timing_monitor.sensors.encoder.stamp_semantics","pc_adapter_receipt_not_measurement_epoch \nrelocalization:\n  long_outage_sec: 2.0\n  candidate_max_message_age_sec: 1.0\n  candidate_max_future_stamp_sec: 0.10\n  candidate_cluster_radius_m: 2.0\n  reanchor_ack_timeout_sec: 1.0\n\n\n  gps_only:\n    # 실측 datum, 실제 GPS covariance, 정지 조건과 route/controller 복구가\n    # 검증되기 전에는 자동 EKF reset을 fail-closed로 막는다.\n    automatic_reset_enabled: false\n    require_measured_datum: true\n    required_consecutive_candidates: 5\n    max_stationary_speed_mps: 0.30\n    set_pose_service_wait_timeout_sec: 0.30\n    global_confirmation_timeout_sec: 1.0\n    max_global_confirmation_distance_m: 2.0\n    required_global_confirmations: 3","line_count":21,"redacted_lines":[],"functions":[],"params":[["relocalization.long_outage_sec",2.0],["relocalization.candidate_max_message_age_sec",1.0],["relocalization.candidate_max_future_stamp_sec",0.1],["relocalization.candidate_cluster_radius_m",2.0],["relocalization.reanchor_ack_timeout_sec",1.0],["relocalization.gps_only.automatic_reset_enabled",false],["relocalization.gps_only.require_measured_datum",true],["relocalization.gps_only.required_consecutive_candidates",5],["relocalization.gps_only.max_stationary_speed_mps",0.3],["relocalization.gps_only.set_pose_service_wait_timeout_sec",0.3],["relocalization.gps_only.global_confirmation_timeout_sec",1.0],["relocalization.gps_only.max_global_confirmation_distance_m",2.0],["relocalization.gps_only.required_global_confirmations",3]]},"src/localization/config/status_policy.yaml":{"path":"src/localization/config/status_policy.yaml","sha256":"d159a9a9c6fe81d967a9e3bfd52154af258828633d01dfd6be4d27b746129b6b","text":"manager_rate_hz: 20.0\nstartup_grace_sec: 3.0\n\ndevices:\n  imu: /dev/imu\n  # GPS 드라이버가 실제로 여는 수신기 고유 포트와 동일하게 검사한다.\n  gps: /dev/serial/by-id/usb-u-blox_AG_-_www.u-blox.com_u-blox_GNSS_receiver-if00\n\nquality:\n  max_position_variance_m2: 25.0\n\nsources:\n  imu:\n    timeout_sec: 0.20\n    max_future_stamp_sec: 0.05\n  encoder:\n    timeout_sec: 0.20\n    max_future_stamp_sec: 0.05\n  local_odometry:\n    timeout_sec: 0.20\n    max_future_stamp_sec: 0.05\n  global_odometry:\n    timeout_sec: 0.20\n    max_future_stamp_sec: 0.05\n  gps:\n    timeout_sec: 1.00\n    max_future_stamp_sec: 0.10\n\nabsolute_sources:\n  gps_enabled: true\n  recovery_consecutive_measurements: 3\n  max_global_consistency_distance_m: 10.0\n\ndead_reckoning:\n  max_duration_sec: 2.0\n  max_distance_m: 10.0\n  limit_policy: first_exceeded\n\noutput_gate:\n  max_odometry_age_sec: 0.20\n  max_valid_age_sec: 0.50\n  max_future_stamp_sec: 0.05\n  max_quaternion_normalization_error: 0.001\n  max_covariance_diagonal: 1000000.0\n  require_finite_values: true\n  require_map_frame: true\n  publish_last_pose_when_invalid: false\n\nsupervisor:\n  max_evaluation_age_sec: 0.50","line_count":50,"redacted_lines":[],"functions":[],"params":[["manager_rate_hz",20.0],["startup_grace_sec",3.0],["devices.imu","/dev/imu"],["devices.gps","/dev/serial/by-id/usb-u-blox_AG_-_www.u-blox.com_u-blox_GNSS_receiver-if00"],["quality.max_position_variance_m2",25.0],["sources.imu.timeout_sec",0.2],["sources.imu.max_future_stamp_sec",0.05],["sources.encoder.timeout_sec",0.2],["sources.encoder.max_future_stamp_sec",0.05],["sources.local_odometry.timeout_sec",0.2],["sources.local_odometry.max_future_stamp_sec",0.05],["sources.global_odometry.timeout_sec",0.2],["sources.global_odometry.max_future_stamp_sec",0.05],["sources.gps.timeout_sec",1.0],["sources.gps.max_future_stamp_sec",0.1],["absolute_sources.gps_enabled",true],["absolute_sources.recovery_consecutive_measurements",3],["absolute_sources.max_global_consistency_distance_m",10.0],["dead_reckoning.max_duration_sec",2.0],["dead_reckoning.max_distance_m",10.0],["dead_reckoning.limit_policy","first_exceeded"],["output_gate.max_odometry_age_sec",0.2],["output_gate.max_valid_age_sec",0.5],["output_gate.max_future_stamp_sec",0.05],["output_gate.max_quaternion_normalization_error",0.001],["output_gate.max_covariance_diagonal",1000000.0],["output_gate.require_finite_values",true],["output_gate.require_map_frame",true],["output_gate.publish_last_pose_when_invalid",false],["supervisor.max_evaluation_age_sec",0.5]]},"src/localization/scripts/rddf_initialization_core.py":{"path":"src/localization/scripts/rddf_initialization_core.py","sha256":"36b31f0030ed640b48eff5d3bfc7d7f7cd055f0a664ce22b47740c2f20d8785c","text":"#!/usr/bin/env python3\n\"\"\"Read-only RDDF geometry for startup initialization and map-click preview.\n\nXY is east/north in metres relative to the project's WGS84 origin. Yaw is the\ndirected geometric segment tangent, east=0 and counterclockwise positive.\nThe returned pose assumes the physical vehicle follows the selected direction;\nposition alone cannot resolve intersecting roads or opposite travel directions.\n\"\"\"\nimport csv\nimport json\nimport math\nfrom pathlib import Path\n\nimport numpy as np\n\n\nWGS84_A_M = 6378137.0\nWGS84_E2 = 6.69437999014e-3\nCSV_HEADER = [\n    \"route_id\", \"route_name\", \"closed\", \"index\", \"latitude\", \"longitude\",\n    \"east_m\", \"north_m\", \"distance_m\", \"path_yaw_rad\",\n]\n\n\ndef _wgs84(latitude, longitude):\n    try:\n        latitude, longitude = float(latitude), float(longitude)\n    except (TypeError, ValueError, OverflowError) as error:\n        raise ValueError(\"WGS84 coordinates must be finite numbers\") from error\n    if not (math.isfinite(latitude) and math.isfinite(longitude)\n            and -90.0 \u003c= latitude \u003c= 90.0 and -180.0 \u003c= longitude \u003c= 180.0):\n        raise ValueError(\"invalid WGS84 latitude or longitude\")\n    return latitude, longitude\n\n\ndef _angle_difference(first, second):\n    return abs(math.atan2(math.sin(first - second), math.cos(first - second)))\n\n\nclass RddfRouteMap:\n    \"\"\"Load project origin and exported CSVs without ROS or modifying sources.\n\n    ``routes`` maps CSV route names to immutable Nx2 XY arrays. ``match`` returns\n    ordinary JSON-serializable dictionaries. Rejections retain the nearest pose\n    when available, exclusively for a rejected/ambiguous UI preview.\n\n    ``same_branch_distance_m`` and ``same_branch_heading_deg`` are equivalence\n    tolerances for overlapping exports, not claimed GPS measurement accuracy.\n    \"\"\"\n\n    def __init__(self, directory, same_branch_distance_m=0.10,\n                 same_branch_heading_deg=20.0):\n        self.directory = Path(directory).expanduser().resolve()\n        self.same_branch_distance_m = float(same_branch_distance_m)\n        self.same_branch_heading_rad = math.radians(float(same_branch_heading_deg))\n        if not (math.isfinite(self.same_branch_distance_m)\n                and self.same_branch_distance_m >= 0.0\n                and math.isfinite(self.same_branch_heading_rad)\n                and 0.0 \u003c= self.same_branch_heading_rad \u003c math.pi / 2):\n            raise ValueError(\"invalid RDDF branch equivalence tolerances\")\n        with (self.directory / \"yongin_route_project.json\").open(encoding=\"utf-8-sig\") as stream:\n            project = json.load(stream)\n        try:\n            lat, lng = _wgs84(project[\"origin\"][\"lat\"], project[\"origin\"][\"lng\"])\n        except (KeyError, TypeError) as error:\n            raise ValueError(\"RDDF project needs origin.lat and origin.lng\") from error\n        self.origin = {\"lat\": lat, \"lng\": lng}\n        self.routes = {}\n        self._segments = []\n        self._adjacent = []\n        for path in sorted(self.directory.glob(\"*.csv\")):\n            self._load_route(path)\n        if not self._segments:\n            raise ValueError(\"RDDF directory has no nondegenerate routes\")\n        self._starts = np.asarray([segment[\"start\"] for segment in self._segments])\n        self._vectors = np.asarray([segment[\"vector\"] for segment in self._segments])\n        self._length_squared = np.sum(self._vectors * self._vectors, axis=1)\n\n    def _load_route(self, path):\n        with path.open(encoding=\"utf-8-sig\", newline=\"\") as stream:\n            reader = csv.DictReader(stream)\n            if reader.fieldnames != CSV_HEADER:\n                raise ValueError(\"unexpected RDDF CSV header: {}\".format(path))\n            rows = list(reader)\n        if len(rows) \u003c 2:\n            raise ValueError(\"RDDF route needs at least two points: {}\".format(path))\n        name, route_id = rows[0][\"route_name\"], rows[0][\"route_id\"]\n        if not name or name in self.routes:\n            raise ValueError(\"RDDF route name is empty or duplicated: {}\".format(path))\n        closed_text = rows[0][\"closed\"].lower()\n        if closed_text not in (\"false\", \"true\", \"0\", \"1\"):\n            raise ValueError(\"invalid RDDF closed flag: {}\".format(path))\n        closed = closed_text in (\"true\", \"1\")\n        points = []\n        indices = []\n        previous_distance = -math.inf\n        try:\n            for row in rows:\n                if (row[\"route_name\"] != name or row[\"route_id\"] != route_id\n                        or row[\"closed\"].lower() != closed_text):\n                    raise ValueError(\"route identity changes within CSV\")\n                index = int(row[\"index\"])\n                if index \u003c 0 or (indices and index != indices[-1] + 1):\n                    raise ValueError(\"route indices must be consecutive and nonnegative\")\n                _wgs84(row[\"latitude\"], row[\"longitude\"])\n                values = [float(row[key]) for key in\n                          (\"east_m\", \"north_m\", \"distance_m\", \"path_yaw_rad\")]\n                if not all(math.isfinite(value) for value in values):\n                    raise ValueError(\"route values must be finite\")\n                if values[2] \u003c 0.0 or values[2] \u003c previous_distance:\n                    raise ValueError(\"route distances must be nonnegative and monotonic\")\n                previous_distance = values[2]\n                points.append(values[:2])\n                indices.append(index)\n        except (KeyError, TypeError, ValueError, OverflowError) as error:\n            raise ValueError(\"invalid RDDF data in {}: {}\".format(path, error)) from error\n        array = np.asarray(points, dtype=float)\n        array.setflags(write=False)\n        self.routes[name] = array\n        segment_ids = []\n        for index in range(len(points) if closed else len(points) - 1):\n            start = array[index]\n            with np.errstate(over=\"ignore\", invalid=\"ignore\"):\n                vector = array[(index + 1) % len(points)] - start\n                length_squared = float(np.dot(vector, vector))\n            if not math.isfinite(length_squared):\n                raise ValueError(\"RDDF segment exceeds finite metric range: {}\".format(path))\n            if length_squared \u003c= 1e-16:\n                continue\n            segment_ids.append(len(self._segments))\n            self._segments.append({\n                \"route\": name, \"index\": indices[index], \"start\": start,\n                \"vector\": vector, \"yaw\": math.atan2(vector[1], vector[0]),\n            })\n        if not segment_ids:\n            raise ValueError(\"RDDF route has no nonzero segment: {}\".format(path))\n        self._adjacent.extend(zip(segment_ids[:-1], segment_ids[1:]))\n        if closed and len(segment_ids) > 1:\n            self._adjacent.append((segment_ids[-1], segment_ids[0]))\n\n    def project_gps(self, latitude, longitude):\n        \"\"\"Use the same local WGS84 ellipsoid approximation as the current viewer.\"\"\"\n        latitude, longitude = _wgs84(latitude, longitude)\n        origin_lat = math.radians(self.origin[\"lat\"])\n        denominator = math.sqrt(1.0 - WGS84_E2 * math.sin(origin_lat) ** 2)\n        east = (WGS84_A_M / denominator * math.cos(origin_lat)\n                * math.radians(longitude - self.origin[\"lng\"]))\n        north = (WGS84_A_M * (1.0 - WGS84_E2) / denominator ** 3\n                 * d = int(np.argmin(distances))\n\n        def result_for(segment_id):\n            segment = self._segments[segment_id]\n            return {\"route\": segment[\"route\"], \"index\": int(segment[\"index\"]),\n                    \"x\": float(projected[segment_id, 0]), \"y\": float(projected[segment_id, 1]),\n                    \"yaw\": float(segment[\"yaw\"]), \"distance\": float(distances[segment_id]),\n                    \"fraction\": float(fractions[segment_id])}\n\n        best = result_for(best_id)\n        result = dict(best, accepted=False, reason=\"TOO_FAR\")\n        if best[\"distance\"] > maximum:\n            return result\n\n        near = np.flatnonzero(distances \u003c= min(maximum, best[\"distance\"] + margin) + 1e-9)\n        parents = {int(index): int(index) for index in near}\n\n        def root(index):\n            while parents[index] != index:\n                parents[index] = parents[parents[index]]\n                index = parents[index]\n            return index\n\n        for first, second in self._adjacent:\n            if first in parents and second in parents:\n                if _angle_difference(self._segments[first][\"yaw\"], self._segments[second][\"yaw\"]) \u003c= math.pi / 2 + 1e-9:\n                    parents[root(second)] = root(first)\n        groups = {}\n        for segment_id in near:\n            segment_id = int(segment_id)\n            group = root(segment_id)\n            if group not in groups or distances[segment_id] \u003c distances[groups[group]]:\n                groups[group] = segment_id\n        representatives = sorted(groups.values(), key=lambda index: (distances[index], index))\n        candidates = [result_for(index) for index in representatives]\n        competing = []\n        for candidate in candidates:\n            same_direction = _angle_difference(best[\"yaw\"], candidate[\"yaw\"]) \u003c= self.same_branch_heading_rad\n            same_point = math.hypot(best[\"x\"] - candidate[\"x\"], best[\"y\"] - candidate[\"y\"]) \u003c= self.same_branch_distance_m\n            if not (same_direction and same_point):\n                competing.append(candidate)\n        result.update(accepted=not competing, reason=\"AMBIGUOUS_ROUTE\" if competing else \"MATCHED\",\n                      candidate_count=len(candidates), candidates=candidates[:8])\n        return result","line_count":223,"redacted_lines":[],"functions":[{"line":25,"label":"def _wgs84(latitude, longitude):"},{"line":36,"label":"def _angle_difference(first, second):"},{"line":40,"label":"class RddfRouteMap:"},{"line":51,"label":"def __init__(self, directory, same_branch_distance_m=0.10,"},{"line":79,"label":"def _load_route(self, path):"},{"line":141,"label":"def project_gps(self, latitude, longitude):"},{"line":152,"label":"def match(self, x, y, max_distance_m, ambiguity_distance_m=0.5, route_name=None):"},{"line":182,"label":"def result_for(segment_id):"},{"line":197,"label":"def root(index):"}],"params":[]},"src/localization/config/rddf_initialization.yaml":{"path":"src/localization/config/rddf_initialization.yaml","sha256":"8f74f44a2b384f0806b777753bd8e639c1388873f2f300cf6e03520e07aa0db9","text":"# RDDF 원본 origin과 같은 지리 기준. 측량 완료 플래그를 만들지 않는다.\nreference:\n  mode: rddf_datum\n  measured: false\n  measured_at: \"\"\n  source: rddf/yongin_route_project.json#origin\n  latitude_deg: 37.288731\n  longitude_deg: 127.1072336\n  altitude_m: 0.0\n  yaw_offset_rad: 0.0\n  map_x_m: 0.0\n  map_y_m: 0.0\n  map_z_m: 0.0\ninitialization:\n  rddf_directory: rddf\n  max_snap_distance_m: 5.0\n  ambiguity_distance_m: 0.5\n  gps_consecutive_samples: 3\n  gps_cluster_radius_m: 1.5\n  max_candidate_age_sec: 1.0\n  max_future_sec: 0.10\n  max_speed_mps: 0.30\n  speed_timeout_sec: 0.20\n  clock_timeout_sec: 3.0\n  confirmation_timeout_sec: 3.0\n  confirmation_distance_m: 1.0\n  confirmation_yaw_deg: 5.0\n  confirmation_samples: 3\n  position_variance_m2: 1.0\n  heading_standard_deviation_deg: 10.0\n  service_wait_sec: 0.30","line_c ec': duration(props['PollIntervalUSec']),\n            'stratum': int(values['Stratum']), 'leap': values['Leap'],\n            'source': props.get('ServerName', ''), 'packet_count': int(values['Packet count']),\n            'sample_ignored': bool(re.search(r'Ignored=yes\\b', message))}\n\n\ndef parse_chrony(text):\n    values = key_values(text, ':')\n    system = values['System time']\n    match = re.fullmatch(r'([\\d.eE+-]+) seconds (slow|fast) of NTP time', system)\n    if not match:\n        raise ValueError('chrony System time unavailable')\n    offset = float(match.group(1))*(-1 if match.group(2) == 'slow' else 1)\n    delay = float(values['Root delay'].split()[0])\n    dispersion = float(values['Root dispersion'].split()[0])\n    timestamp = calendar.timegm(time.strptime(values['Ref time (UTC)'], '%a %b %d %H:%M:%S %Y'))\n    reference = values['Reference ID']\n    return {'backend': 'chrony', 'offset_sec': offset,\n            'offset_semantics': 'system clock minus estimated NTP time',\n            'root_distance_sec': abs(delay)/2.+dispersion, 'sample_epoch_sec': timestamp,\n            'poll_interval_sec': float(values['Update interval'].split()[0]),\n            'stratum': int(values['Stratum']), 'leap': values['Leap status'],\n            'source': reference, 'local_reference_only': reference.split()[0] in ('7F7F0101', '00000000')}\n\n\ndef evaluate_clock(sample, flags, policy, now):\n    if not math.isfinite(now):\n        raise ValueError('nonfinite clock check time')\n    result = dict(sample)\n    failures = []\n    if flags.get('NTPSynchronized') != 'yes':\n        failures.append('kernel_clock_not_synchronized')\n    if flags.get('NTP') != 'yes':\n        failures.append('NTP_not_enabled')\n    for key in ('offset_sec', 'root_distance_sec', 'sample_epoch_sec', 'poll_interval_sec'):\n        if not math.isfinite(float(sample[key])):\n            raise ValueError('nonfinite_'+key)\n    if not 1 \u003c= sample['stratum'] \u003c= 15 or sample['leap'].lower() not in ('normal', 'insert second', 'delete second'):\n        failures.append('invalid_reference_state')\n    if sample.get('local_reference_only') or sample.get('sample_ignored'):\n        failures.append('untrusted_reference_sample')\n    age = now-sample['sample_epoch_sec']\n    # Accommodate the daemon's poll interval, but never exceed the configured absolute cap.\n    poll = min(sample['poll_interval_sec'], policy['max_poll_interval_sec'])\n    limit = min(policy['max_sample_age_sec'], max(policy['min_sample_age_limit_sec'],\n                                                poll*policy['max_poll_age_factor']))\n    if sample['poll_interval_sec'] \u003c= 0 or sample['poll_interval_sec'] > policy['max_poll_interval_sec']:\n        failures.append('poll_interval_out_of_bounds')\n    if age > limit:\n        failures.append('clock_sample_stale')\n    if age \u003c -policy['future_sample_tolerance_sec']:\n        failures.append('clock_sample_in_future')\n    if abs(sample['offset_sec']) > policy['max_abs_offset_sec']:\n        failures.append('clock_offset_exceeds_limit')\n    if not 0 \u003c= sample['root_distance_sec'] \u003c= policy['max_root_distance_sec']:\n        failures.append('clock_root_distance_exceeds_limit')\n    result.update(ready=not failures, status='HOST_CLOCK_READY' if not failures else 'HOST_CLOCK_REJECTED',\n                  reasons=failures, sample_age_sec=age, sample_age_limit_sec=limit,\n                  flags=flags, hardware_sensor_sync_verified=False)\n    return result\n\n\ndef run_readonly(command, timeout):\n    env = dict(os.environ, LC_ALL='C', LANG='C', TZ='UTC')\n    process = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.PIPE,\n                             text=True, timeout=timeout, env=env, check=False)\n    if process.returncode:\n        raise RuntimeError('%s: %s' % (' '.join(command), process.stderr.strip() or 'exit '+str(process.returncode)))\n    return process.stdout\n\n\ndef check_host_clock(policy, use_sim_time=False, runner=run_readonly, now=None, which=shutil.which):\n    policy = dict(policy)\n    for name, value in policy.items():\n        if name != 'backend':\n            policy[name] = positive(value, 'clock_preflight/'+name)\n    if use_sim_time:\n        return {'ready': True, 'status': 'REPLAY_UNVERIFIED', 'reasons': [],\n                'hardware_sensor_sync_verified': False, 'host_clock_verified': False,\n                'exemption': 'explicit use_sim_time: physical synchronization was not checked'}\n    result = {'ready': False, 'status': 'HOST_CLOCK_UNAVAILABLE', 'reasons': [],\n              'hardware_sensor_sync_verified': False, 'host_clock_verified': False,\n              'pps_devices': sorted(glob.glob('/dev/pps*')), 'pps_discipline_verified': False}\n    timeout = policy['command_timeout_sec']\n    try:\n        flags = key_values(runner(['timedatectl', 'show', '--property=NTP', '--property=NTPSynchronized'], timeout))\n        backend = policy['backend']\n        if backend not in ('auto', 'chrony', 'timesyncd'):\n            raise ValueError('unknown clock backend '+backend)\n        sample = None\n        chrony_error = None\n        if backend in ('auto', 'chrony') and which('chronyc'):\n            try:\n                sample = parse_chrony(runner(['chronyc', '-n', 'tracking'], timeout))\n            except (KeyError, ValueError, RuntimeError, OSError, subprocess.TimeoutExpired) as error:\n                chrony_error = str(error)\n                if backend == 'chrony':\n                    raise\n        if sample is None:\n            if backend == 'chrony':\n                raise RuntimeError('chronyc is unavailable')\n            props = runner(['timedatectl', 'show-timesync', '--all'], timeout)\n            status = runner(['timedatectl', 'timesync-status'], timeout)\n            sample = parse_timesyncd(props, status)\n        result.update(evaluate_clock(sample, flags, policy, time.time() if now is None else now))\n        result['host_clock_verified'] = result['ready']\n        if chrony_error:\n            result['chrony_probe_error'] = chrony_error\n    except (KeyError, ValueError, RuntimeError, OSError, subprocess.TimeoutExpired) as error:\n        result['reasons'] = [type(error).__name__+': '+str(error)]\n    return result\n\n\ndef distribution(values):\n    values = sorted(value for value in values if value is not None and math.isfinite(value))\n    if not values:\n        return {'count': 0}\n    def percentile(q):\n        position = (len(values)-1)*q\n        lower = int(position)\n        upper = min(lower+1, len(values)-1)\n        return values[lower]+(values[upper]-values[lower])*(position-lower)\n    return {'count': len(values), 'p50_sec': percentile(.5), 'p95_sec': percentile(.95),\n            'p99_sec': percentile(.99), 'max_sec': values[-1], 'min_sec': values[0]}\n\n\nclass TimingWindow:\n    \"\"\"Timestamp comparisons only: receipt stamps cannot expose pre-stamp device latency.\"\"\"\n    def __init__(self, window_sec, max_samples, gap_sec, jump_sec):\n        self.window_sec = positive(window_sec, 'window_sec')\n        self.gap_sec = positive(gap_sec, 'gap_sec')\n        self.jump_sec = positive(jump_sec, 'jump_sec')\n        self.samples = deque(maxlen=count(max_samples, 'max_samples', 2))\n        self.previous = None\n        self.invalid_total = 0\n        self.received_total = 0\n        self.last_received_mono = None\n\n    def add(self, header, receipt_ros, receipt_mono):\n        self.received_total += 1\n        valid = all(math.isfinite(v) and v > 0 for v in (header, receipt_ros, receipt_mono))\n        if not valid:\n            self.invalid_total += 1\n            if math.isfinite(receipt_mono) and receipt_mono > 0:\n                self.last_received_mono = receipt_mono\n                self.samples.append({'mono': receipt_mono, 'invalid': 1})\n                self.prune(receipt_mono)\n            return False\n        self.last_received_mono = receipt_mono\n        item = {'mono': receipt_mono, 'age': receipt_ros-header, 'invalid': 0}\n        if self.previous:\n            h, ros, mono = self.previous\n            interval, receipt_interval = header-h, receipt_mono-mono\n            item.update(interval=interval, receipt_interval=receipt_interval,\n                        duplicate=int(interval == 0), backwards=int(interval \u003c 0),\n                        gap=int(interval > self.gap_sec or receipt_interval > self.gap_sec),\n                        clock_jump=int(abs((receipt_ros-ros)-receipt_interval) > self.jump_sec))\n        self.samples.append(item)\n        self.previous = (header, receipt_ros, receipt_mono)\n        self.prune(receipt_mono)\n        return True\n\n    def prune(self, now_mono):\n        while self.samples and self.samples[0]['mono'] \u003c now_mono-self.window_sec:\n            self.samples.popleft()\n\n    def snapshot(self, now_mono):\n        if not math.isfinite(now_mono):\n            raise ValueError('nonfinite monotonic time')\n        self.prune(now_mono)\n        output = {'window_count': len(self.samples), 'received_total': self.received_total,\n                  'invalid_total': self.invalid_total,\n                  'last_receipt_age_sec': None if self.last_received_mono is None else now_mono-self.last_received_mono}\n        for key in ('invalid', 'duplicate', 'backwards', 'gap', 'clock_jump'):\n            output[key+'_count'] = sum(row.get(key, 0) for row in self.samples)\n        for key in ('age', 'interval', 'receipt_interval'):\n            output[key] = distribution(row.get(key) for row in self.samples)\n        return output","line_count":246,"redacted_lines":[],"functions":[{"line":14,"label":"def load_config(path):"},{"line":23,"label":"def positive(value, name):"},{"line":30,"label":"def count(value, name, minimum=1):"},{"line":39,"label":"def duration(text):"},{"line":52,"label":"def key_values(text, separator='='):"},{"line":57,"label":"def parse_tim
