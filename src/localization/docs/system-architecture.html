n_count += 1\n        self.window.clear()\n        self.reason = 'CALIBRATED'\n        return self.reason\n\n    def output_orientation(self, q):\n        if self.initial_heading is not None and not self.initialized:\n            raise ValueError('WAITING_FOR_INITIAL_HEADING')\n        if not self.calibrated and not self.initialized:\n            return tuple(q)\n        rotation = (0., 0., math.sin(self.offset/2), math.cos(self.offset/2))\n        return multiply(rotation, quaternion(q))\n\n    def step_output_orientation(self, q, stamp):\n        \"\"\"큰 최초 보정각이 EKF yaw 이상치 gate에 걸리지 않도록 적용 속도를 제한한다.\"\"\"\n        if self.initial_heading is not None and not self.initialized:\n            raise ValueError('WAITING_FOR_INITIAL_HEADING')\n        elapsed = 0. if self.last_output_stamp is None else max(0., stamp-self.last_output_stamp)\n        self.last_output_stamp = stamp\n        if not self.calibrated and not self.initialized:\n            return tuple(q)\n        # IMU 단절 시간 동안 보정을 몰아서 적용하지 않는다.\n        step = math.radians(self.p['max_correction_rate_degps'])*min(elapsed, self.p['max_imu_gap_sec'])\n        if self.yaw_hold is not None and self.yaw_hold.held:\n            step = 0.  # 정지 중에는 지연 GNSS 정합에 따른 방향 변경도 재출발까지 미룬다.\n        error = wrap(self.offset-self.applied_offset)\n        self.applied_offset = wrap(self.applied_offset+max(-step, min(step, error)))\n        rotation = (0., 0., math.sin(self.applied_offset/2), math.cos(self.applied_offset/2))\n        return multiply(rotation, quaternion(q))\n\n    def added_yaw_variance(self, stamp):\n        if not self.calibrated and not self.initialized:\n            return 0.0\n        reference_stamp = self.calibration_stamp if self.calibrated else self.initialization_stamp\n        elapsed = max(0., stamp-reference_stamp)\n        uncertainty = math.radians(self.p['held_heading_uncertainty_deg_per_sec'])*elapsed\n        remaining = wrap(self.offset-self.applied_offset)\n        return min(math.pi**2, self.variance+uncertainty**2+remaining**2)\n\n    def status(self):\n        applied = abs(wrap(self.offset-self.applied_offset)) \u003c 1e-6\n        initial_state = ('RDDF_INITIALIZED' if self.initialized else 'WAITING_FOR_INITIAL_HEADING') if self.initial_heading is not None else 'UNCALIBRATED'\n        return {'state': ('CALIBRATED' if applied else 'ALIGNING') if self.calibrated else initial_state,\n                'reason': self.reason, 'yaw_offset_deg': math.degrees(self.offset),\n                'applied_yaw_offset_deg': math.degrees(self.applied_offset),\n                'initial_heading_source': None if self.initial_heading is None else self.initial_heading['source'],\n                'initial_yaw_deg': None if self.initial_heading is None else math.degrees(self.initial_heading['yaw_rad']),\n                'initialization_stamp': self.initialization_stamp,\n                'calibration_stamp': self.calibration_stamp,\n                'correction_count': self.correction_count, 'candidate_samples': len(self.window),\n                'direction_mode': self.p['direction_mode'], 'one_shot': self.p['one_shot']}","line_count":477,"redacted_lines":[],"functions":[{"line":14,"label":"def wrap(angle):"},{"line":18,"label":"def quaternion(q):"},{"line":27,"label":"def multiply(a, b):"},{"line":34,"label":"def inverse(q):"},{"line":38,"label":"def rpy(q):"},{"line":45,"label":"def slerp(a, b, fraction):"},{"line":57,"label":"def circular_mean(values):"},{"line":61,"label":"def navpvt_stamp(message):"},{"line":80,"label":"class GnssSample:"},{"line":95,"label":"def from_navpvt(cls, message):"},{"line":104,"label":"class EncoderYawHold:"},{"line":106,"label":"def __init__(self, policy):"},{"line":119,"label":"def reset(self):"},{"line":129,"label":"def observe_feedback(self, stamp, encoder, speed, alive):"},{"line":141,"label":"def apply(self, stamp, q, gyro, now, mount):"},{"line":167,"label":"def status(self):"},{"line":174,"label":"class HeadingCalibration:"},{"line":176,"label":"def __init__(self, policy, initial_heading=None, encoder_yaw_hold=None):"},{"line":211,"label":"def reset(self):"},{"line":230,"label":"def initialize_heading(self, mount):"},{"line":248,"label":"def select_initial_heading(self, yaw_rad, source, now, mount, standard_deviation_deg=10.):"},{"line":259,"label":"def observe_time(self, now):"},{"line":269,"label":"def _prune(self, history, stamp):"},{"line":273,"label":"def observe_feedback(self, stamp, encoder, speed, alive):"},{"line":278,"label":"def observe_imu(self, stamp, q, gyro, now, mount=(0., 0., 0., 1.)):"},{"line":297,"label":"def observe_twist(self, stamp, speed, now):"},{"line":308,"label":"def _imu_at(self, stamp):"},{"line":322,"label":"def _speed_at(self, stamp):"},{"line":329,"label":"def reject(self, reason):"},{"line":334,"label":"def observe_gnss(self, sample, now, clock_ready, mount=(0., 0., 0., 1.)):"},{"line":432,"label":"def output_orientation(self, q):"},{"line":440,"label":"def step_output_orientation(self, q, stamp):"},{"line":457,"label":"def added_yaw_variance(self, stamp):"},{"line":466,"label":"def status(self):"}],"params":[]},"src/localization/scripts/calibrated_imu_node.py":{"path":"src/localization/scripts/calibrated_imu_node.py","sha256":"ad2090781bdd7393b40d2a1587c41cbeaa20996c8c9ec1a14c6eb731563d5e45","text":"#!/usr/bin/python3\n\"\"\"CalibratedIMU 공통 출구. 시작 방향/GNSS 정합과 엔코더 정지 yaw 제약을 적용한다.\"\"\"\nfrom collections import deque\nimport copy\nimport json\nimport math\nfrom pathlib import Path\nimport sys\nimport threading\nimport time\n\nsys.path.insert(0, str(Path(__file__).resolve().parent))\nfrom calibrated_imu_core import GnssSample, HeadingCalibration, quaternion\n\nimport rospy\nimport tf2_ros\nfrom diagnostic_msgs.msg import DiagnosticArray, DiagnosticStatus, KeyValue\nfrom erp42_msgs.msg import SerialFeedBack\nfrom geometry_msgs.msg import TwistWithCovarianceStamped\nfrom sensor_msgs.msg import Imu\nfrom std_msgs.msg import Bool\nfrom ublox_msgs.msg import NavPVT\nfrom mando_localization.srv import SetInitialHeading, SetInitialHeadingResponse\n\n\nclass CalibratedIMU:\n    def __init__(self):\n        self.core = HeadingCalibration(rospy.get_param('~imu_heading_calibration'),\n                                       rospy.get_param('~initial_heading', None),\n                                       rospy.get_param('~encoder_yaw_hold'))\n        self.wait_for_rddf = rospy.get_param(\"~initialization/required\", False)\n        if self.wait_for_rddf:\n            self.core.initial_heading = None\n        self.heading_transaction = None\n        self.p = self.core.p\n        self.topics = rospy.get_param('~topics')\n        self.frames = rospy.get_param('~frames')\n        for key in ('imu_normalized', 'imu_calibrated', 'gps_navpvt', 'encoder_twist', 'encoder_state'):\n            if not isinstance(self.topics[key], str) or not self.topics[key].startswith('/'):\n                raise ValueError(key+' must be an absolute ROS topic')\n        if len({self.topics[k] for k in ('imu_data', 'imu_normalized', 'imu_calibrated')}) != 3:\n            raise ValueError('raw, normalized and calibrated IMU topics must differ')\n        self.lock = threading.RLock()\n        self.pending = deque()\n        self.mount = None\n        self.clock_value = False\n        self.clock_receipt = None\n        self.clock_mono = None\n        self.last_now = None\n        self.last_imu_mono = None\n        self.published = 0\n        self.rejected_imu = 0\n        self.tf_buffer = tf2_ros.Buffer()\n        self.tf_listener = tf2_ros.TransformListener(self.tf_buffer)\n        self.publisher = rospy.Publisher(self.topics['imu_calibrated'], Imu, queue_size=50)\n        self.diagnostics = rospy.Publisher(rospy.get_param('~internal_topics/imu_calibration_status'),\n                                           DiagnosticArray, queue_size=2, latch=True)\n        self.subscribers = [\n            rospy.Subscriber(self.topics['imu_normalized'], Imu, self.imu_callback, queue_size=200),\n            rospy.Subscriber(self.topics['gps_navpvt'], NavPVT, self.gnss_callback, queue_size=30),\n            rospy.Subscriber(self.topics['encoder_twist'], TwistWithCovarianceStamped,\n                             self.twist_callback, queue_size=100),\n            rospy.Subscriber(self.topics['encoder_state'], SerialFeedBack,\n                             self.feedback_callback, queue_size=100),\n            rospy.Subscriber(rospy.get_param('~internal_topics/clock_ready'), Bool,\n                             self.clock_callback, queue_size=5),\n        ]\n        self.heading_service = rospy.Service(\"~set_initial_heading\", SetInitialHeading, self.set_initial_heading)\n        self.timer = rospy.Timer(rospy.Duration(0.2), self.timer_callback, reset=True)\n        rospy.loginfo('CalibratedIMU: %s -> %s; direction_mode=%s, one_shot=%s',\n                      self.topics['imu_normalized'], self.topics['imu_calibrated'],\n                      self.p['direction_mode'], self.p['one_shot'])\n        if self.core.initial_heading is not None:\n            rospy.loginfo('Initial body yaw: %.6f deg from %s; vehicle must face this start direction.',\n                          math.degrees(self.core.initial_heading['yaw_rad']),\n                          self.core.initial_heading['source'])\n        if self.p['direction_mode'] == 'forward_start':\n            rospy.logwarn('Initial yaw alignment assumes forward straight motion until calibrated; '\n                          'Gear is not a verified direction signal.')\n\n    def set_initial_heading(self, request):\n        with self.lock:\n            now = self._time()\n            signature = (request.transaction_id, request.yaw_rad, request.source, request.standard_deviation_deg)\n            if not self.wait_for_rddf or request.transaction_id == 0:\n                return SetInitialHeadingResponse(False, 'DYNAMIC_INITIALIZATION_DISABLED', rospy.Time())\n            if self.heading_transaction is not None:\n                okay = signature == self.heading_transaction and self.core.initialized\n                return SetInitialHeadingResponse(okay, 'ALREADY_INITIALIZED',\n                    rospy.Time.from_sec(self.core.initialization_stamp or 0.))\n            if (self.last_imu_mono is None or time.monotonic()-self.last_imu_mono > self.p[\"max_imu_age_sec\"]):\n                return SetInitialHeadingResponse(False, \"WAITING_FOR_FRESH_IMU\", rospy.Time())\n            if not self._mount() or not self.core.select_initial_heading(\n                    request.yaw_rad, request.source, now, self.mount, request.standard_deviation_deg):\n                return SetInitialHeadingResponse(False, 'WAITING_FOR_FRESH_IMU', rospy.Time())\n            self.heading_transaction = signature\n            return SetInitialHeadingResponse(True, 'RDDF_INITIALIZED',\n                rospy.Time.from_sec(self.core.initialization_stamp))\n\n    def _time(self):\n        now = rospy.Time.now().to_sec()\n        if self.last_now is not None and now \u003c self.last_now-1e-6:\n            self.pending.clear()\n            self.heading_transaction = None\n            if self.wait_for_rddf:\n                self.core.initial_heading = None\n            self.clock_value = False\n            self.clock_receipt = None\n            self.clock_mono = None\n        self.last_now = now\n        self.core.observe_time(now)\n        return now\n\n    def _clock_ready(self, now):\n        return (self.clock_value and self.clock_receipt is not None and\n                0 \u003c= now-self.clock_receipt \u003c= self.p['clock_ready_timeout_sec'] and\n                time.monotonic()-self.clock_mono \u003c= self.p['clock_ready_timeout_sec'])\n\n    def _mount(self):\n        if self.mount is None:\n            try:\n                transform = self.tf_buffer.lookup_transform(self.frames['base_link'], self.frames['imu'], rospy.Time(0))\n                q = transform.transform.rotation\n                self.mount = quaternion((q.x, q.y, q.z, q.w))\n            except (tf2_ros.LookupException, tf2_ros.ConnectivityException,\n                    tf2_ros.ExtrapolationException, ValueError):\n                self.core.reject('WAITING_FOR_IMU_MOUNT_TF')\n                return False\n        return True\n\n    def clock_callback(self, message):\n        with self.lock:\n            self.clock_receipt = self._time()\n            self.clock_mono = time.monotonic()\n            self.clock_value = bool(message.data)\n            if not self.clock_value:\n                self.pending.clear()\n                self.core.reject('CLOCK_NOT_READY')\n\n    def twist_callback(self, message):\n        with self.lock:\n            now = self._time()\n            if message.header.frame_id != self.frames['base_link']:\n                return\n            self.core.observe_twist(message.header.stamp.to_sec(), message.twist.twist.linear.x, now)\n            self._pending(now)\n\n    def feedback_callback(self, message):\n        with self.lock:\n            self.core.observe_feedback(self._time(), message.encoder, message.speed, message.alive)\n\n    @staticmethod\n    def valid_payload(message):\n        vectors = (message.angular_velocity, message.linear_acceleration)\n        if not all(math.isfinite(v) for vector in vectors for v in (vector.x, vector.y, vector.z)):\n            return False\n        for covariance in (message.orientation_covariance, message.angular_velocity_covariance,\n                           message.linear_acceleration_covariance):\n            if not all(math.isfinite(v) for v in covariance) or any(covariance[i] \u003c= 0 for i in (0, 4, 8)):\n                return False\n        return True\n\n    def imu_callback(self, message):\n        with self.lock:\n            now = self._time()\n            q, gyro = message.orientation, message.angular_velocity\n            if self.core.yaw_hold.enabled and not self._mount():\n                return\n            if (message.header.frame_id != self.frames['imu'] or not self.valid_payload(message) or\n                    not self.core.observe_imu(message.header.stamp.to_sec(), (q.x, q.y, q.z, q.w),\n                                              (gyro.x, gyro.y, gyro.z), now,\n                                              self.mount or (0., 0., 0., 1.))):\n                self.rejected_imu += 1\n                return\n            self.last_imu_mono = time.monotonic()\n            if self.wait_for_rddf and self.heading_transaction is None:\n                self.core.reason = \"WAITING_FOR_RDDF_POSITION\"\n                return\n            if self.core.initial_heading is not None and not self.core.initialized:\n                if not self._mount() or not self.core.initialize_heading(self.mount):\n                    return\n            self._pending(now)\n            output = copy.deepcopy(message)\n            _, guarded_q, guarded_gyro = self.core.imus[-1]\n            result = self.core.step_output_orientation(guarded_q, message.header.stamp.to_sec())\n            output.orientation.x, output.orientation.y, output.orientation.z, output.orientation.w = result\n            output.angular_velocity.x, output.angular_velocity.y, output.angular_velocity.z = guarded_gyro\n            if self.core.calibrated or self.core.initialized:\n                covariance = list(output.orientation_covariance)\n                covariance[8] += self.core.added_yaw_variance(message.header.stamp.to_sec())\n                output.orientation_covariance = covariance\n            self.publisher.publish(output)\n            self.published += 1\n\n    def gnss_callback(self, message):\n        with self.lock:\n            now = self._time()\n            if self.wait_for_rddf and self.heading_transaction is None:\n                return\n            if self.core.calibrated and self.p['one_shot']:\n                return\n            try:\n                sample = GnssSample.from_navpvt(message)\n            except (ValueError, TypeError, OverflowError) as error:\n                self.pending.clear()\n                self.core.reject(str(error))\n                return\n            if len(self.pending) >= self.p['pending_max_samples']:\n                self.pending.popleft()\n                self.core.reject('GNSS_PENDING_OVERFLOW')\n            self.pending.append((sample, time.monotonic()))\n            self._pending(now)\n\n    def _pending(self, now):\n        if not self.pending:\n            return\n        if not self._clock_ready(now):\n            self.pending.clear()\n            self.core.reject('CLOCK_NOT_READY')\n            return\n        if not self._mount():\n            self.pending.clear()\n            return\n        while self.pending:\n            sample, received = self.pending[0]\n            reason = self.core.observe_gnss(sample, now, True, self.mount)\n            if reason in ('WAITING_FOR_IMU_ALIGNMENT', 'WAITING_FOR_ENCODER_ALIGNMENT'):\n                self.core.reason = reason\n                if time.monotonic()-received \u003c= self.p['pending_wait_sec']:\n                    break\n                self.core.reject(reason+'_TIMEOUT')\n            self.pending.popleft()\n            if reason == 'CALIBRATED':\n                rospy.loginfo('GNSS yaw alignment accepted: offset=%.3f deg, gradual application at %.2f deg/s',\n                              math.degrees(self.core.offset), self.p['max_correction_rate_degps'])\n\n    def timer_callback(self, _event):\n        with self.lock:\n            now = self._time()\n            self._pending(now)\n            values = self.core.status()\n            values.update(self.core.yaw_hold.status())\n            values.update(published_samples=self.published, rejected_imu_samples=self.rejected_imu,\n                          clock_ready=self._clock_ready(now),\n                          heading_accuracy_verified=False, hardware_sensor_sync_verified=False,\n                          original_imu_preserved=True)\n            age = None if self.last_imu_mono is None else time.monotonic()-self.last_imu_mono\n            values['imu_receipt_age_sec'] = age\n            status = DiagnosticStatus(name='CalibratedIMU', hardware_id='imu_gnss_heading_alignment')\n            status.level = DiagnosticStatus.OK if values['state'] == 'CALIBRATED' else DiagnosticStatus.WARN\n            status.message = values['state']+': '+values['reason']\n            if age is None or age > self.p['max_imu_gap_sec']*3:\n                status.level = DiagnosticStatus.ERROR\n                status.message = 'IMU_NOT_RECEIVED' if age is None else 'IMU_STALE'\n            status.values = [KeyValue(key=key, value=json.dumps(value, allow_nan=False))\n                             for key, value in sorted(values.items())]\n            array = DiagnosticArray()\n            array.header.stamp = rospy.Time.now()\n            array.status = [status]\n            self.diagnostics.publish(array)\n\n\nif __name__ == '__main__':\n    rospy.init_node('calibrated_imu')\n    try:\n        node = CalibratedIMU()\n        rospy.spin()\n    except (KeyError, ValueError, rospy.ROSException) as error:\n        rospy.logfatal('CalibratedIMU configuration failed: %s', error)\n        sys.exit(1)","line_count":270,"redacted_lines":[],"functions":[{"line":26,"label":"class CalibratedIMU:"},{"line":27,"label":"def __init__(self):"},{"line":81,"label":"def set_initial_heading(self, request):"},{"line":100,"label":"def _time(self):"},{"line":114,"label":"def _clock_ready(self, now):"},{"line":119,"label":"def _mount(self):"},{"line":131,"label":"def clock_callback(self, message):"},{"line":140,"label":"def twist_callback(self, message):"},{"line":148,"label":"def feedback_callback(self, message):"},{"line":153,"label":"def valid_payload(message):"},{"line":163,"label":"def imu_callback(self, message):"},{"line":195,"label":"def gnss_callback(self, message):"},{"line":214,"label":"def _pending(self, now):"},{"line":237,"label":"def timer_callback(self, _event):"}],"params":[]},"src/localization/src/common/localization_interface_adapter.hpp":{"path":"src/localization/src/common/localization_interface_adapter.hpp","sha256":"31928017dbe6877911aed46ecea761067d401549f2b313c772f6a7a42d64c227","text":"#pragma once\n\n#include \u003cgeometry_msgs/PoseWithCovarianceStamped.h>\n#include \u003cgeometry_msgs/TwistWithCovarianceStamped.h>\n#include \u003cnav_msgs/Odometry.h>\n#include \u003cros/ros.h>\n#include \u003csensor_msgs/Imu.h>\n#include \u003csensor_msgs/NavSatFix.h>\n#include \u003ctopic_tools/shape_shifter.h>\n\nnamespace mando_localization {\n\n/**\n * @brief 차량별 공개 토픽과 패키지 내부 고정 필터 토픽을 연결한다.\n *\n * 메시지를 계산하거나 판정하지 않고 그대로 전달한다. 따라서 공개 토픽 변경은\n * localization_interfaces.yaml 한 곳에서 끝나며 robot_localization 설정은 차량마다\n * 복제하지 않는다.\n */\nclass LocalizationInterfaceAdapter {\n public:\n  LocalizationInterfaceAdapter(const ros::NodeHandle& node,\n                               const ros::NodeHandle& private_node);\n\n private:\n  void imuDriverCallback(const sensor_msgs::ImuConstPtr& message);\n  void gpsDriverCallback(const sensor_msgs::NavSatFixConstPtr& message);\n  void gpsNavPvtDriverCallback(\n      const topic_tools::ShapeShifter::ConstPtr& message);\n  void imuCallback(const sensor_msgs::ImuConstPtr& message);\n  void twistCallback(\n      const geometry_msgs::TwistWithCovarianceStampedConstPtr& message);\n  void gpsPoseCallback(\n      const geometry_msgs::PoseWithCovarianceStampedConstPtr& message);\n  void localOdometryCallback(const nav_msgs::OdometryConstPtr& message);\n  void globalOdometryCallback(const nav_msgs::OdometryConstPtr& message);\n\n  ros::NodeHandle node_;\n  ros::NodeHandle private_node_;\n  ros::Subscriber imu_driver_subscriber_;\n  ros::Subscriber gps_driver_subscriber_;\n  ros::Subscriber gps_navpvt_driver_subscriber_;\n  ros::Subscriber imu_subscriber_;\n  ros::Subscriber twist_subscriber_;\n  ros::Subscriber gps_pose_subscriber_;\n  ros::Subscriber local_odometry_subscriber_;\n  ros::Subscriber global_odometry_subscriber_;\n  ros::Publisher public_imu_publisher_;\n  ros::Publisher public_gps_publisher_;\n  ros::Publisher public_gps_navpvt_publisher_;\n  ros::Publisher internal_imu_publisher_;\n  ros::Publisher internal_twist_publisher_;\n  ros::Publisher internal_gps_pose_publisher_;\n  ros::Publisher public_local_odometry_publisher_;\n  ros::Publisher public_global_odometry_publisher_;\n  std::string public_gps_navpvt_topic_;\n};\n\n}  // namespace mando_localization","line_count":59,"redacted_lines":[],"functions":[{"line":20,"label":"class LocalizationInterfaceAdapter {"}],"params":[]},"src/localization/src/odometry_gps_fusion/local_odometry_history.hpp":{"path":"src/localization/src/odometry_gps_fusion/local_odometry_history.hpp","sha256":"ba070dc8db4698f9c9fdfc788fcce52f9e318944424ef76b85af3f813619014f","text":"#pragma once\n\n#include \u003calgorithm>\n#include \u003ccmath>\n#include \u003cdeque>\n#include \u003citerator>\n#include \u003climits>\n#include \u003cstring>\n\n#include \u003cnav_msgs/Odometry.h>\n\n#include \"common/message_validation.hpp\"\n\nnamespace mando_localization {\n\n// GPS 측정 시각을 양쪽 Local 표본으로 둘러쌀 때만 보간한다. 시간 epoch는\n// 소유 노드가 /clock 역행을 감지하여 clear하며, 늦은 표본은 epoch로 오인하지 않는다.\nclass LocalOdometryHistory {\n public:\n  void configure(double duration, double maximum_gap, std::size_t maximum_count,\n                 const std::string& frame, const std::string& child) {\n    duration_ = duration;\n    maximum_gap_ = maximum_gap;\n    maximum_count_ = maximum_count;\n    frame_ = frame;\n    child_ = child;\n    clear();\n  }\n\n  void clear() { samples_.clear(); }\n  std::size_t size() const { return samples_.size(); }\n\n  bool append(const nav_msgs::Odometry& input, std::string* reason) {\n    const auto& p = input.pose.pose.position;\n    geometry_msgs::Quaternion orientation;\n    if (input.header.stamp.isZero() || input.header.frame_id != frame_ ||\n        input.child_frame_id != child_ || !std::isfinite(p.x) ||\n        !std::isfinite(p.y) || !std::isfinite(p.z)) {\n      *reason = \"invalid_local_frame_stamp_or_position\";\n      return false;\n    }\n    if (!MessageValidation::normalizeQuaternion(input.pose.pose.orientation,\n                                                1.0e-6, 0.1, &orientation, reason) ||\n        !MessageValidation::validateCovariance(input.pose.covariance.data(), 6,\n            false, std::numeric_limits\u003cdouble>::max(), reason)) {\n      return false;\n    }\n    if (!samples_.empty() && input.header.stamp \u003c= samples_.back().header.stamp) {\n      *reason = \"local_timestamp_not_monotonic\";\n      return false;\n    }\n    samples_.push_back(input);\n    samples_.back().pose.pose.orientation = orientation;\n    while (samples_.size() > maximum_count_ ||\n           (samples_.size() > 1 &&\n            (samples_.back().header.stamp - samples_.front().header.stamp).toSec() > duration_)) {\n      samples_.pop_front();\n    }\n    reason->clear();\n    return true;\n  }\n\n  bool sample(const ros::Time& stamp, nav_msgs::Odometry* output,\n              std::string* reason) const {\n    if (samples_.empty()) {\n      *reason = \"local_history_empty\";\n      return false;\n    }\n    if (stamp \u003c samples_.front().header.stamp) {\n      *reason = \"gps_before_local_history\";\n      return false;\n    }\n    if (stamp > samples_.back().header.stamp) {\n      *reason = \"awaiting_local_odometry\";\n      return false;\n    }\n    const auto right = std::lower_bound(samples_.begin(), samples_.end(), stamp,\n        [](const nav_msgs::Odometry& sample, const ros::Time& time) {\n          return sample.header.stamp \u003c time;\n        });\n    if (right->header.stamp == stamp) {\n      *output = *right;\n      reason->clear();\n      return true;\n    }\n    const auto left = std::prev(right);\n    const double gap = (right->header.stamp - left->header.stamp).toSec();\n    if (gap > maximum_gap_ + 1.0e-9) {\n      *reason = \"gps_local_interpolation_gap_too_large\";\n      return false;\n    }\n    const double weight = (stamp - left->header.stamp).toSec() / gap;\n    *output = *left;\n    output->header.stamp = stamp;\n    auto& p = output->pose.pose.position;\n    const auto& a = left->pose.pose.position;\n    const auto& b = right->pose.pose.position;\n    p.x = (1.0 - weight) * a.x + weight * b.x;\n    p.y = (1.0 - weight) * a.y + weight * b.y;\n    p.z = (1.0 - weight) * a.z + weight * b.z;\n    // 두 PSD covariance의 convex combination은 PSD를 유지한다.\n    for (std::size_t i = 0; i \u003c output->pose.covariance.size(); ++i) {\n      output->pose.covariance[i] = (1.0 - weight) * left->pose.covariance[i] +\n                                  weight * right->pose.covariance[i];\n    }\n    const auto& qa = left->pose.pose.orientation;\n    const auto& qb = right->pose.pose.orientation;\n    double av[4] = {qa.x, qa.y, qa.z, qa.w};\n    double bv[4] = {qb.x, qb.y, qb.z, qb.w};\n    double dot = 0.0;\n    for (int i = 0; i \u003c 4; ++i) dot += av[i] * bv[i];\n    if (dot \u003c 0.0) {\n      for (double& value : bv) value = -value;\n      dot = -dot;\n    }\n    dot = std::max(0.0, std::min(1.0, dot));\n    double wa = 1.0 - weight, wb = weight;\n    if (dot \u003c 0.9995) {\n      const double angle = std::acos(dot);\n      wa = std::sin((1.0 - weight) * angle) / std::sin(angle);\n      wb = std::sin(weight * angle) / std::sin(angle);\n    }\n    double q[4], norm = 0.0;\n    for (int i = 0; i \u003c 4; ++i) {\n      q[i] = wa * av[i] + wb * bv[i];\n      norm += q[i] * q[i];\n    }\n    norm = std::sqrt(norm);\n    auto& orientation = output->pose.pose.orientation;\n    orientation.x = q[0] / norm;\n    orientation.y = q[1] / norm;\n    orientation.z = q[2] / norm;\n    orientation.w = q[3] / norm;\n    reason->clear();\n    return true;\n  }\n\n private:\n  double duration_ = 2.0;\n  double maximum_gap_ = 0.10;\n  std::size_t maximum_count_ = 200;\n  std::string frame_ = \"odom\";\n  std::string child_ = \"base_link\";\n  std::deque\u003cnav_msgs::Odometry> samples_;\n};\n\n}  // namespace mando_localization","line_count":147,"redacted_lines":[],"functions":[{"line":18,"label":"class LocalOdometryHistory {"}],"params":[]},"src/localization/launch/map_data_collection.launch":{"path":"src/localization/launch/map_data_collection.launch","sha256":"8ddaeb72f340dfb71f18fed7f930dc40cc90a877df106fb9e9913da045a60c39","text":"\u003claunch>\n  \u003carg name=\"start_rddf_initialization\" default=\"true\"/>\n  \u003carg name=\"rddf_initialization_config\" default=\"$(find mando_localization)/config/rddf_initialization.yaml\"/>\n  \u003carg name=\"lidar_driver_config\" default=\"$(find mando_localization)/config/lidar_driver.yaml\"/>\n  \u003carg name=\"lidar_serial_port\" default=\"/dev/lidar\"/>\n  \u003carg name=\"lidar_frame_id\" default=\"laser_link\"/>\n  \u003carg name=\"lidar_scan_topic\" default=\"/molit/sensors/lidar/scan\"/>\n  \u003carg name=\"lidar_driver_node_name\" default=\"mando_rplidar_s2\"/>\n  \u003carg name=\"rviz_config\"\n       default=\"$(find mando_localization)/config/localization_viewer.yaml\"/>\n\n  \u003carg name=\"start_encoder_driver\" default=\"true\"/>\n  \u003carg name=\"start_imu_driver\" default=\"true\"/>\n  \u003carg name=\"start_calibrated_imu\" default=\"true\"/>\n  \u003carg name=\"initialize_heading\" default=\"true\"/>\n  \u003carg name=\"initial_heading_config\" default=\"$(find mando_localization)/config/initial_heading.yaml\"/>\n  \u003carg name=\"calibrated_imu_node_name\" default=\"calibrated_imu\"/>\n  \u003carg name=\"start_gps_driver\" default=\"true\"/>\n  \u003carg name=\"start_lidar_driver\" default=\"true\"/>\n  \u003carg name=\"start_rviz\" default=\"true\"/>\n  \u003carg name=\"start_recording\" default=\"true\"/>\n  \u003carg name=\"time_sync_config\" default=\"$(find mando_localization)/config/time_sync.yaml\"/>\n  \u003carg name=\"gps_driver_config\" default=\"$(find mando_localization)/config/gps_driver.yaml\"/>\n  \u003carg name=\"imu_heading_config\" default=\"$(find mando_localization)/config/imu_heading_calibration.yaml\"/>\n\n  \u003carg name=\"bag_prefix\" default=\"/tmp/mando_map_collection\"/>\n  \u003carg name=\"bag_split_size_mb\" default=\"2048\"/>\n  \u003carg name=\"bag_min_space\" default=\"10G\"/>\n  \u003c!-- Odometry로 재생성 가능한 누적 경로는 매 갱신마다 전체 배열이 반복되므로 기록하지 않는다. -->\n  \u003carg name=\"bag_exclude_regex\"\n       default=\"^(/molit/localization/(path|markers)|/mando_localization/visualization/debug/scene)$\"/>\n\n  \u003c!-- 현장 실센서 기록에는 wall time을 사용한다. /clock은 재생할 때 생성한다. -->\n  \u003cparam name=\"/use_sim_time\" type=\"bool\" value=\"false\"/>\n\n  \u003c!-- Local/Global/RDDF 화면은 bringup의 공통 viewer.launch 한 곳에서 실행한다. -->\n  \u003cgroup if=\"$(arg start_lidar_driver)\">\n    \u003c!-- LiDAR가 빠지면 LiDAR 없는 주행을 계속 기록하지 않고 전체 launch를 종료한다. -->\n    \u003cnode pkg=\"rplidar_ros\" type=\"rplidarNode\"\n          name=\"$(arg lidar_driver_node_name)\" output=\"screen\" required=\"true\"\n          clear_params=\"true\">\n      \u003crosparam command=\"load\" file=\"$(arg lidar_driver_config)\"/>\n      \u003cparam name=\"serial_port\" type=\"string\" value=\"$(arg lidar_serial_port)\"/>\n      \u003cparam name=\"frame_id\" type=\"string\" value=\"$(arg lidar_frame_id)\"/>\n      \u003cremap from=\"scan\" to=\"$(arg lidar_scan_topic)\"/>\n    \u003c/node>\n  \u003c/group>\n\n  \u003cinclude file=\"$(find mando_localization)/launch/bringup.launch\">\n    \u003carg name=\"start_rddf_initialization\" value=\"$(arg start_rddf_initialization)\"/>\n    \u003carg name=\"rddf_initialization_config\" value=\"$(arg rddf_initialization_config)\"/>\n    \u003carg name=\"initialize_heading\" value=\"$(arg initialize_heading)\"/>\n    \u003carg name=\"initial_heading_config\" value=\"$(arg initial_heading_config)\"/>\n    \u003carg name=\"start_encoder_driver\" value=\"$(arg start_encoder_driver)\"/>\n    \u003carg name=\"start_imu_driver\" value=\"$(arg start_imu_driver)\"/>\n    \u003carg name=\"start_calibrated_imu\" value=\"$(arg start_calibrated_imu)\"/>\n    \u003carg name=\"calibrated_imu_node_name\" value=\"$(arg calibrated_imu_node_name)\"/>\n    \u003carg name=\"start_gps_driver\" value=\"$(arg start_gps_driver)\"/>\n    \u003carg name=\"time_sync_config\" value=\"$(arg time_sync_config)\"/>\n    \u003carg name=\"gps_driver_config\" value=\"$(arg gps_driver_config)\"/>\n    \u003carg name=\"imu_heading_config\" value=\"$(arg imu_heading_config)\"/>\n    \u003carg name=\"start_static_tf_publisher\" value=\"true\"/>\n    \u003carg name=\"rviz_config\" value=\"$(arg rviz_config)\"/>\n    \u003carg name=\"start_rviz\" value=\"$(arg start_rviz)\"/>\n  \u003c/include>\n\n  \u003cgroup if=\"$(arg start_recording)\">\n    \u003c!-- -a로 외부 센서도 담되, 원본 Odometry에서 복원 가능한 누적 시각화만 제외한다. -->\n    \u003cnode pkg=\"rosbag\" type=\"record\" name=\"mapping_rosbag_recorder\"\n          output=\"screen\" required=\"true\"\n          args=\"-a --exclude='$(arg bag_exclude_regex)' --lz4 --split --size=$(arg bag_split_size_mb) --repeat-latched --min-space=$(arg bag_min_space) -O '$(arg bag_prefix)'\"/>\n  \u003c/group>\n\u003c/launch>","line_count":73,"redacted_lines":[],"functions":[],"params":[]},"src/localization/scripts/lidar_front_scan_visualizer.py":{"path":"src/localization/scripts/lidar_front_scan_visualizer.py","sha256":"b226e78cf0b8dc838523c0c0efa61771142e9b1e0f8f17d7dd0ebace2e3036be","text":"#!/usr/bin/env python3\n\"\"\"차량 전방을 기준으로 LiDAR 표시 범위를 제한한다. 센서 TF는 발행하지 않는다.\"\"\"\n\nimport copy\nimport math\n\nimport rospy\nimport tf2_ros\nfrom sensor_msgs.msg import LaserScan\n\n\ndef mask_front_sector(scan, rotation, min_angle_rad, max_angle_rad):\n    \"\"\"센서 원점에서 본 ray 방향을 차량 축으로 회전한 뒤 후방을 NaN 처리한다.\n\n    배열을 자르거나 재정렬하지 않아 beam timestamp와 각도 인덱스가 유지된다.\n    장착 translation은 방향 판정에 쓰지 않는다. 센서보다 뒤쪽이 제거 기준이다.\n    \"\"\"\n    if (not math.isfinite(scan.angle_min)\n            or not math.isfinite(scan.angle_increment)\n            or scan.angle_increment == 0.0):\n        raise ValueError(\"invalid scan angles\")\n    if not (-math.pi \u003c= min_angle_rad \u003c max_angle_rad \u003c= math.pi):\n        raise ValueError(\"invalid front sector\")\n    if scan.intensities and len(scan.intensities) != len(scan.ranges):\n        raise ValueError(\"intensity count differs from range count\")\n    values = (rotation.x, rotation.y, rotation.z, rotation.w)\n    norm = math.sqrt(sum(value * value for value in values))\n    if not math.isfinite(norm) or norm \u003c 1e-12:\n        raise ValueError(\"invalid mounting quaternion\")\n    x, y, z, w = (value / norm for value in values)\n    r00, r01 = 1 - 2 * (y * y + z * z), 2 * (x * y - w * z)\n    r10, r11 = 2 * (x * y + w * z), 1 - 2 * (x * x + z * z)\n    output = copy.deepcopy(scan)\n    output.ranges = list(scan.ranges)\n    output.intensities = list(scan.intensities)\n    # LaserScan float32 각도에서 +/-90도 경계의 반올림 오차를 허용한다.\n    epsilon = 1e-7\n    for index in range(len(scan.ranges)):\n        angle = scan.angle_min + index * scan.angle_increment\n        cosine, sine = math.cos(angle), math.sin(angle)\n        forward = r00 * cosine + r01 * sine\n        left = r10 * cosine + r11 * sine\n        vehicle_angle = math.atan2(left, forward)\n        keep = (math.hypot(forward, left) > 1e-9\n                and min_angle_rad - epsilon \u003c= vehicle_angle \u003c= max_angle_rad + epsilon)\n        if not keep:\n            output.ranges[index] = float(\"nan\")\n            if output.intensities:\n                output.intensities[index] = 0.0\n    return output\n\n\nclass LidarFrontScanVisualizer:\n    def __init__(self):\n        self._input = rospy.get_param(\"~topics/lidar_scan\")\n        self._output = rospy.get_param(\"~output_topic\")\n        self._base_frame = rospy.get_param(\"~frames/base_link\")\n        self._lidar_frame = rospy.get_param(\"~frames/lidar\")\n        self._minimum = math.radians(float(rospy.get_param(\"~sector/min_angle_deg\")))\n        self._maximum = math.radians(float(rospy.get_param(\"~sector/max_angle_deg\")))\n        self._timeout = float(rospy.get_param(\"~tf_timeout_sec\"))\n        if rospy.resolve_name(self._input) == rospy.resolve_name(self._output):\n            raise ValueError(\"scan input and output must differ\")\n        if not (-math.pi \u003c= self._minimum \u003c self._maximum \u003c= math.pi):\n            raise ValueError(\"invalid front sector\")\n        if not math.isfinite(self._timeout) or self._timeout \u003c= 0:\n            raise ValueError(\"tf_timeout_sec must be finite and positive\")\n        self._buffer = tf2_ros.Buffer()\n        self._listener = tf2_ros.TransformListener(self._buffer)\n        self._publisher = rospy.Publisher(self._output, LaserScan, queue_size=2)\n        self._subscriber = rospy.Subscriber(\n            self._input, LaserScan, self._callback, queue_size=2\n        )\n        rospy.loginfo(\"LiDAR 전방 표시: %s -> %s, 차량 기준 %.1f~%.1f deg\",\n                      self._input, self._output,\n                      math.degrees(self._minimum), math.degrees(self._maximum))\n\n    def _callback(self, scan):\n        if scan.header.frame_id != self._lidar_frame or scan.header.stamp.is_zero():\n            rospy.logwarn_throttle(5.0, \"LiDAR 표시 생략: frame 또는 timestamp 불일치\")\n            return\n        try:\n            transform = self._buffer.lookup_transform(\n                self._base_frame, scan.header.frame_id, scan.header.stamp,\n                rospy.Duration(self._timeout)\n            )\n            masked = mask_front_sector(\n                scan, transform.transform.rotation, self._minimum, self._maximum\n            )\n        except (tf2_ros.LookupException, tf2_ros.ConnectivityException,\n                tf2_ros.ExtrapolationException, ValueError) as error:\n            rospy.logwarn_throttle(5.0, \"LiDAR 표시 생략: %s\", error)\n            return\n        self._publisher.publish(masked)\n\n\nif __name__ == \"__main__\":\n    rospy.init_node(\"lidar_front_scan_visualizer\")\n    LidarFrontScanVisualizer()\n    rospy.spin()","line_count":100,"redacted_lines":[],"functions":[{"line":12,"label":"def mask_front_sector(scan, rotation, min_angle_rad, max_angle_rad):"},{"line":53,"label":"class LidarFrontScanVisualizer:"},{"line":54,"label":"def __init__(self):"},{"line":78,"label":"def _callback(self, scan):"}],"params":[]},"src/localization/config/lidar_front_visualization.yaml":{"path":"src/localization/config/lidar_front_visualization.yaml","sha256":"934a3e8e0500b311df962d8e7eff29b67fa7d7bd91aecc9b608bd44419952d1d","text":"# 센서 장착 TF의 회전을 사용해 차량 전방을 0도로 정의한다.\n# 센서 원점 기준 전방 반원만 표시한다. raw scan 및 물리 TF는 유지한다.\noutput_topic: /mando_localization/visualization/lidar/front_scan\nsector:\n  min_angle_deg: -90.0\n  max_angle_deg: 90.0\ntf_timeout_sec: 0.05","line_count":7,"redacted_lines":[],"functions":[],"params":[["output_topic","/mando_localization/visualization/lidar/front_scan"],["sector.min_angle_deg",-90.0],["sector.max_angle_deg",90.0],["tf_timeout_sec",0.05]]},"src/localization/scripts/localization_viewer.py":{"path":"src/localization/scripts/localization_viewer.py","sha256":"10ac2dd0cbc8802d7fb864b356ff52da38153b0f88fe19a53c29eead1f38e7b9","text":"#!/usr/bin/env python3\n\"\"\"Single RViz viewer for live localization and explicitly selected recorded outputs.\n\nRecorded outputs use a display-only common XY translation. Live RDDF-map mode\nalso offers an explicit startup-pose request; hovering never changes estimation.\nTime navigation redraws buffered results and never rewinds ROS /clock.\n\"\"\"\nimport argparse\nimport bisect\nimport csv\nimport json\nimport math\nimport os\nfrom pathlib import Path\nimport queue\nimport sys\nimport time\nfrom typing import Dict, Tuple\n\n# Catkin executes this script through a relay in devel/lib.  Put the real\n# scripts directory first so helper modules resolve to their source files,\n# rather than to Catkin relay scripts that do not export their definitions.\nsys.path.insert(0, str(Path(__file__).resolve().parent))\n\nimport numpy as np\nimport rosbag\nimport rospkg\nimport yaml\n\nWGS84_A_M = 6378137.0\nWGS84_E2 = 6.69437999014e-3\nPACKAGE = Path(rospkg.RosPack().get_path('mando_localization'))\nWORKSPACE = PACKAGE.parent.parent\nFRAME = 'localization_debug'\nPREFIX = '/mando_localization/visualization/debug'\nDEFAULT_CONFIG = yaml.safe_load((PACKAGE/'config/localization_viewer.yaml').read_text())\nTOPICS = dict(DEFAULT_CONFIG['topics'])\nCOLORS = {key:tuple(value) for key,value in DEFAULT_CONFIG['colors'].items()}\nINITIALIZATION_PREFIX = '/mando_localization/internal/initialization'\n\n\ndef topdown_screen_to_map(x, y, width, height, scale, center_x, center_y,\n                          angle=0., pixel_ratio=1.):\n    \"\"\"Invert RViz TopDownOrtho projection, including native-pixel dimensions.\n\n    RViz RenderWidget rounds its native render-window width up to an even pixel.\n    The view controller's Scale is native pixels per metre, and Angle rotates\n    camera +X/+Y about map +Z. Qt event coordinates remain logical pixels.\n    \"\"\"\n    values = [x, y, width, height, scale, center_x, center_y, angle, pixel_ratio]\n    if not all(math.isfinite(float(value)) for value in values):\n        raise ValueError('non-finite RViz projection')\n    if width \u003c= 0 or height \u003c= 0 or scale \u003c= 0 or pixel_ratio \u003c= 0:\n        raise ValueError('invalid RViz projection dimensions')\n    native_width = int(width * pixel_ratio)\n    native_width += native_width % 2\n    native_height = int(height * pixel_ratio)\n    dx = (x * pixel_ratio - native_width / 2.) / scale\n    dy = (native_height / 2. - y * pixel_ratio) / scale\n    c, s = math.cos(angle), math.sin(angle)\n    return center_x + c * dx - s * dy, center_y + s * dx + c * dy\n\n\ndef manual_initialization_request(match, stamp):\n    \"\"\"One atomic route/position request; coordinator repeats all admission checks.\"\"\"\n    if not match or not match.get('accepted') or not math.isfinite(stamp) or stamp \u003c= 0:\n        raise ValueError('manual initialization requires an accepted pose and valid ROS time')\n    result = dict(frame_id='map', stamp=float(stamp), route=match['route'])\n    for key in ('x', 'y', 'yaw'):\n        value = float(match[key])\n        if not math.isfinite(value):\n            raise ValueError('non-finite manual pose')\n        result[key] = value\n    return result\n\n\ndef stream_reception_status(stamps, position, stale_sec, missing_text='미수신'):\n    \"\"\"Return a display-only reception state for a raw sensor stream.\"\"\"\n    if (not math.isfinite(float(position)) or not math.isfinite(float(stale_sec))\n            or stale_sec \u003c= 0):\n        raise ValueError('stream reception timing must be finite and positive')\n    index = bisect.bisect_right(stamps, position)-1\n    if index \u003c 0:\n        return 1, missing_text\n    age = position-stamps[index]\n    if not math.isfinite(age) or age \u003c 0:\n        return 2, '수신 시각 오류'\n    if age \u003c= stale_sec:\n        return 0, '연결됨 · 데이터 수신 중'\n    return 2, '수신 끊김'\n\n\ndef load_rddf(rddf_dir: Path) -> Tuple[Dict[str, np.ndarray], Dict]:\n    project_path = rddf_dir / \"yongin_route_project.json\"\n    project = json.loads(project_path.read_text(encoding=\"utf-8-sig\"))\n    routes: Dict[str, np.ndarray] = {}\n    expected_header = [\n        \"route_id\",\n        \"route_name\",\n        \"closed\",\n        \"index\",\n        \"latitude\",\n        \"longitude\",\n        \"east_m\",\n        \"north_m\",\n        \"distance_m\",\n        \"path_yaw_rad\",\n    ]\n    for path in sorted(rddf_dir.glob(\"*.csv\")):\n        with path.open(encoding=\"utf-8-sig\", newline=\"\") as stream:\n            reader = csv.DictReader(stream)\n            if reader.fieldnames != expected_header:\n                raise RuntimeError(f\"unexpected RDDF header: {path}\")\n            rows = list(reader)\n        if not rows:\n            raise RuntimeError(f\"empty RDDF CSV: {path}\")\n        name = rows[0][\"route_name\"]\n        routes[name] = np.asarray(\n            [(float(row[\"east_m\"]), float(row[\"north_m\"])) for row in rows],\n            dtype=float,\n        )\n    if not routes or not all(np.isfinite(points).all() for points in routes.values()):\n        raise ValueError('RDDF routes must contain finite points')\n    return routes, project\n\ndef project_wgs84(\n    latitude_deg: float, longitude_deg: float, origin: Dict[str, float]\n) -> Tuple[float, float]:\n    latitude_rad = math.radians(float(origin[\"lat\"]))\n    sin_latitude = math.sin(latitude_rad)\n    denominator = math.sqrt(1.0 - WGS84_E2 * sin_latitude * sin_latitude)\n    prime_vertical_radius_m = WGS84_A_M / denominator\n    meridian_radius_m = (\n        WGS84_A_M\n        * (1.0 - WGS84_E2)\n        / (denominator * denominator * denominator)\n    )\n    east_m = (\n        prime_vertical_radius_m\n        * math.cos(latitude_rad)\n        * math.radians(longitude_deg - float(origin[\"lng\"]))\n    )\n    north_m = meridian_radius_m * math.radians(\n        latitude_deg - float(origin[\"lat\"])\n    )\n    return east_m, north_m\n\ndef yaw_of(q):\n    values = np.asarray([q.x, q.y, q.z, q.w], dtype=float)\n    norm = float(np.linalg.norm(values))\n    if not np.isfinite(values).all() or abs(norm - 1.0) > 0.01:\n        raise ValueError('invalid orientation quaternion')\n    x, y, z, w = values / norm\n    return math.atan2(2 * (w*z + x*y), 1 - 2 * (y*y + z*z))\n\n\ndef final_bag(path):\n    path = Path(path).expanduser().resolve(strict=True)\n    if path.suffix != '.bag' or Path(str(path) + '.active').exists():\n        raise RuntimeError('Recording must be finalized before viewing: ' + str(path))\n    return path\n\n\ndef decode_sample(key, message, project):\n    if key in ('local', 'global'):\n        p = message.pose.pose.position\n        value = (p.x, p.y, yaw_of(message.pose.pose.orientation))\n        if not np.isfinite(value).all():\n            raise ValueError('non-finite odometry')\n    elif key == 'gps':\n        if (message.status.status \u003c 0 or not np.isfinite([message.latitude, message.longitude]).all()\n                or not -90 \u003c= message.latitude \u003c= 90 or not -180 \u003c= message.longitude \u003c= 180):\n            raise ValueError('invalid GPS fix')\n        value = project_wgs84(message.latitude, message.longitude, project['origin'])\n    elif key == 'speed':\n        value = float(message.speed)\n        if not math.isfinite(value):\n            raise ValueError('non-finite speed')\n    elif key in ('state', 'valid'):\n        value = message.data\n    elif key.startswith('imu_'):\n        value = yaw_of(message.orientation)\n    elif key == 'calibration':\n        statuses = [status for status in message.status if status.name == 'CalibratedIMU']\n        if not statuses:\n            return None\n        status = statuses[-1]\n        value = {'diagnostic_level': status.level, 'diagnostic_message': status.message}\n        for pair in status.values:\n            try:\n                value[pair.key] = json.loads(pair.value)\n            except ValueError:\n                value[pair.key] = pair.value\n    elif key == 'diagnostics':\n        value = {}\n        for status in message.status:\n            if status.hardware_id != 'mando_localization':\n                continue\n            value[status.name] = {\n                'level': int(status.level),\n                'message': status.message,\n                'values': {pair.key: pair.value for pair in status.values},\n            }\n        if not value:\n            return None\n    else:\n        # LaserScan ranges are already float32 on the wire; keeping compact\n        # arrays avoids retaining millions of boxed Python float objects.\n        value = {'ranges': np.asarray(message.ranges, dtype=np.float32),\n                 'angle_min': message.angle_min, 'angle_increment': message.angle_increment,\n                 'range_min': message.range_min, 'range_max': message.range_max}\n    return value\n\n\nclass SceneData:\n    \"\"\"Same decoding, anchor, ordering and retention rules for files and live input.\"\"\"\n    def __init__(self, rddf_dir, source_start=None, duration=0., processed_bag=None,\n                 limit=200000, frame_mode='first_gps_translation'):\n        self.routes, self.project = load_rddf(Path(rddf_dir))\n        self.rddf_dir = Path(rddf_dir)\n        if frame_mode not in ('first_gps_translation', 'rddf_map'):\n            raise ValueError('unknown viewer frame_mode: ' + str(frame_mode))\n        self.frame_mode = frame_mode\n        self.start, self.duration, self.limit = source_start, duration, limit\n        self.data = {key: [] for key in TOPICS}\n        self.times = {key: [] for key in TOPICS}\n        self.mount = None\n        self.shift = np.zeros(2) if frame_mode == 'rddf_map' else None\n        self.first_local = self.first_gps = None\n        self.summary = {'processed_bag': str(processed_bag) if processed_bag else None,\n                        'common_xy_translation_m': self.shift.tolist() if self.shift is not None else None,\n                        'frame_mode': frame_mode, 'additional_viewer_yaw_rotation_rad': 0.,\n                        'skipped': 0, 'buffer_dropped': 0, 'clock_resets': 0}\n        self.last_receipt = None\n\n    def reset(self, stamp):\n        for key in TOPICS:\n            self.data[key].clear(); self.times[key].clear()\n        self.first_local = self.first_gps = None\n        self.shift = np.zeros(2) if self.frame_mode == 'rddf_map' else None\n        self.start, self.duration = stamp, 0.\n        self.summary['common_xy_translation_m'] = self.shift.tolist() if self.shift is not None else None\n        self.summary['clock_resets'] += 1\n\n    def ingest(self, key, message, stamp, live=False):\n        if key == 'tf':\n            for tr in message.transforms:\n                if tr.header.frame_id.lstrip('/') == 'base_link' and tr.child_frame_id.lstrip('/') == 'laser_link':\n                    q, p = tr.transform.rotation, tr.transform.translation\n                    vals = [p.x,p.y,p.z,q.x,q.y,q.z,q.w]\n                    if np.isfinite(vals).all() and abs(np.linalg.norm(vals[3:])-1)\u003c.01:\n                        self.mount = tr\n            return\n        if not math.isfinite(stamp) or stamp \u003c= 0:\n            self.summary['skipped'] += 1; return\n        if self.start is None:\n            self.start = stamp\n        if live and self.last_receipt is not None and stamp \u003c self.last_receipt-1.0:\n            self.reset(stamp)\n        self.last_receipt = stamp\n        elapsed = stamp-self.start\n        if elapsed \u003c 0 or (not live and elapsed > self.duration):\n            self.summary['skipped'] += 1; return\n        if self.times[key] and elapsed \u003c self.times[key][-1]:\n            self.summary['skipped'] += 1; return\n        try:\n            value = decode_sample(key, message, self.project)\n            if value is None: return\n        except (ValueError, TypeError, OverflowError):\n            self.summary['skipped'] += 1; return\n        self.times[key].append(elapsed); self.data[key].append(value)\n        if live: self.duration = max(self.duration, elapsed)\n        if key == 'local' and self.first_local is None: self.first_local = np.asarray(value[:2])\n        if key == 'gps' and self.first_gps is None: self.first_gps = np.asarray(value)\n        if self.shift is None and self.first_local is not None and self.first_gps is not None:\n            self.shift = self.first_gps-self.first_local\n            self.summary['common_xy_translation_m'] = self.shift.tolist()\n        limit = min(self.limit, 6000) if key == 'scan' else self.limit\n        if live and len(self.data[key]) > limit:\n            count = max(1,limit//10)\n            del self.data[key][:count]; del self.times[key][:count]\n            self.summary['buffer_dropped'] += count\n\n    def points(self, key, count=None):\n        width = 2 if key == 'gps' else 3\n        values = np.asarray(self.data[key][:count], dtype=float).reshape((-1,width)).copy()\n        if key != 'gps':\n            if self.shift is None: return np.empty((0,width))\n            values[:,:2] += self.shift\n        return values\n\n\ndef load_data(processed_bag, source_bag, rddf_dir, limit, frame_mode='first_gps_translation'):\n    processed_bag = final_bag(processed_bag)\n    source_bag = final_bag(source_bag) if source_bag else processed_bag\n    with rosbag.Bag(str(source_bag)) as bag:\n        start, end = bag.get_start_time(), bag.get_end_time()\n    model = SceneData(rddf_dir, start, end-start, processed_bag, limit, frame_mode)\n    reverse = {value: key for key,value in TOPICS.items()}\n    with rosbag.Bag(str(processed_bag)) as bag:\n        for topic,message,stamp in bag.read_messages(topics=list(reverse)+['/tf_static']):\n            model.ingest('tf' if topic == '/tf_static' else reverse[topic],message,stamp.to_sec())\n    if not any(model.data[key] for key in ('local','global')):\n        raise ValueError('Selected bag has no computed Local/Global output. Recompute with replay.launch first.')\n    model.summary.update(counts={key:len(rows) for key,rows in model.data.items()},duration_s=model.duration,\n                         source_bag=str(source_bag))\n    return model\n\ndef run_gui(model, seek, live=False, config=None):\n    import rospy\n    from geometry_msgs.msg import Point, TransformStamped\n    from visualization_msgs.msg import Marker, MarkerArray\n    from tf2_msgs.msg import TFMessage\n    from std_msgs.msg import String, Float64, Bool\n    from python_qt_binding import QtCore, QtGui, QtWidgets\n    from rviz import bindings as rviz\n    from tf.transformations import quaternion_matrix\n\n    class Slider(QtWidgets.QSlider):\n        def point(self, event):\n            return round(self.maximum() * max(0, min(1, event.x()/max(1, self.width()))))\n\n        def mousePressEvent(self, event):\n            if event.button() == QtCore.Qt.LeftButton:\n                self.setSliderDown(True)\n                self.setValue(self.point(event))\n\n        def mouseMoveEvent(self, event):\n            if self.isSliderDown():\n                self.setValue(self.point(event))\n\n        def mouseReleaseEvent(self, event):\n            self.setSliderDown(False)\n\n    class Viewer(QtWidgets.QWidget):\n        seek_signal = QtCore.Signal(float)\n        follow_signal = QtCore.Signal(bool)\n        initialization_signal = QtCore.Signal(str)\n\n        def __init__(self):\n            super().__init__()\n            self.model = model\n            self.routes, self.data, self.times = model.routes, model.data, model.times\n            self.duration, self.mount, self.summary = model.duration, model.mount, model.summary\n            self.follow_live = live\n            self.inbox = queue.Queue(maxsize=10000)\n            self.input_dropped = 0\n            self.initialization = {}\n            self.selection_active = False\n            self.preview = None\n            self.selection_message = ''\n            self.route_map = None\n            self.manual_enabled = live and model.frame_mode == 'rddf_map'\n            self.manual_snap_distance = float(config.get('manual_snap_distance_m', 5.0))\n            self.imu_raw_stale_sec = float(config.get('imu_raw_stale_sec', 0.5))\n            if not math.isfinite(self.manual_snap_distance) or self.manual_snap_distance \u003c= 0:\n                raise ValueError('manual_snap_distance_m must be finite and positive')\n            if not math.isfinite(self.imu_raw_stale_sec) or self.imu_raw_stale_sec \u003c= 0:\n                raise ValueError('imu_raw_stale_sec must be finite and positive')\n            if self.manual_enabled:\n                from rddf_initialization_core import RddfRouteMap\n                self.route_map = RddfRouteMap(model.rddf_dir)\n            self.position = self.duration if seek is None else max(0.0, min(self.duration, seek))\n            self.playing, self.last, self.rate, self.drag_play = False, time.monotonic(), 1.0, False\n            rospy.init_node('mando_localization_rviz', disable_signals=True)\n            self.scene = rospy.Publisher(PREFIX+'/scene', MarkerArray, queue_size=1, latch=True)\n            self.status = rospy.Publisher(PREFIX+'/status', String, queue_size=1, latch=True)\n            self.tf = rospy.Publisher('/tf_static', TFMessage, queue_size=1, latch=True)\n            if self.manual_enabled:\n                self.manual_request = rospy.Publisher(INITIALIZATION_PREFIX+'/manual_request', String,\n                                                      queue_size=1, latch=False)\n                self.manual_active = rospy.Publisher(INITIALIZATION_PREFIX+'/manual_active', Bool,\n                                                     queue_size=1, latch=True)\n                self.manual_active.publish(Bool(False))\n                self.initialization_signal.connect(self.initialization_changed)\n            transform = TransformStamped()\n            transform.header.frame_id, transform.child_frame_id = FRAME+'_world', FRAME\n            transform.transform.rotation.w = 1\n            self.tf.publish(TFMessage([transform]))\n            self.seek_signal.connect(self.seek)\n            self.follow_signal.connect(lambda follow: self.go_latest() if follow else setattr(self, \"follow_live\", False))\n            self.follow_remote = rospy.Subscriber(PREFIX+\"/follow_live\", Bool, lambda msg: self.follow_signal.emit(msg.data))\n            self.remote = rospy.Subscriber(PREFIX+'/seek_seconds', Float64,\n                                            lambda msg: self.seek_signal.emit(msg.data))\n            self.setWindowTitle('Localization · RDDF 공통 RViz · '+('실시간 입력' if live else str(model.summary['processed_bag'])))\n            layout = QtWidgets.QVBoxLayout(self)\n            heading = QtWidgets.QLabel('RDDF 공통 뷰어  |  초록 Local · 빨강 Global · 보라 Raw GPS · 파랑 RDDF')\n            heading.setStyleSheet('font-size:16px;font-weight:bold;padding:6px')\n            layout.addWidget(heading)\n            if self.manual_enabled:\n                selection = QtWidgets.QHBoxLayout()\n                self.select_button = QtWidgets.QPushButton('시작 위치 선택')\n                self.select_button.setObjectName('initialization_select_button')\n                self.select_button.setCheckable(True)\n                self.select_button.setEnabled(False)\n                self.select_button.setMinimumHeight(37)\n                self.select_button.toggled.connect(self.set_selection_active)\n                selection.addWidget(self.select_button)\n                selection.addWidget(QtWidgets.QLabel('진행 경로'))\n                self.route_choice = QtWidgets.QComboBox()\n                self.route_choice.setObjectName('initialization_route_choice')\n                self.route_choice.addItem('자동 (가까운 RDDF)', '')\n                for name in sorted(self.route_map.routes):\n                    self.route_choice.addItem(name, name)\n                self.route_choice.currentIndexChanged.connect(self.route_changed)\n                self.route_choice.setEnabled(False)\n                selection.addWidget(self.route_choice)\n                self.initialization_label = QtWidgets.QLabel('초기화 노드 상태 대기')\n                self.initialization_label.setWordWrap(True)\n                selection.addWidget(self.initialization_label, 1)\n                layout.addLayout(selection)\n            self.frame = rviz.VisualizationFrame()\n            self.frame.setSplashPath('')\n            self.frame.initialize()\n            # RViz retains panel-menu QAction pointers until frame destruction.\n            # Hiding bars preserves those owners and avoids shutdown use-after-free.\n            self.frame.menuBar().hide()\n            self.frame.statusBar().hide()\n            map_row = QtWidgets.QHBoxLayout()\n            map_row.setSpacing(8)\n            self.sensor_panel = QtWidgets.QFrame()\n            self.sensor_panel.setObjectName('sensor_status_panel')\n            self.sensor_panel.setMinimumWidth(245)\n            self.sensor_panel.setMaximumWidth(285)\n            self.sensor_panel.setStyleSheet(\n                'QFrame#sensor_status_panel{background:#20242a;border:1px solid #454b54;'\n                'border-radius:6px;} QLabel{color:#e8eaed;}')\n            sensor_layout = QtWidgets.QVBoxLayout(self.sensor_panel)\n            sensor_title = QtWidgets.QLabel('센서 및 추정 상태')\n            sensor_title.setStyleSheet('font-size:16px;font-weight:bold;padding:8px 5px')\n            sensor_layout.addWidget(sensor_title)\n            self.sensor_labels = {}\n            for key, title in (\n                    ('IMU', 'IMU 센서'), ('IMU_CALIBRATED', 'IMU 보정 출력'),\n                    ('ENCODER', '엔코더'), ('GPS_POSE', 'GPS'),\n                    ('LOCAL_ODOMETRY', 'Local EKF'),\n                    ('GLOBAL_ODOMETRY', 'Global EKF')):\n                label = QtWidgets.QLabel('●  {}\\n    진단 수신 대기'.format(title))\n                label.setObjectName('sensor_status_'+key.lower())\n                label.setWordWrap(True)\n                label.setMinimumHeight(58)\n                label.setStyleSheet(\n                    'color:#9aa0a6;background:#292e35;border-radius:4px;padding:7px;')\n                sensor_layout.addWidget(label)\n                self.sensor_labels[key] = (title, label)\n            sensor_layout.addStretch(1)\n            self.sensor_overall = QtWidgets.QLabel('전체 Localization\\n진단 수신 대기')\n            self.sensor_overall.setWordWrap(True)\n            self.sensor_overall.setStyleSheet(\n                'font-weight:bold;color:#9aa0a6;background:#292e35;'\n                'border-radius:4px;padding:9px;')\n            sensor_layout.addWidget(self.sensor_overall)\n            map_row.addWidget(self.sensor_panel)\n            map_row.addWidget(self.frame, 1)\n            layout.addLayout(map_row, 1)\n            manager = self.frame.getManager()\n            # Startup position goes through the explicit RDDF admission path.\n            # Default RViz pose/goal tools must not publish during bag browsing.\n            tools = manager.getToolManager()\n            for index in reversed(range(tools.numTools())):\n                if tools.getTool(index).getClassId() in ('rviz/SetInitialPose', 'rviz/SetGoal', 'rviz/PublishPoint'):\n                    tools.removeTool(index)\n            manager.setFixedFrame(FRAME)\n            manager.removeAllDisplays()\n            display = manager.createDisplay('rviz/MarkerArray', '기록 시점 장면', True)\n            display.subProp('Marker Topic').setValue(PREFIX+'/scene')\n            grid = manager.createDisplay('rviz/Grid', '5 m 격자', True)\n            grid.subProp('Cell Size').setValue(5.0)\n            grid.subProp('Plane Cell Count').setValue(150)\n            view = manager.getViewManager()\n            view.setCurrentViewControllerType('rviz/TopDownOrtho')\n            self.view = view.getCurrent()\n            self.view.subProp('Angle').setValue(0.0)\n            # RenderPanel is not exported in Noetic's Python SIP bindings. Its\n            # QWidget wrapper still exposes the Qt metaobject and mouse events.\n            panels = [widget for widget in self.frame.centralWidget().findChildren(QtWidgets.QWidget)\n                      if widget.metaObject().className() == 'rviz::RenderPanel']\n            if len(panels) != 1:\n                raise RuntimeError('cannot identify RViz RenderPanel for map coordinates')\n            self.render_panel = panels[0]\n            self.render_panel.setObjectName('initialization_rviz_render_panel')\n            if self.manual_enabled:\n                self.render_panel.setMouseTracking(True)\n                self.render_panel.installEventFilter(self)\n            self.info = QtWidgets.QLabel()\n            self.info.setStyleSheet('font-size:14px;padding:5px')\n            self.info.setWordWrap(True)\n            layout.addWidget(self.info)\n            self.slider = Slider(QtCore.Qt.Horizontal)\n            self.slider.setRange(0, math.ceil(self.duration*10))\n            self.slider.setMinimumHeight(32)\n            layout.addWidget(self.slider)\n            self.slider.sliderPressed.connect(self.drag_start)\n            self.slider.sliderReleased.connect(self.drag_end)\n            self.slider.valueChanged.connect(lambda value: self.seek(value/10) if self.slider.isSliderDown() else None)\n            controls = QtWidgets.QHBoxLayout()\n            layout.addLayout(controls)\n\n            def button(label, callback):\n                widget = QtWidgets.QPushButton(label)\n                widget.setMinimumHeight(37)\n                widget.clicked.connect(callback)\n                controls.addWidget(widget)\n                return widget\n\n            button('처음', lambda: self.seek(0))\n            button('−10초', lambda: self.seek(self.position-10))\n            self.play_button = button('▶ 재생', self.toggle)\n            button('+10초', lambda: self.seek(self.position+10))\n            button('최신 / 끝', self.go_latest)\n            button('전체 경로 맞춤', self.fit_view)\n            speed = QtWidgets.QComboBox()\n            speed.addItems(['0.25×', '0.5×', '1×', '2×', '4×', '8×'])\n            speed.setCurrentIndex(2)\n            speed.currentIndexChanged.connect(lambda index: setattr(self, 'rate', [.25, .5, 1, 2, 4, 8][index]))\n            controls.addWidget(speed)\n            self.jump = QtWidgets.QLineEdit()\n            self.jump.setPlaceholderText('분:초 (예: 08:50)')\n            self.jump.setMaximumWidth(180)\n            self.jump.returnPressed.connect(self.jump_time)\n            controls.addWidget(self.jump)\n            button('이동', self.jump_time)\n            self.clock_label = QtWidgets.QLabel()\n            controls.addWidget(self.clock_label)\n            frame_note = ('RDDF map 좌표 그대로 표시' if model.frame_mode == 'rddf_map'\n                          else 'Local/Global 동일 XY 이동 · yaw 회전 없음')\n            note = QtWidgets.QLabel('Space 재생/정지 · ←/→ 10초 · '+frame_note+\n                                   ' · 시간 탐색은 화면만 이동 · RDDF는 설계 경로')\n            note.setStyleSheet('color:#777;padding:4px')\n            note.setWordWrap(True)\n            layout.addWidget(note)\n            for key, callback in [('Space', self.toggle), ('Left', lambda: self.seek(self.position-10)),\n                                  ('Right', lambda: self.seek(self.position+10))]:\n                QtWidgets.QShortcut(QtGui.QKeySequence(key), self, callback)\n            self.timer = QtCore.QTimer(self)\n            self.timer.timeout.connect(self.tick)\n            self.timer.start(int(config['refresh_ms']))\n            self.subscribers = self.subscribe_live() if live else []\n            if self.manual_enabled:\n                self.subscribers.append(rospy.Subscriber(INITIALIZATION_PREFIX+'/status', String,\n                    lambda message: self.initialization_signal.emit(message.data), queue_size=10))\n            self.resize(1600, 1050)\n            self.fit_view()\n            self.render()\n\n        def initialization_changed(self, payload):\n            try:\n                status = json.loads(payload)\n                if not isinstance(status, dict) or not isinstance(status.get('state'), str):\n                    raise ValueError('initialization status requires state')\n            except (ValueError, TypeError):\n                self.selection_message = '초기화 상태 메시지가 올바르지 않습니다'\n                return\n            self.initialization = status\n            locked = status['state'] in ('READY', 'INITIALIZING', 'FAULT')\n            self.select_button.setEnabled(not locked)\n            self.route_choice.setEnabled(not locked and self.selection_active)\n            if locked and self.selection_active:\n                self.select_button.setChecked(False)\n            self.render()\n\n        def set_selection_active(self, active):\n            if active and self.initialization.get('state') in ('READY', 'INITIALIZING', 'FAULT'):\n                self.select_button.setChecked(False)\n                return\n            self.selection_active = bool(active)\n            self.manual_active.publish(Bool(self.selection_active))\n            self.preview = None\n            self.selection_message = ''\n            self.route_choice.setEnabled(self.selection_active)\n            self.select_button.setText('선택 취소 · GPS 대기' if active else '시작 위치 선택')\n            self.render_panel.setCursor(QtCore.Qt.CrossCursor if active else QtCore.Qt.ArrowCursor)\n            if active:\n                self.go_latest()\n                self.playing = False\n                self.frame.getManager().setFixedFrame(FRAME)\n                self.frame.getManager().getViewManager().setCurrentViewControllerType('rviz/TopDownOrtho')\n                self.view = self.frame.getManager().getViewManager().getCurrent()\n                self.view.subProp('Angle').setValue(0.)\n                self.view.subProp('Target Frame').setValue('\u003cFixed Frame>')\n            self.render()\n\n        def route_changed(self, _index):\n            self.preview = None\n            self.selection_message = ''\n            self.render()\n\n        def update_preview(self, point):\n            route = self.route_choice.currentData() or None\n            try:\n                view = self.frame.getManager().getViewManager().getCurrent()\n                if view.getClassId() != 'rviz/TopDownOrtho':\n                    raise ValueError('시작 위치 선택은 TopDownOrtho 화면에서만 가능합니다')\n                if (self.frame.getManager().getFixedFrame() != FRAME\n                        or str(view.subProp('Target Frame').getValue()) not in ('\u003cFixed Frame>', FRAME)):\n                    raise ValueError('RDDF 기준 프레임이 변경됐습니다. 시작 위치 선택을 다시 켜세요')\n                props = [float(view.subProp(name).getValue()) for name in ('Scale', 'X', 'Y', 'Angle')]\n                x, y = topdown_screen_to_map(point.x(), point.y(), self.render_panel.width(),\n                    self.render_panel.height(), *props, pixel_ratio=self.render_panel.devicePixelRatioF())\n                self.preview = self.route_map.match(x, y, self.manual_snap_distance, route_name=route)\n                if self.preview.get('accepted'):\n                    self.selection_message = ''\n                elif self.preview.get('reason') == 'AMBIGUOUS_ROUTE':\n                    self.selection_message = '서로 다른 진행 방향이 겹칩니다. 진행 경로를 선택하세요'\n                else:\n                    self.selection_message = '선택한 RDDF 선 가까이 마우스를 이동하세요: '+self.preview.get('reason', '')\n            except (ValueError, TypeError, RuntimeError) as error:\n                self.preview = None\n                self.selection_message = str(error)\n\n        def eventFilter(self, watched, event):\n            if watched is getattr(self, 'render_panel', None) and self.selection_active:\n                kind = event.type()\n                if kind == QtCore.QEvent.Leave:\n                    self.preview = None\n                    self.render()\n                elif kind in (QtCore.QEvent.MouseMove, QtCore.QEvent.MouseButtonPress,\n                              QtCore.QEvent.MouseButtonRelease, QtCore.QEvent.MouseButtonDblClick):\n                    self.update_preview(event.pos())\n                    if kind == QtCore.QEvent.MouseButtonPress and event.button() == QtCore.Qt.LeftButton:\n                        self.submit_manual_pose()\n                        self.render()\n                        return True\n                    if event.buttons() & QtCore.Qt.LeftButton or (\n                            kind != QtCore.QEvent.MouseMove and event.button() == QtCore.Qt.LeftButton):\n                        return True\n                    self.render()\n            return super().eventFilter(watched, event)\n\n        def submit_manual_pose(self):\n            if (not self.selection_active or self.initialization.get('state') in\n                    ('READY', 'INITIALIZING', 'FAULT')):\n                return\n            if not self.preview or not self.preview.get('accepted'):\n                self.selection_message = 'RDDF 선 가까이를 클릭하세요. 방향이 겹치면 진행 경로를 먼저 고르세요'\n                return\n            if self.manual_request.get_num_connections() \u003c 1:\n                self.selection_message = '초기화 노드 연결 대기: 아직 시작 위치를 보내지 않았습니다'\n                return\n            try:\n                payload = manual_initialization_request(self.preview, rospy.Time.now().to_sec())\n            except ValueError as error:\n                self.selection_message = str(error)\n                return\n            self.manual_request.publish(String(json.dumps(payload, allow_nan=False)))\n            self.selection_message = '선택 위치 전송 완료 · 정지/IMU 확인 및 초기화 결과 대기'\n\n        def fit_view(self):\n            points = np.vstack(list(self.routes.values()) + [self.model.points(key)[:, :2] for key in ('local', 'global', 'gps')])\n            lower, upper = points.min(axis=0), points.max(axis=0)\n            center, span = (lower+upper)/2, np.maximum(upper-lower, 1)\n            self.view.subProp('X').setValue(float(center[0]))\n            self.view.subProp('Y').setValue(float(center[1]))\n            scale = .8*self.render_panel.devicePixelRatioF()*min(\n                max(600, self.render_panel.width())/span[0], max(500, self.render_panel.height())/span[1])\n            self.view.subProp('Scale').setValue(float(scale))\n\n        def enqueue(self, key, message):\n            try:\n                self.inbox.put_nowait((key,message,rospy.Time.now().to_sec()))\n            except queue.Full:\n                self.input_dropped += 1\n\n        def subscribe_live(self):\n            from nav_msgs.msg import Odometry\n            from sensor_msgs.msg import Imu, NavSatFix, LaserScan\n            from diagnostic_msgs.msg import DiagnosticArray\n            from std_msgs.msg import Bool\n            from erp42_msgs.msg import SerialFeedBack\n            types = dict(local=Odometry, **{'global':Odometry}, gps=NavSatFix, scan=LaserScan,\n                         speed=SerialFeedBack, state=String, valid=Bool, imu_raw=Imu,\n                         imu_normalized=Imu, imu_calibrated=Imu, calibration=DiagnosticArray,\n                         diagnostics=DiagnosticArray)\n            subs = [rospy.Subscriber(topic,types[key],lambda msg,k=key:self.enqueue(k,msg),queue_size=100)\n                    for key,topic in TOPICS.items()]\n            subs.append(rospy.Subscriber('/tf_static',TFMessage,lambda msg:self.enqueue('tf',msg),queue_size=20))\n            return subs\n\n        def go_latest(self):\n            self.seek(self.duration)\n            self.follow_live = live\n\n        def drag_start(self):\n            self.drag_play, self.playing = self.playing, False\n\n        def drag_end(self):\n            self.playing, self.last = self.drag_play, time.monotonic()\n\n        def seek(self, value):\n            if math.isfinite(value):\n                self.follow_live = False\n                self.position = max(0.0, min(self.duration, value))\n                self.last = time.monotonic()\n                self.render()\n\n        def toggle(self):\n            if self.follow_live:\n                self.follow_live = False\n                self.playing = False\n                return\n            if self.position >= self.duration:\n                self.position = 0\n            self.playing = not self.playing\n            self.last = time.monotonic()\n            self.render()\n\n        def jump_time(self):\n            try:\n                value = sum(float(part)*60**index for index, part in enumerate(reversed(self.jump.text().split(':'))))\n                if not math.isfinite(value):\n                    raise ValueError('non-finite time')\n                self.seek(value)\n            except ValueError:\n                self.jump.setText('분:초 형식으로 입력')\n\n        def tick(self):\n            now = time.monotonic()\n            if rospy.is_shutdown():\n                self.close(); return\n            if live:\n                for _ in range(10000):\n                    try: key,message,stamp = self.inbox.get_nowait()\n                    except queue.Empty: break\n                    self.model.ingest(key,message,stamp,live=True)\n                self.duration, self.mount = self.model.duration, self.model.mount\n                self.slider.setMaximum(math.ceil(self.duration*10))\n                if self.follow_live: self.position = self.duration\n                self.render()\n            if self.playing:\n                self.position = min(self.duration, self.position+(now-self.last)*self.rate)\n                if self.position >= self.duration:\n                    self.playing = False\n                self.render()\n            self.last = now\n\n        def latest(self, key, default=None):\n            index = bisect.bisect_right(self.times[key], self.position)-1\n            return self.data[key][index] if index >= 0 else default\n\n        def marker(self, ident, kind, color, points, width=.22):\n            message = Marker()\n            message.header.frame_id, message.ns, message.id = FRAME, 'localization_debug', ident\n            message.type, message.action = kind, Marker.ADD\n            message.pose.orientation.w = 1\n            message.scale.x = message.scale.y = message.scale.z = width\n            message.color.r, message.color.g, message.color.b = color\n            message.color.a = 1\n            message.points = [Point(float(point[0]), float(point[1]), float(point[2]) if len(point)>2 else 0.0) for point in points]\n            return message\n\n        def render_sensor_status(self):\n            index = bisect.bisect_right(self.times['diagnostics'], self.position)-1\n            diagnostics = self.data['diagnostics'][index] if index >= 0 else {}\n            stale = index \u003c 0 or self.position-self.times['diagnostics'][index] > 1.0\n            colors = {0: ('#34a853', '#17351f'), 1: ('#fbbc04', '#3b3215'),\n                      2: ('#ea4335', '#3c1e1d'), 3: ('#9aa0a6', '#292e35')}\n            translations = {\n                'OK': '정상', 'DISABLED': '비활성', 'NOT_RECEIVED': '미수신',\n                'CONNECTED': '연결됨', 'NOT_CONNECTED': '연결 안 됨',\n                'RUNNING': '실행 중', 'NOT_RUNNING': '실행 안 됨',\n            }\n            for key, (title, label) in self.sensor_labels.items():\n                diagnostic_key = 'IMU' if key == 'IMU_CALIBRATED' else key\n                status = diagnostics.get(diagnostic_key)\n                if key == 'IMU':\n                    level, detail = stream_reception_status(\n                        self.times['imu_raw'], self.position, self.imu_raw_stale_sec,\n                        '미수신' if live else '기록 없음')\n                elif stale or status is None:\n                    level, detail = 3, '진단 수신 대기' if index \u003c 0 else '진단 끊김'\n                else:\n                    level = status['level'] if status['level'] in colors else 3\n                    detail = translations.get(status['message'], status['message'])\n                    if key == 'IMU_CALIBRATED' and status['message'] == 'NOT_RECEIVED':\n                        calibration = self.latest('calibration', {})\n                        detail = ('RDDF 위치 선택 대기'\n                                  if calibration.get('reason') == 'WAITING_FOR_RDDF_POSITION'\n                                  else '초기화/보정 대기')\n                    if status['message'] == 'DISABLED':\n                        level = 3\n                foreground, background = colors[level]\n                label.setText('●  {}\\n    {}'.format(title, detail))\n                label.setStyleSheet('color:{};background:{};border-radius:4px;padding:7px;'.
