format(\n                    foreground, background))\n            overall = diagnostics.get('LOCALIZATION')\n            if stale or overall is None:\n                level, detail = 3, '진단 수신 대기' if index \u003c 0 else '진단 끊김'\n            else:\n                level = overall['level'] if overall['level'] in colors else 3\n                detail = translations.get(overall['message'], overall['message'])\n            foreground, background = colors[level]\n            self.sensor_overall.setText('전체 Localization\\n{}'.format(detail))\n            self.sensor_overall.setStyleSheet(\n                'font-weight:bold;color:{};background:{};border-radius:4px;padding:9px;'.format(\n                    foreground, background))\n\n        def render(self):\n            markers, current, last_times, counts = [], {}, {}, {}\n            selected_route = self.route_choice.currentData() if self.manual_enabled and self.selection_active else None\n            if not selected_route and self.selection_active and self.preview and self.preview.get('accepted'):\n                selected_route = self.preview['route']\n            for name, route in self.routes.items():\n                color = (1., .8, .15) if name == selected_route else COLORS['rddf']\n                markers.append(self.marker(len(markers), Marker.LINE_STRIP, color, route, .15))\n            if self.selection_active and self.preview and self.preview.get('accepted'):\n                x, y, yaw = (self.preview[key] for key in ('x', 'y', 'yaw'))\n                c, s = math.cos(yaw), math.sin(yaw)\n                box = np.array([[-.675, -.425], [.675, -.425], [.675, .425], [-.675, .425], [-.675, -.425]])\n                points = box@np.array([[c, s], [-s, c]])+[x, y]\n                markers.append(self.marker(len(markers), Marker.LINE_STRIP, (1., .8, .15), points, .25))\n                markers[-1].ns = 'initialization_preview'\n                markers.append(self.marker(len(markers), Marker.ARROW, (1., .8, .15),\n                    [(x, y, .1), (x+3*c, y+3*s, .1)], .5))\n                markers[-1].ns = 'initialization_preview'\n            for key in ('local', 'global', 'gps'):\n                count = bisect.bisect_right(self.times[key], self.position)\n                counts[key] = count\n                if not count:\n                    continue\n                values, stamps = self.model.points(key,count), np.asarray(self.times[key][:count])\n                if not len(values): continue\n                last_times[key] = float(stamps[-1])\n                boundaries = np.r_[0, np.flatnonzero(np.diff(stamps)>.5)+1, count]\n                lines = []\n                for left, right in zip(boundaries[:-1], boundaries[1:]):\n                    xy = values[left:right, :2]\n                    xy = xy[::max(1, math.ceil(len(xy)/5000))]\n                    if len(xy)>1:\n                        lines.extend(np.stack([xy[:-1], xy[1:]], axis=1).reshape((-1, 2)))\n                markers.append(self.marker(len(markers), Marker.LINE_LIST, COLORS[key], lines, .3))\n                if self.position-stamps[-1]>.5:\n                    continue\n                current[key] = values[-1]\n                if key == 'gps':\n                    markers.append(self.marker(len(markers), Marker.POINTS, COLORS[key], [values[-1]], .9))\n                else:\n                    x, y, yaw = values[-1]\n                    box = np.array([[-.675, -.425], [.675, -.425], [.675, .425], [-.675, .425], [-.675, -.425]])\n                    rotation = np.array([[math.cos(yaw), -math.sin(yaw)], [math.sin(yaw), math.cos(yaw)]])\n                    markers.append(self.marker(len(markers), Marker.LINE_STRIP, COLORS[key], box@rotation.T+[x, y], .18))\n                    markers.append(self.marker(len(markers), Marker.ARROW, COLORS[key], [(x, y), (x+3*math.cos(yaw), y+3*math.sin(yaw))], .4))\n            scan_index = bisect.bisect_right(self.times['scan'], self.position)-1\n            scan_fresh = scan_index >= 0 and self.position-self.times['scan'][scan_index]\u003c.5\n            scan_visible = scan_fresh and 'global' in current and self.mount is not None\n            if scan_visible:\n                scan = self.data['scan'][scan_index]\n                q, tr = self.mount.transform.rotation, self.mount.transform.translation\n                rotation = quaternion_matrix([q.x, q.y, q.z, q.w])[:3, :3]\n                ranges = scan['ranges']\n                angles = scan['angle_min']+np.arange(len(ranges))*scan['angle_increment']\n                valid_ranges = np.isfinite(ranges)&(ranges>=scan['range_min'])&(ranges\u003c=scan['range_max'])\n                xyz = np.column_stack([ranges[valid_ranges]*np.cos(angles[valid_ranges]), ranges[valid_ranges]*np.sin(angles[valid_ranges]), np.zeros(sum(valid_ranges))])@rotation.T\n                xyz += [tr.x, tr.y, tr.z]\n                x, y, yaw = current['global']\n                c, s = math.cos(yaw), math.sin(yaw)\n                xyz[:, :2] = xyz[:, :2]@np.array([[c, s], [-s, c]])+[x, y]\n                markers.append(self.marker(len(markers), Marker.POINTS, (.1, 1, 1), xyz, .10))\n            clear = Marker()\n            clear.action = Marker.DELETEALL\n            self.scene.publish(MarkerArray([clear]+markers))\n            state, valid = self.latest('state', '기록 없음'), self.latest('valid', False)\n            speed = self.latest('speed')\n            speed_text = '기록 없음' if speed is None else '{:.2f} m/s'.format(speed)\n            calibration = self.latest('calibration', {})\n            calib_text = 'CalibratedIMU 진단: 기록 없음'\n            if calibration:\n                calib_text = 'CalibratedIMU {} | correction_count={} | 목표 offset={}° / 적용={}° | {}'.format(\n                    calibration.get('state', '알 수 없음'), calibration.get('correction_count', '?'),\n                    calibration.get('yaw_offset_deg', '?'), calibration.get('applied_yaw_offset_deg', '?'),\n                    calibration.get('diagnostic_message', ''))\n            headings = []\n            for key, label in [('imu_raw', 'Raw'), ('imu_calibrated', 'Calibrated')]:\n                yaw = self.latest(key)\n                if yaw is not None:\n                    headings.append('{} yaw {:.1f}°'.format(label, math.degrees(yaw)))\n            self.info.setText('상태: {}  valid={}  속도 {}  LiDAR: {}\\n{}\\n{}'.format(\n                state + (' | GPS·Local 기준점 대기' if self.model.shift is None else ''), valid, speed_text, '기록 있음' if scan_visible else '이 시점 표시 없음', calib_text, ' | '.join(headings)))\n            self.render_sensor_status()\n            if self.manual_enabled:\n                status = self.initialization\n                state_text = {\n                    'WAITING_FOR_GPS': 'GPS 대기 · GPS가 없으면 시작 위치 선택',\n                    'WAITING_FOR_MANUAL': '지도에서 시작 위치 선택 대기',\n                    'WAITING_FOR_STATIONARY': '차량 정지 확인 대기',\n                    'WAITING_FOR_IMU': 'IMU 입력 대기',\n                    'INITIALIZING': '초기 위치·방향 적용 중',\n                    'READY': '초기 피팅 완료 · 시작 위치 선택 잠금',\n                    'FAULT': '초기화 오류',\n                }.get(status.get('state'), '초기화 노드 상태 대기')\n                text = state_text\n                if status.get('route'):\n                    text += ' | {} / 구간 {}'.format(status['route'], status.get('index', '?'))\n                if status.get('reason'):\n                    text += ' | '+str(status['reason'])\n                if self.selection_active:\n                    text += '\\n차량을 선택 경로 중앙에 진행 방향으로 놓고 클릭 · Esc 선택 취소'\n                    if self.preview and self.preview.get('accepted'):\n                        text += ' | {}: ({:.2f}, {:.2f}) m, yaw {:.2f}°'.format(\n                            self.preview['route'], self.preview['x'], self.preview['y'],\n                            math.degrees(self.preview['yaw']))\n                if self.selection_message:\n                    text += '\\n'+self.selection_message\n                self.initialization_label.setText(text)\n            self.clock_label.setText('{:02d}:{:04.1f} / {:02d}:{:04.1f}'.format(\n                int(self.position)//60, self.position%60, int(self.duration)//60, self.duration%60))\n            self.play_button.setText('⏸ 화면 정지' if self.playing or self.follow_live else '▶ 화면 재생')\n            if not self.slider.isSliderDown():\n                self.slider.blockSignals(True)\n                self.slider.setValue(round(self.position*10))\n                self.slider.blockSignals(False)\n            self.status.publish(String(json.dumps({\n                'mode': 'live' if live else 'recorded', 'following_live': self.follow_live, 'input_dropped': self.input_dropped, 'buffer_dropped': self.summary['buffer_dropped'], 'clock_resets': self.summary['clock_resets'], 'anchor_ready': self.model.shift is not None, 'elapsed': self.position, 'duration': self.duration, 'playing': self.playing,\n                'counts': counts, 'last_sample_times': last_times, 'scan_visible': bool(scan_visible),\n                'state': state, 'valid': bool(valid), 'calibration': calibration,\n                'common_xy_translation_m': self.summary['common_xy_translation_m'],\n                'frame_mode': self.model.frame_mode,\n                'initialization': self.initialization,\n                'manual_selection_active': self.selection_active,\n                'manual_preview': self.preview,\n                'processed_bag': self.summary['processed_bag'],\n            }, allow_nan=False)))\n\n        def closeEvent(self, event):\n            self.timer.stop()\n            self.frame.getManager().stopUpdate()\n            if self.manual_enabled:\n                self.manual_active.publish(Bool(False))\n            rospy.signal_shutdown('current-code viewer closed')\n            event.accept()\n\n        def keyPressEvent(self, event):\n            if event.key() == QtCore.Qt.Key_Escape and self.selection_active:\n                self.select_button.setChecked(False)\n                event.accept()\n                return\n            super().keyPressEvent(event)\n\n    app = QtWidgets.QApplication(sys.argv)\n    window = Viewer()\n    window.showMaximized()\n    QtCore.QTimer.singleShot(500, window.fit_view)\n    window.raise_()\n    window.activateWindow()\n    print('READY unified RViz', 'live' if live else model.summary['processed_bag'], flush=True)\n    result = app.exec_()\n    # RViz panel destruction posts Qt events. Destroy the frame while the Qt\n    # application still exists, including when Python signal cycles retain it.\n    window.deleteLater()\n    app.sendPostedEvents(None, QtCore.QEvent.DeferredDelete)\n    return result\n\n\ndef main():\n    import rospy\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument('--config', type=Path, default=PACKAGE/'config/localization_viewer.yaml')\n    parser.add_argument('--mode', choices=['live','recorded'], default='live')\n    parser.add_argument('--processed-bag', type=Path)\n    parser.add_argument('--source-bag', type=Path)\n    parser.add_argument('--rddf-dir', type=Path)\n    parser.add_argument('--seek', type=float)\n    parser.add_argument('--check-only', action='store_true')\n    args = parser.parse_args(rospy.myargv()[1:])\n    try:\n        config = yaml.safe_load(args.config.read_text())\n        TOPICS.update(config['topics'])\n        COLORS.update({key:tuple(value) for key,value in config['colors'].items()})\n        if args.seek is not None and not math.isfinite(args.seek): raise ValueError('seek must be finite')\n        rddf = args.rddf_dir or Path(config['rddf_directory'])\n        if not rddf.is_absolute(): rddf = PACKAGE/rddf\n        if config['max_samples_per_topic']\u003c2 or config['refresh_ms']\u003c20: raise ValueError('invalid buffer/refresh limits')\n        if args.mode == 'recorded':\n            if not args.processed_bag: raise ValueError('--processed-bag is required; no historical bag is selected automatically')\n            model = load_data(args.processed_bag,args.source_bag,rddf,config['max_samples_per_topic'],\n                              frame_mode=config.get('frame_mode', 'first_gps_translation'))\n        else:\n            if args.processed_bag or args.source_bag: raise ValueError('bag arguments require --mode recorded')\n            default_frame_mode = 'first_gps_translation'\n            if 'frame_mode' not in config:\n                try:\n                    if rospy.get_param('/mando_localization/initialization/enabled', False):\n                        default_frame_mode = 'rddf_map'\n                except (OSError, rospy.ROSException):\n                    if not args.check_only:\n                        raise\n            model = SceneData(rddf,limit=config['max_samples_per_topic'],\n                              frame_mode=config.get('frame_mode', default_frame_mode))\n        if args.check_only:\n            print(json.dumps(model.summary,indent=2,ensure_ascii=False)); return 0\n        return run_gui(model,args.seek,args.mode=='live',config)\n    except (OSError,ValueError,RuntimeError,rosbag.ROSBagException) as error:\n        print('ERROR:',error,file=sys.stderr); return 1\n\n\nif __name__ == '__main__':\n    sys.exit(main())","line_count":996,"redacted_lines":[],"functions":[{"line":42,"label":"def topdown_screen_to_map(x, y, width, height, scale, center_x, center_y,"},{"line":64,"label":"def manual_initialization_request(match, stamp):"},{"line":77,"label":"def stream_reception_status(stamps, position, stale_sec, missing_text='미수신'):"},{"line":93,"label":"def load_rddf(rddf_dir: Path) -> Tuple[Dict[str, np.ndarray], Dict]:"},{"line":126,"label":"def project_wgs84("},{"line":148,"label":"def yaw_of(q):"},{"line":157,"label":"def final_bag(path):"},{"line":164,"label":"def decode_sample(key, message, project):"},{"line":215,"label":"class SceneData:"},{"line":217,"label":"def __init__(self, rddf_dir, source_start=None, duration=0. 장치 경로를 바꿀 수 있습니다:\" \\\n    \"  MANDO_LIDAR_DEVICE, MANDO_IMU_DEVICE, MANDO_GPS_DEVICE,\" \\\n    \"  MANDO_ENCODER_DEVICE, MANDO_RECORD_ROOT, MANDO_LOCALIZATION_WS,\" \\\n    \"  MANDO_RECORD_TOPIC_TIMEOUT_SEC\" \\\n    \"  MANDO_CAPTURE_PORT, MANDO_CAPTURE_NAME (기본 rc_test01), MANDO_CAPTURE_SCRIPT\"\n}\n\nrecord_root=\"${DEFAULT_RECORD_ROOT}\"\nstart_rviz=true\nallow_missing_sensors=false\n\nwhile (($#)); do\n  case \"$1\" in\n    -h|--help)\n      usage\n      exit 0\n      ;;\n    --output-root)\n      (($# >= 2)) || fail \"--output-root 뒤에 저장 경로가 필요합니다.\"\n      record_root=\"$2\"\n      shift 2\n      ;;\n    --output-root=*)\n      record_root=\"${1#--output-root=}\"\n      shift\n      ;;\n    --no-rviz)\n      start_rviz=false\n      shift\n      ;;\n    --allow-missing-sensors)\n      allow_missing_sensors=true\n      shift\n      ;;\n    *)\n      fail \"알 수 없는 인자입니다: $1\"\n      ;;\n  esac\ndone\n\n[[ -n \"${record_root}\" ]] || fail \"저장 경로가 비어 있습니다.\"\n[[ -f \"${CAPTURE_SCRIPT}\" ]] || fail \"CAN capture 스크립트가 없습니다: ${CAPTURE_SCRIPT}\"\n[[ -r \"${CAPTURE_PORT}\" && -w \"${CAPTURE_PORT}\" ]] || fail \"CAN 로거 포트 접근 불가: ${CAPTURE_PORT} (MANDO_CAPTURE_PORT로 지정)\"\nfor sensor_port in \"${GPS_DEVICE}\" \"${ENCODER_DEVICE}\" \"${IMU_DEVICE}\" \"${LIDAR_DEVICE}\"; do\n  if [[ -e \"${sensor_port}\" && \"$(readlink -f -- \"${CAPTURE_PORT}\")\" == \"$(readlink -f -- \"${sensor_port}\")\" ]]; then\n    fail \"CAN 로거 포트 ${CAPTURE_PORT}가 센서 ${sensor_port}와 같습니다. 별도 로거 포트를 MANDO_CAPTURE_PORT로 지정하세요.\"\n  fi\ndone\n\"${CAPTURE_PYTHON}\" -c 'import serial, cantools, ast, pathlib, sys; ast.parse(pathlib.Path(sys.argv[1]).read_text())' \"${CAPTURE_SCRIPT}\" || fail \"CAN 로거 Python에 pyserial이 필요합니다.\"\n\n[[ -f /opt/ros/noetic/setup.bash ]] || fail \"ROS Noetic이 없습니다.\"\n[[ -f \"${WORKSPACE_ROOT}/devel/setup.bash\" ]] || \\\n  fail \"${WORKSPACE_ROOT}가 빌드되지 않았습니다. catkin_make를 먼저 실행하세요.\"\n\nsource /opt/ros/noetic/setup.bash\nsource \"${WORKSPACE_ROOT}/devel/setup.bash\"\n\nfor required_package in mando_localization rosbag rplidar_ros; do\n  rospack find \"${required_package}\" >/dev/null 2>&1 || \\\n    fail \"필수 ROS 패키지가 없습니다: ${required_package}\"\ndone\n\nstart_lidar_driver=true\nstart_imu_driver=true\nstart_gps_driver=true\nstart_encoder_driver=true\nmissing_devices=()\n\ncheck_device() {\n  local label=\"$1\"\n  local path=\"$2\"\n  local flag_name=\"$3\"\n  if [[ -r \"${path}\" && -w \"${path}\" ]]; then\n    printf '[localization-record] %s: %s -> %s\\n' \\\n      \"${label}\" \"${path}\" \"$(readlink -f -- \"${path}\")\"\n    return\n  fi\n\n  printf -v \"${flag_name}\" '%s' false\n  missing_devices+=(\"${label}=${path}\")\n}\n\ncheck_device \"LiDAR\" \"${LIDAR_DEVICE}\" start_lidar_driver\ncheck_device \"IMU\" \"${IMU_DEVICE}\" start_imu_driver\ncheck_device \"GPS\" \"${GPS_DEVICE}\" start_gps_driver\ncheck_device \"Encoder\" \"${ENCODER_DEVICE}\" start_encoder_driver\n\nif ((${#missing_devices[@]})); then\n  if [[ \"${allow_missing_sensors}\" != true ]]; then\n    printf '[localization-record] 연결되지 않은 필수 센서:\\n' >&2\n    printf '  - %s\\n' \"${missing_devices[@]}\" >&2\n    fail \"모든 센서를 연결하거나, 불완전한 시험 기록만 허용할 때 --allow-missing-sensors를 사용하세요.\"\n  fi\n  printf '[localization-record] 경고: 다음 센서를 제외하고 기록합니다:\\n' >&2\n  printf '  - %s\\n' \"${missing_devices[@]}\" >&2\nfi\n\nif [[ \"${start_imu_driver}\" == true ]]; then\n  rospack find xsens_mti_driver >/dev/null 2>&1 || fail \"xsens_mti_driver가 없습니다.\"\nfi\nif [[ \"${start_gps_driver}\" == true ]]; then\n  rospack find ublox_gps >/dev/null 2>&1 || fail \"ublox_gps가 없습니다.\"\nfi\nif [[ \"${start_encoder_driver}\" == true ]]; then\n  rospack find rosserial_python >/dev/null 2>&1 || fail \"rosserial_python이 없습니다.\"\nfi\n\nif running_nodes=\"$(rosnode list 2>/dev/null)\"; then\n  for node_name in \\\n    /mando_rplidar_s2 \\\n    /mando_encoder_serial \\\n    /xsens_mti_node \\\n    /ublox_gps_node \\\n    /mapping_rosbag_recorder \\\n    /localization_interface_adapter \\\n    /imu_encoder_local_ekf \\\n    /odometry_gps_global_ekf \\\n    /mando_localization_rviz; do\n    if grep -Fxq \"${node_name}\" \u003c\u003c\u003c\"${running_nodes}\"; then\n      fail \"이미 실행 중인 노드가 있습니다: ${node_name}\"\n    fi\n  done\nfi\n\nsession_stamp=\"$(date +%Y%m%d_%H%M%S)\"\nsession_dir=\"${record_root%/}/${session_stamp}\"\nif [[ -e \"${session_dir}\" ]]; then\n  session_dir=\"${session_dir}_$$\"\nfi\nmkdir -p -- \"${session_dir}/config_snapshot\"\nsession_dir=\"$(readlink -m -- \"${session_dir}\")\"\nbag_prefix=\"${session_dir}/mapping\"\n\npackage_path=\"$(rospack find mando_localization)\"\ncp -a -- \"${package_path}/config/.\" \"${session_dir}/config_snapshot/\"\ncp -a -- \"${package_path}/launch/map_data_collection.launch\" \"${session_dir}/\"\n\n{\n  printf 'mode=map_data_collection\\n'\n  printf 'started_at=%s\\n' \"$(date --iso-8601=seconds)\"\n  printf 'workspace=%s\\n' \"${WORKSPACE_ROOT}\"\n  printf 'package=%s\\n' \"${package_path}\"\n  printf 'use_sim_time=false\\n'\n  printf 'record_all_topics=true\\n'\n  printf 'bag_exclude_regex=%s\\n' \"${BAG_EXCLUDE_REGEX}\"\n  printf 'bag_compression=lz4\\n'\n  printf 'bag_split_size_mb=2048\\n'\n  printf 'bag_min_space=10G\\n'\n  printf 'lidar_device=%s\\n' \"${LIDAR_DEVICE}\"\n  printf 'imu_device=%s\\n' \"${IMU_DEVICE}\"\n  printf 'gps_device=%s\\n' \"${GPS_DEVICE}\"\n  printf 'encoder_device=%s\\n' \"${ENCODER_DEVICE}\"\n} >\"${session_dir}/session_info.txt\"\n\n# GNSS UTC를 PC 시간에 결합하기 전에 동기화 근거를 세션과 함께 남긴다.\n# 실패 시 CAN/센서 프로세스를 아직 시작하지 않은 상태에서 종료한다.\nif [[ \"${start_gps_driver}\" == true ]]; then\n  rosrun mando_localization check_time_sync.py \\\n    --config \"${package_path}/config/time_sync.yaml\" \\\n    --gps-config \"${package_path}/config/gps_driver.yaml\" \\\n    >\"${session_dir}/time_sync_preflight.json\" || \\\n    fail \"PC 시계 동기화 검사 실패: ${session_dir}/time_sync_preflight.json\"\nfi\n\necho \"[localization-record] 저장 경로: ${session_dir}\"\necho \"[localization-record] 누적 Path·Marker 제외 기록: ON\"\necho \"[localization-record] RViz: Local 초록 / GPS 보정 Global 빨강 / 차량 1.35 x 0.85 m\"\necho \"[localization-record] 필수 토픽을 확인하는 중입니다. 준비 완료 전에는 출발하지 마세요.\"\n\nset +e\n# 별도 세션으로 분리해 터미널 Ctrl+C와 부모의 전달 신호가 중복되지 않게 한다.\n# SIGINT는 stop_launch에서 한 번 전달하고 CSV/진단 저장이 끝날 때까지 기다린다.\n\"${CAPTURE_PYTHON}\" -u -c 'import os, runpy, signal, sys; os.setsid(); signal.signal(signal.SIGINT, signal.default_int_handler); sys.argv=sys.argv[1:]; runpy.run_path(sys.argv[0], run_name=\"__main__\")'   \"${CAPTURE_SCRIPT}\" --port \"${CAPTURE_PORT}\" --name \"${CAPTURE_NAME}\"   --output-root \"${session_dir}/can_capture\" >\"${session_dir}/can_capture.log\" 2>&1 &\ncapture_pid=$!\nprintf 'capture_port=%s\\ncapture_name=%s\\n' \"${CAPTURE_PORT}\" \"${CAPTURE_NAME}\" >>\"${session_dir}/session_info.txt\"\necho \"[localization-record] CAN 기록: ${CAPTURE_PORT}, name=${CAPTURE_NAME}\"\nroslaunch mando_localization map_data_collection.launch \\\n  start_lidar_driver:=\"${start_lidar_driver}\" \\\n  start_imu_driver:=\"${start_imu_driver}\" \\\n  start_gps_driver:=\"${start_gps_driver}\" \\\n  start_encoder_driver:=\"${start_encoder_driver}\" \\\n  start_rviz:=\"${start_rviz}\" \\\n  start_recording:=true \\\n  lidar_serial_port:=\"${LIDAR_DEVICE}\" \\\n  bag_exclude_regex:=\"${BAG_EXCLUDE_REGEX}\" \\\n  bag_prefix:=\"${bag_prefix}\" &\nlaunch_pid=$!\ncapture_stop_requested=false\n\nstop_launch() {\n  if [[ \"${capture_stop_requested}\" == false ]] && kill -0 \"${capture_pid}\" 2>/dev/null; then\n    capture_stop_requested=true\n    kill -INT \"${capture_pid}\" 2>/dev/null || true\n  fi\n  if kill -0 \"${launch_pid}\" 2>/dev/null; then\n    kill -INT \"${launch_pid}\" 2>/dev/null || true\n  fi\n}\ntrap stop_launch INT TERM\n\nmaster_ready=false\nfor _ in $(seq 1 80); do\n  if ! kill -0 \"${launch_pid}\" 2>/dev/null; then\n    break\n  fi\n  if rosnode list >/dev/null 2>&1; then\n    master_ready=true\n    break\n  fi\n  sleep 0.25\ndone\n\nrequired_live_topics=(/tf_static /diagnostics)\nif [[ \"${start_lidar_driver}\" == true ]]; then\n  required_live_topics+=(/molit/sensors/lidar/scan)\nfi\nif [[ \"${start_imu_driver}\" == true ]]; then\n  required_live_topics+=(/molit/sensors/imu/data)\nfi\nif [[ \"${start_gps_driver}\" == true ]]; then\n  required_live_topics+=(/molit/sensors/gps/fix /molit/sensors/gps/navpvt)\nfi\nif [[ \"${start_encoder_driver}\" == true ]]; then\n  required_live_topics+=(/erp42_serial/feedback)\nfi\nif [[ \"${start_imu_driver}\" == true && \"${start_encoder_driver}\" == true ]]; then\n  required_live_topics+=(/tf)\nfi\n\npreflight_missing_topics=()\nif [[ \"${master_ready}\" != true ]]; then\n  preflight_missing_topics+=(ROS_MASTER)\nelse\n  preflight_dir=\"${session_dir}/.preflight\"\n  mkdir -p -- \"${preflight_dir}\"\n  topic_wait_pids=()\n  topic_wait_names=()\n  for topic in \"${required_live_topics[@]}\"; do\n    topic_key=\"${topic#/}\"\n    topic_key=\"${topic_key//\\//_}\"\n    timeout --signal=INT \"${TOPIC_WAIT_TIMEOUT_SEC}\" \\\n      rostopic echo -n 1 \"${topic}\" \\\n      >\"${preflight_dir}/${topic_key}.out\" \\\n      2>\"${preflight_dir}/${topic_key}.err\" &\n    topic_wait_pids+=(\"$!\")\n    topic_wait_names+=(\"${topic}\")\n  done\n\n  for index in \"${!topic_wait_pids[@]}\"; do\n    if ! wait \"${topic_wait_pids[index]}\"; then\n      preflight_missing_topics+=(\"${topic_wait_names[index]}\")\n    fi\n  done\n  find -P \"${preflight_dir}\" -depth -delete\nfi\n\nif ! kill -0 \"${capture_pid}\" 2>/dev/null; then\n  preflight_missing_topics+=(CAN_CAPTURE_PROCESS)\nfi\nif ((${#preflight_missing_topics[@]})); then\n  {\n    printf 'preflight=FAIL\\n'\n    printf 'preflight_missing_topic=%s\\n' \"${preflight_missing_topics[@]}\"\n  } >>\"${session_dir}/session_info.txt\"\n  printf '[localization-record] 오류: 데이터가 들어오지 않는 필수 토픽:\\n' >&2\n  printf '  - %s\\n' \"${preflight_missing_topics[@]}\" >&2\n  echo \"[localization-record] 출발 전 검사 실패로 기록을 종료합니다.\" >&2\n  stop_launch\n  wait \"${launch_pid}\" 2>/dev/null\n  launch_status=1\nelse\n  printf 'preflight=PASS\\n' >>\"${session_dir}/session_info.txt\"\n  echo \"[localization-record] 수집 준비 완료: 이제 주행을 시작하세요.\"\n  echo \"[localization-record] 정상 종료: Ctrl+C 한 번\"\n  wait -n \"${launch_pid}\" \"${capture_pid}\"\n  launch_status=$?\n  stop_launch\n  if kill -0 \"${launch_pid}\" 2>/dev/null; then\n    wait \"${launch_pid}\"\n    launch_status=$?\n  fi\nfi\nstop_launch\nwait \"${capture_pid}\"\ncapture_status=$?\nprintf 'capture_exit_code=%s\\n' \"${capture_status}\" >>\"${session_dir}/session_info.txt\"\nif [[ \"${capture_status}\" != 0 ]]; then\n  echo \"[localization-record] CAN 기록/진단 실패: ${session_dir}/can_capture.log\" >&2\n  launch_status=1\nfi\ntrap - INT TERM\nset -e\n\nshopt -s nullglob\nbag_files=(\"${session_dir}\"/*.bag)\nactive_files=(\"${session_dir}\"/*.active)\nshopt -u nullglob\n\nif ((${#bag_files[@]})); then\n  : >\"${session_dir}/bag_info.txt\"\n  for bag_file in \"${bag_files[@]}\"; do\n    rosbag info \"${bag_file}\" >>\"${session_dir}/bag_info.txt\" 2>&1 || true\n  done\n\n  expected_topics=(\n    /molit/sensors/lidar/scan\n    /molit/sensors/imu/data\n    /molit/sensors/gps/fix\n    /molit/sensors/gps/navpvt\n    /erp42_serial/feedback\n    /tf\n    /tf_static\n  )\n  missing_topics=()\n  for topic in \"${expected_topics[@]}\"; do\n    if ! grep -Fq -- \"${topic}\" \"${session_dir}/bag_info.txt\"; then\n      missing_topics+=(\"${topic}\")\n    fi\n  done\n\n  if ((${#missing_topics[@]})); then\n    {\n      printf 'result=INCOMPLETE\\n'\n      printf 'missing_topic=%s\\n' \"${missing_topics[@]}\"\n    } >\"${session_dir}/record_validation.txt\"\n    printf '[localization-record] 경고: bag에 없는 필수 토픽:\\n' >&2\n    printf '  - %s\\n' \"${missing_topics[@]}\" >&2\n  else\n    printf 'result=PASS\\n' >\"${session_dir}/record_validation.txt\"\n    echo \"[localization-record] 필수 지도 수집 토픽: 모두 기록됨\"\n  fi\n  echo \"[localization-record] 저장 완료: ${#bag_files[@]}개 bag\"\n  echo \"[localization-record] 요약: ${session_dir}/bag_info.txt\"\nelse\n  echo \"[localization-record] 경고: 완성된 .bag 파일이 없습니다.\" >&2\nfi\n\nif ((${#active_files[@]})); then\n  printf '[localization-record] 경고: 비정상 종료된 .active 파일이 남았습니다:\\n' >&2\n  printf '  - %s\\n' \"${active_files[@]}\" >&2\nfi\n\n{\n  printf 'finished_at=%s\\n' \"$(date --iso-8601=seconds)\"\n  printf 'roslaunch_exit_status=%s\\n' \"${launch_status}\"\n} >>\"${session_dir}/session_info.txt\"\n\nexit \"${launch_status}\"","line_count":382,"redacted_lines":[],"functions":[],"params":[]},"src/localization/src/status_manager/localization_status_manager.cpp":{"path":"src/localization/src/status_manager/localization_status_manager.cpp","sha256":"03d164584af0211eef6aababe392ab02248c034c60ab374600c1f3e6be701b00","text":"#include \"localization_status_manager.hpp\"\n\n#include \u003cros/master.h>\n#include \u003cunistd.h>\n\n#include \u003calgorithm>\n#include \u003ccmath>\n#include \u003csstream>\n#include \u003cstdexcept>\n#include \u003cutility>\n\nnamespace mando_localization {\nnamespace {\n\ntemplate \u003ctypename T>\nT requireParameter(const ros::NodeHandle& node, const std::string& name) {\n  T value;\n  if (!node.getParam(name, value)) {\n    throw std::runtime_error(\"필수 파라미터가 없습니다: \" + node.resolveName(name));\n  }\n  return value;\n}\n\nbool finiteQuaternion(const geometry_msgs::Quaternion& quaternion) {\n  const double norm_squared = quaternion.x * quaternion.x + quaternion.y * quaternion.y +\n                              quaternion.z * quaternion.z + quaternion.w * quaternion.w;\n  return std::isfinite(norm_squared) && norm_squared > 1.0e-12;\n}\n\ndiagnostic_msgs::KeyValue keyValue(const std::string& key, const std::string& value) {\n  diagnostic_msgs::KeyValue result;\n  result.key = key;\n  result.value = value;\n  return result;\n}\n\nstd::string booleanText(const bool value) { return value ? \"true\" : \"false\"; }\n\n}  // namespace\n\nLocalizationStatusManager::LocalizationStatusManager(ros::NodeHandle nh,\n                                                     ros::NodeHandle private_nh)\n    : nh_(std::move(nh)),\n      private_nh_(std::move(private_nh)),\n      evaluator_([&]() {\n        StatePolicy policy;\n        policy.startup_grace_sec =\n            requireParameter\u003cdouble>(private_nh_, \"startup_grace_sec\");\n        policy.dead_reckoning_max_sec =\n            requireParameter\u003cdouble>(private_nh_, \"dead_reckoning/max_duration_sec\");\n        policy.dead_reckoning_max_distance_m =\n            requireParameter\u003cdouble>(private_nh_, \"dead_reckoning/max_distance_m\");\n        return policy;\n      }()) {\n  const std::string imu_topic =\n      requireParameter\u003cstd::string>(private_nh_, \"topics/imu_calibrated\");\n  const std::string encoder_topic =\n      requireParameter\u003cstd::string>(private_nh_, \"topics/encoder_state\");\n  const std::string twist_topic =\n      requireParameter\u003cstd::string>(private_nh_, \"topics/encoder_twist\");\n  const std::string local_odometry_topic =\n      requireParameter\u003cstd::string>(private_nh_, \"topics/local_odometry\");\n  const std::string gps_pose_topic =\n      requireParameter\u003cstd::string>(private_nh_, \"topics/gps_map_pose\");\n  const std::string global_odometry_topic =\n      requireParameter\u003cstd::string>(private_nh_, \"topics/global_odometry\");\n  const std::string gps_relocalizing_topic =\n      requireParameter\u003cstd::string>(private_nh_, \"topics/gps_relocalizing\");\n  const std::string diagnostics_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"internal_topics/evaluated_status\");\n  const std::string state_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"internal_topics/evaluated_state\");\n  const std::string valid_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"internal_topics/evaluated_valid\");\n\n  enable_gps_ = requireParameter\u003cbool>(private_nh_, \"absolute_sources/gps_enabled\");\n  imu_timeout_sec_ = requireParameter\u003cdouble>(private_nh_, \"sources/imu/timeout_sec\");\n  imu_max_future_sec_ =\n      requireParameter\u003cdouble>(private_nh_, \"sources/imu/max_future_stamp_sec\");\n  encoder_timeout_sec_ =\n      requireParameter\u003cdouble>(private_nh_, \"sources/encoder/timeout_sec\");\n  encoder_max_future_sec_ = requireParameter\u003cdouble>(\n      private_nh_, \"sources/encoder/max_future_stamp_sec\");\n  local_odometry_timeout_sec_ =\n      requireParameter\u003cdouble>(private_nh_, \"sources/local_odometry/timeout_sec\");\n  local_odometry_max_future_sec_ = requireParameter\u003cdouble>(\n      private_nh_, \"sources/local_odometry/max_future_stamp_sec\");\n  gps_timeout_sec_ = requireParameter\u003cdouble>(private_nh_, \"sources/gps/timeout_sec\");\n  gps_max_future_sec_ =\n      requireParameter\u003cdouble>(private_nh_, \"sources/gps/max_future_stamp_sec\");\n  global_odometry_timeout_sec_ =\n      requireParameter\u003cdouble>(private_nh_, \"sources/global_odometry/timeout_sec\");\n  global_odometry_max_future_sec_ = requireParameter\u003cdouble>(\n      private_nh_, \"sources/global_odometry/max_future_stamp_sec\");\n  status_publish_rate_hz_ = requireParameter\u003cdouble>(private_nh_, \"manager_rate_hz\");\n  max_position_variance_m2_ =\n      requireParameter\u003cdouble>(private_nh_, \"quality/max_position_variance_m2\");\n  max_global_consistency_distance_m_ = requireParameter\u003cdouble>(\n      private_nh_, \"absolute_sources/max_global_consistency_distance_m\");\n  const std::string dead_reckoning_limit_policy = requireParameter\u003cstd::string>(\n      private_nh_, \"dead_reckoning/limit_policy\");\n  map_frame_ = requireParameter\u003cstd::string>(private_nh_, \"frames/map\");\n  odom_frame_ = requireParameter\u003cstd::string>(private_nh_, \"frames/odom\");\n  base_frame_ = requireParameter\u003cstd::string>(private_nh_, \"frames/base_link\");\n  imu_device_path_ = requireParameter\u003cstd::string>(private_nh_, \"devices/imu\");\n  gps_device_path_ = requireParameter\u003cstd::string>(private_nh_, \"devices/gps\");\n  imu_driver_node_ = requireParameter\u003cstd::string>(private_nh_, \"nodes/imu_driver\");\n  gps_driver_node_ = requireParameter\u003cstd::string>(private_nh_, \"nodes/gps_driver\");\n  private_nh_.param(\"initialization/required\", initialization_required_, false);\n  private_nh_.param(\"initialization/ready_timeout_sec\",\n                    initialization_ready_timeout_sec_, 0.5);\n  private_nh_.param(\"initialization/max_pose_age_sec\",\n                    initialization_pose_max_age_sec_, 1.0);\n\n  const std::vector\u003cdouble> positive_values = {\n      imu_timeout_sec_, encoder_timeout_sec_, local_odometry_timeout_sec_,\n      gps_timeout_sec_, global_odometry_timeout_sec_,\n      status_publish_rate_hz_, max_position_variance_m2_,\n      max_global_consistency_distance_m_,\n      initialization_ready_timeout_sec_, initialization_pose_max_age_sec_};\n  const std::vector\u003cdouble> nonnegative_values = {\n      imu_max_future_sec_, encoder_max_future_sec_,\n      local_odometry_max_future_sec_, gps_max_future_sec_,\n      global_odometry_max_future_sec_};\n  if (map_frame_.empty() || odom_frame_.empty() || base_frame_.empty() ||\n      std::any_of(positive_values.begin(), positive_values.end(),\n                  [](double value) { return !std::isfinite(value) || value \u003c= 0.0; }) ||\n      std::any_of(nonnegative_values.begin(), nonnegative_values.end(),\n                  [](double value) { return !std::isfinite(value) || value \u003c 0.0; }) ||\n      dead_reckoning_limit_policy != \"first_exceeded\") {\n    throw std::runtime_error(\"상태 관리자 frame 또는 양수 파라미터가 유효하지 않습니다.\");\n  }\n\n  imu_subscriber_ = nh_.subscribe(imu_topic, 50, &LocalizationStatusManager::imuCallback, this);\n  encoder_subscriber_ =\n      nh_.subscribe(encoder_topic, 50, &LocalizationStatusManager::encoderCallback, this);\n  twist_subscriber_ =\n      nh_.subscribe(twist_topic, 50, &LocalizationStatusManager::twistCallback, this);\n  local_odometry_subscriber_ = nh_.subscribe(\n      local_odometry_topic, 50, &LocalizationStatusManager::localOdometryCallback, this);\n  if (enable_gps_) {\n    gps_pose_subscriber_ = nh_.subscribe(gps_pose_topic, 10,\n                                        &LocalizationStatusManager::gpsPoseCallback, this);\n  }\n  global_odometry_subscriber_ = nh_.subscribe(\n      global_odometry_topic, 50, &LocalizationStatusManager::globalOdometryCallback, this);\n  gps_relocalizing_subscriber_ = nh_.subscribe(\n      gps_relocalizing_topic, 10,\n      &LocalizationStatusManager::gpsRelocalizingCallback, this);\n  if (initialization_required_) {\n    initialization_ready_subscriber_ = nh_.subscribe(\n        \"/mando_localization/internal/initialization/ready\", 10,\n        &LocalizationStatusManager::initializationReadyCallback, this);\n    initialization_pose_subscriber_ = nh_.subscribe(\n        \"/mando_localization/internal/initialization/committed_pose\", 10,\n        &LocalizationStatusManager::initializationPoseCallback, this);\n  }\n\n  diagnostics_publisher_ = nh_.advertise\u003cdiagnostic_msgs::DiagnosticArray>(diagnostics_topic, 10);\n  state_publisher_ = nh_.advertise\u003cstd_msgs::String>(state_topic, 1, true);\n  valid_publisher_ = nh_.advertise\u003cstd_msgs::Bool>(valid_topic, 1, true);\n  timer_ = nh_.createTimer(ros::Duration(1.0 / status_publish_rate_hz_),\n                           &LocalizationStatusManager::timerCallback, this);\n  start_time_ = ros::Time::now();\n\n  ROS_INFO_STREAM(\"LocalizationStatusManager 설정: GPS=\" \u003c\u003c booleanText(enable_gps_)\n                  \u003c\u003c \", DR=\" \u003c\u003c evaluator_.policy().dead_reckoning_max_sec \u003c\u003c \" s/\"\n                  \u003c\u003c evaluator_.policy().dead_reckoning_max_distance_m \u003c\u003c \" m\");\n}\n\nvoid LocalizationStatusManager::imuCallback(const sensor_msgs::ImuConstPtr& message) {\n  imu_status_.seen = true;\n  imu_status_.receipt_time = ros::Time::now();\n  imu_status_.stamp = message->header.stamp;\n  imu_status_.frame_id = message->header.frame_id;\n  const bool finite_angular = std::isfinite(message->angular_velocity.x) &&\n                              std::isfinite(message->angular_velocity.y) &&\n                              std::isfinite(message->angular_velocity.z);\n  imu_status_.payload_valid = !message->header.stamp.isZero() &&\n                              !message->header.frame_id.empty() && finite_angular &&\n                              finiteQuaternion(message->orientation);\n  imu_status_.reason = imu_status_.payload_valid ? \"ok\" : \"invalid_stamp_frame_or_value\";\n}\n\nvoid LocalizationStatusManager::encoderCallback(\n    const erp42_msgs::SerialFeedBackConstPtr& message) {\n  const ros::Time receipt_time = ros::Time::now();\n  const bool alive_advanced = !have_encoder_alive_counter_ ||\n                              message->alive != encoder_alive_counter_;\n  encoder_status_.seen = true;\n  encoder_status_.receipt_time = receipt_time;\n  // SerialFeedBack has no Header. Receipt time and base_link are the explicit\n  // host-side contract used for freshness diagnostics.\n  encoder_status_.stamp = receipt_time;\n  encoder_status_.frame_id = base_frame_;\n  encoder_status_.payload_valid = alive_advanced &&\n                                  std::isfinite(message->speed) &&\n                                  std::isfinite(message->steer);\n  if (std::isfinite(message->steer) && message->steer >= 0.0 &&\n      message->steer \u003c= 65535.0) {\n    steering_adc_ = static_cast\u003cuint16_t>(std::lround(message->steer));\n  }\n  encoder_delta_100ms_ = message->encoder;\n  brake_ = message->brake != 0;\n  encoder_alive_counter_ = message->alive;\n  have_encoder_alive_counter_ = true;\n  encoder_status_.reason = encoder_status_.payload_valid\n                               ? \"ok\"\n                               : \"alive_counter_stalled_or_invalid_value\";\n}\n\nvoid LocalizationStatusManager::twistCallback(\n    const geometry_msgs::TwistWithCovarianceStampedConstPtr& message) {\n  twist_status_.seen = true;\n  twist_status_.receipt_time = ros::Time::now();\n  twist_status_.stamp = message->header.stamp;\n  twist_status_.frame_id = message->header.frame_id;\n  bool finite_covariance = true;\n  for (const double value : message->twist.covariance) {\n    finite_covariance = finite_covariance && std::isfinite(value);\n  }\n  twist_status_.payload_valid = !message->header.stamp.isZero() &&\n                                message->header.frame_id == base_frame_ &&\n                                std::isfinite(message->twist.twist.linear.x) &&\n                                finite_covariance;\n  twist_status_.reason = twist_status_.payload_valid ? \"ok\" : \"invalid_twist\";\n}\n\nvoid LocalizationStatusManager::localOdometryCallback(\n    const nav_msgs::OdometryConstPtr& message) {\n  local_odometry_status_.seen = true;\n  local_odometry_status_.receipt_time = ros::Time::now();\n  local_odometry_status_.stamp = message->header.stamp;\n  local_odometry_status_.frame_id = message->header.frame_id;\n  local_odometry_status_.payload_valid =\n      !message->header.stamp.isZero() && message->header.frame_id == odom_frame_ &&\n      message->child_frame_id == base_frame_ && validatePose(message->pose.pose) &&\n      validatePoseCovariance(message->pose.covariance, false);\n  local_odometry_status_.reason =\n      local_odometry_status_.payload_valid ? \"ok\" : \"invalid_local_odometry\";\n}\n\nvoid LocalizationStatusManager::gpsPoseCallback(\n    const geometry_msgs::PoseWithCovarianceStampedConstPtr& message) {\n  gps_status_.seen = true;\n  gps_status_.receipt_time = ros::Time::now();\n  gps_status_.stamp = message->header.stamp;\n  gps_status_.frame_id = message->header.frame_id;\n  gps_status_.payload_valid = !message->header.stamp.isZero() &&\n                              message->header.frame_id == map_frame_ &&\n                              validatePose(message->pose.pose) &&\n                              validatePoseCovariance(message->pose.covariance);\n  gps_status_.reason = gps_status_.payload_valid ? \"ok\" : \"invalid_map_pose\";\n  gps_position_ = message->pose.pose.position;\n  if (isFresh(gps_status_, gps_timeout_sec_, gps_max_future_sec_,\n              gps_status_.receipt_time) &&\n      (!initialization_required_ ||\n       (initializationReady(gps_status_.receipt_time) && initialization_anchor_applied_))) {\n    markAbsoluteMeasurement(gps_status_.receipt_time);\n  }\n}\n\nvoid LocalizationStatusManager::globalOdometryCallback(const nav_msgs::OdometryConstPtr& message) {\n  global_odometry_status_.seen = true;\n  global_odometry_status_.receipt_time = ros::Time::now();\n  global_odometry_status_.stamp = message->header.stamp;\n  global_odometry_status_.frame_id = message->header.frame_id;\n  global_odometry_status_.payload_valid =\n      !message->header.stamp.isZero() && message->header.frame_id == map_frame_ &&\n      message->child_frame_id == base_frame_ && validatePose(message->pose.pose) &&\n      validatePoseCovariance(message->pose.covariance);\n  global_odometry_status_.reason =\n      global_odometry_status_.payload_valid ? \"ok\" : \"invalid_global_odometry\";\n  global_position_ = message->pose.pose.position;\n\n  if (!global_odometry_status_.payload_valid) {\n    return;\n  }\n  const geometry_msgs::Point& current = message->pose.pose.position;\n  if (dead_reckoning_active_ && have_previous_global_position_) {\n    const double dx = current.x - previous_global_position_.x;\n    const double dy = current.y - previous_global_position_.y;\n    const double increment = std::hypot(dx, dy);\n    if (std::isfinite(increment)) {\n      dead_reckoning_distance_m_ += increment;\n    }\n  }\n  previous_global_position_ = current;\n  have_previous_global_position_ = true;\n}\n\nvoid LocalizationStatusManager::gpsRelocalizingCallback(\n    const std_msgs::BoolConstPtr& message) {\n  gps_relocalizing_ = message->data;\n}\n\nbool LocalizationStatusManager::initializationReady(const ros::Time& now) const {\n  if (!initialization_required_) return true;\n  if (!initialization_ready_ || initialization_ready_receipt_time_.isZero() ||\n      initialization_ready_wall_time_.isZero()) return false;\n  const double age = (now - initialization_ready_receipt_time_).toSec();\n  const double wall_age = (ros::WallTime::now() - initialization_ready_wall_time_).toSec();\n  return age >= 0.0 && age \u003c= initialization_ready_timeout_sec_ &&\n         wall_age >= 0.0 && wall_age \u003c= initialization_ready_timeout_sec_;\n}\n\nvoid LocalizationStatusManager::clearInitializationAnchor() {\n  initialization_pose_status_ = StreamStatus();\n  initialization_pose_wall_time_ = ros::WallTime();\n  initialization_anchor_applied_ = false;\n  anchor_seen_ = false;\n  last_absolute_time_ = ros::Time();\n  dead_reckoning_active_ = false;\n  dead_reckoning_distance_m_ = 0.0;\n  have_previous_global_position_ = false;\n  gps_status_ = StreamStatus();\n}\n\nvoid LocalizationStatusManager::applyInitializationAnchor(const ros::Time& now) {\n  if (!initialization_required_ || initialization_anchor_applied_ ||\n      !initializationReady(now) ||\n      !isFresh(initialization_pose_status_, initialization_pose_max_age_sec_,\n               global_odometry_max_future_sec_, now) ||\n      initialization_pose_wall_time_.isZero()) return;\n  const double wall_age = (ros::WallTime::now() - initialization_pose_wall_time_).toSec();\n  if (wall_age \u003c 0.0 || wall_age > initialization_pose_max_age_sec_) return;\n  // A committed operator/RDDF pose is a one-time anchor, never a healthy GPS\n  // stream. Heartbeats and repeated latched messages must not extend the DR budget.\n  markAbsoluteMeasurement(initialization_pose_status_.stamp);\n  initialization_anchor_applied_ = true;\n}\n\nvoid LocalizationStatusManager::initializationReadyCallback(\n    const std_msgs::BoolConstPtr& message) {\n  const ros::Time now = ros::Time::now();\n  if (!message->data && (initialization_ready_ || initialization_anchor_applied_)) {\n    clearInitializationAnchor();\n  }\n  initialization_ready_ = message->data;\n  initialization_ready_receipt_time_ = now;\n  initialization_ready_wall_time_ = ros::WallTime::now();\n  applyInitializationAnchor(now);\n}\n\nvoid LocalizationStatusManager::initializationPoseCallback(\n    const geometry_msgs::PoseWithCovarianceStampedConstPtr& message) {\n  if (initialization_anchor_applied_) return;\n  const ros::Time now = ros::Time::now();\n  initialization_pose_status_.seen = true;\n  initialization_pose_status_.receipt_time = now;\n  initialization_pose_status_.stamp = message->header.stamp;\n  initialization_pose_status_.frame_id = message->header.frame_id;\n  initialization_pose_wall_time_ = ros::WallTime::now();\n  const auto& orientation = message->pose.pose.orientation;\n  const double norm_squared = orientation.x * orientation.x + orientation.y * orientation.y +\n                              orientation.z * orientation.z + orientation.w * orientation.w;\n  bool covariance_valid = validatePoseCovariance(message->pose.covariance);\n  for (std::size_t index = 0; index \u003c 6; ++index) {\n    covariance_valid = covariance_valid && message->pose.covariance[index * 7] >= 0.0;\n  }\n  initialization_pose_status_.payload_valid =\n      !message->header.stamp.isZero() && message->header.frame_id == map_frame_ &&\n      validatePose(message->pose.pose) && std::abs(norm_squared - 1.0) \u003c= 0.002 &&\n      covariance_valid;\n  initialization_pose_status_.reason = initialization_pose_status_.payload_valid\n      ? \"committed_rddf_pose\" : \"invalid_committed_rddf_pose\";\n  applyInitializationAnchor(now);\n}\n\nvoid LocalizationStatusManager::timerCallback(const ros::TimerEvent&) {\n  const ros::Time now = ros::Time::now();\n  applyInitializationAnchor(now);\n  const bool startup_ready = initializationReady(now) &&\n      (!initialization_required_ || initialization_anchor_applied_);\n  const bool imu_healthy =\n      isFresh(imu_status_, imu_timeout_sec_, imu_max_future_sec_, now);\n  const bool encoder_healthy = isFresh(\n      encoder_status_, encoder_timeout_sec_, encoder_max_future_sec_, now);\n  const bool twist_healthy = isFresh(\n      twist_status_, encoder_timeout_sec_, encoder_max_future_sec_, now);\n  const bool local_odometry_healthy =\n      isFresh(local_odometry_status_, local_odometry_timeout_sec_,\n              local_odometry_max_future_sec_, now);\n  const bool global_healthy = isFresh(\n      global_odometry_status_, global_odometry_timeout_sec_,\n      global_odometry_max_future_sec_, now);\n  const bool gps_healthy = enable_gps_ &&\n      isFresh(gps_status_, gps_timeout_sec_, gps_max_future_sec_, now);\n\n  const bool gps_unconfirmed = gps_healthy && global_healthy &&\n      std::hypot(gps_position_.x - global_position_.x,\n                 gps_position_.y - global_position_.y) >\n          max_global_consistency_distance_m_;\n\n  const std::size_t enabled_count = static_cast\u003cstd::size_t>(enable_gps_);\n  const std::size_t healthy_count = static_cast\u003cstd::size_t>(gps_healthy);\n  dead_reckoning_active_ = anchor_seen_ && healthy_count == 0U;\n  if (!dead_reckoning_active_) {\n    dead_reckoning_distance_m_ = 0.0;\n  }\n\n  StateInput input;\n  input.uptime_sec = std::max(0.0, (now - start_time_).toSec());\n  input.local_motion_healthy = imu_healthy && encoder_healthy && twist_healthy &&\n                               local_odometry_healthy;\n  input.global_output_healthy = global_healthy;\n  input.relocalizing = (enable_gps_ && gps_relocalizing_) || gps_unconfirmed;\n  input.anchor_seen = anchor_seen_;\n  input.absolute_enabled_count = enabled_count;\n  input.absolute_healthy_count = healthy_count;\n  input.seconds_since_absolute =\n      anchor_seen_ ? std::max(0.0, (now - last_absolute_time_).toSec()) : 0.0;\n  input.dead_reckoning_distance_m = dead_reckoning_distance_m_;\n  const StateDecision decision = startup_ready ? evaluator_.evaluate(input)\n      : StateDecision{LocalizationState::INITIALIZING, false,\n                      \"waiting_for_rddf_initialization\"};\n\n  std_msgs::String state_message;\n  state_message.data = LocalizationStateEvaluator::toString(decision.state);\n  state_publisher_.publish(state_message);\n  std_msgs::Bool valid_message;\n  valid_message.data = decision.valid;\n  valid_publisher_.publish(valid_message);\n\n  diagnostic_msgs::DiagnosticArray diagnostics;\n  diagnostics.header.stamp = now;\n  diagnostics.status.push_back(\n      makeStreamDiagnostic(\"IMU\", imu_status_, imu_timeout_sec_,\n                           imu_max_future_sec_, now, true));\n  diagnostic_msgs::DiagnosticStatus encoder_diagnostic =\n      makeStreamDiagnostic(\"ENCODER\", encoder_status_, encoder_timeout_sec_,\n                           encoder_max_future_sec_, now, true);\n  encoder_diagnostic.values.push_back(\n      keyValue(\"steering_adc\", std::to_string(steering_adc_)));\n  encoder_diagnostic.values.push_back(\n      keyValue(\"encoder_delta_100ms\", std::to_string(encoder_delta_100ms_)));\n  encoder_diagnostic.values.push_back(keyValue(\"brake\", booleanText(brake_)));\n  diagnostics.status.push_back(encoder_diagnostic);\n  diagnostics.status.push_back(\n      makeStreamDiagnostic(\"ENCODER_TWIST\", twist_status_, encoder_timeout_sec_,\n                           encoder_max_future_sec_, now, true));\n  diagnostics.status.push_back(makeStreamDiagnostic(\n      \"LOCAL_ODOMETRY\", local_odometry_status_, local_odometry_timeout_sec_,\n      local_odometry_max_future_sec_, now, true));\n  diagnostics.status.push_back(\n      makeStreamDiagnostic(\"GPS_POSE\", gps_status_, gps_timeout_sec_,\n                           gps_max_future_sec_, now, enable_gps_));\n  diagnostics.status.push_back(makeStreamDiagnostic(\n      \"GLOBAL_ODOMETRY\", global_odometry_status_, global_odometry_timeout_sec_,\n      global_odometry_max_future_sec_, now, true));\n  if (initialization_required_) {\n    diagnostic_msgs::DiagnosticStatus startup;\n    startup.name = \"RDDF_INITIALIZATION\";\n    startup.hardware_id = \"mando_localization\";\n    startup.level = startup_ready ? diagnostic_msgs::DiagnosticStatus::OK\n                                  : diagnostic_msgs::DiagnosticStatus::WARN;\n    startup.message = startup_ready ? \"COMMITTED\" : \"WAITING_FOR_INITIALIZATION\";\n    startup.values.push_back(keyValue(\"ready_fresh\", booleanText(initializationReady(now))));\n    startup.values.push_back(keyValue(\"anchor_applied\", booleanText(initialization_anchor_applied_)));\n    startup.values.push_back(keyValue(\"pose_reason\", initialization_pose_status_.reason));\n    startup.values.push_back(keyValue(\"anchor_kind\", \"one_time_rddf_pose_not_gps\"));\n    diagnostics.status.push_back(startup);\n  }\n\n  diagnostics.status.push_back(\n      makeDeviceDiagnostic(\"IMU_DEVICE\", imu_device_path_, true));\n  diagnostics.status.push_back(\n      makeDeviceDiagnostic(\"GPS_DEVICE\", gps_device_path_, enable_gps_));\n  std::vector\u003cstd::string> running_nodes;\n  ros::master::getNodes(running_nodes);\n  diagnostics.status.push_back(\n      makeDriverDiagnostic(\"IMU_DRIVER\", imu_driver_node_, true, running_nodes));\n  diagnostics.status.push_back(\n      makeDriverDiagnostic(\"GPS_DRIVER\", gps_driver_node_, enable_gps_, running_nodes));\n\n  diagnostic_msgs::DiagnosticStatus overall;\n  overall.name = \"LOCALIZATION\";\n  overall.hardware_id = \"mando_localization\";\n  overall.level = decision.valid ? diagnostic_msgs::DiagnosticStatus::OK\n                                 : diagnostic_msgs::DiagnosticStatus::ERROR;\n  if (decision.state == LocalizationState::DEGRADED ||\n      decision.state == LocalizationState::DEAD_RECKONING) {\n    overall.level = diagnostic_msgs::DiagnosticStatus::WARN;\n  }\n  overall.message = state_message.data + \":\" + decision.reason;\n  overall.values.push_back(keyValue(\"valid\", booleanText(decision.valid)));\n  overall.values.push_back(keyValue(\"reason\", decision.reason));\n  overall.values.push_back(\n      keyValue(\"dead_reckoning_sec\", std::to_string(input.seconds_since_absolute)));\n  overall.values.push_back(\n      keyValue(\"dead_reckoning_distance_m\", std::to_string(dead_reckoning_distance_m_)));\n  overall.values.push_back(keyValue(\"gps_healthy\", booleanText(gps_healthy)));\n  overall.values.push_back(\n      keyValue(\"gps_correction_confirmed\", booleanText(!gps_unconfirmed)));\n  diagnostics.status.insert(diagnostics.status.begin(), overall);\n  diagnostics_publisher_.publish(diagnostics);\n}\n\nbool LocalizationStatusManager::isFresh(const StreamStatus& stream,\n                                        const double timeout_sec,\n                                        const double max_future_sec,\n                                        const ros::Time& now) const {\n  if (!stream.seen || !stream.payload_valid || stream.receipt_time.isZero() ||\n      stream.stamp.isZero()) {\n    return false;\n  }\n  const double receipt_age = (now - stream.receipt_time).toSec();\n  const double stamp_age = (now - stream.stamp).toSec();\n  return receipt_age >= 0.0 && receipt_age \u003c= timeout_sec &&\n         stamp_age >= -max_future_sec &&\n         stamp_age \u003c= timeout_sec;\n}\n\nbool LocalizationStatusManager::validatePose(const geometry_msgs::Pose& pose) const {\n  return std::isfinite(pose.position.x) && std::isfinite(pose.position.y) &&\n         std::isfinite(pose.position.z) && finiteQuaternion(pose.orientation);\n}\n\nbool LocalizationStatusManager::validatePoseCovariance(\n    const boost::array\u003cdouble, 36>& covariance,\n    const bool enforce_position_limit) const {\n  for (const double value : covariance) {\n    if (!std::isfinite(value)) {\n      return false;\n    }\n  }\n  return covariance[0] >= 0.0 && covariance[7] >= 0.0 &&\n         (!enforce_position_limit ||\n          (covariance[0] \u003c= max_position_variance_m2_ &&\n           covariance[7] \u003c= max_position_variance_m2_));\n}\n\nvoid LocalizationStatusManager::markAbsoluteMeasurement(const ros::Time& receipt_time) {\n  anchor_seen_ = true;\n  last_absolute_time_ = receipt_time;\n  dead_reckoning_distance_m_ = 0.0;\n  dead_reckoning_active_ = false;\n}\n\ndiagnostic_msgs::DiagnosticStatus LocalizationStatusManager::makeStreamDiagnostic(\n    const std::string& name, const StreamStatus& stream, const double timeout_sec,\n    const double max_future_sec, const ros::Time& now, const bool enabled) const {\n  diagnostic_msgs::DiagnosticStatus status;\n  status.name = name;\n  status.hardware_id = \"mando_localization\";\n  if (!enabled) {\n    status.level = diagnostic_msgs::DiagnosticStatus::OK;\n    status.message = \"DISABLED\";\n  } else if (isFresh(stream, timeout_sec, max_future_sec, now)) {\n    status.level = diagnostic_msgs::DiagnosticStatus::OK;\n    status.message = \"OK\";\n  } else if (!stream.seen) {\n    status.level = diagnostic_msgs::DiagnosticStatus::WARN;\n    status.message = \"NOT_RECEIVED\";\n  } else {\n    status.level = diagnostic_msgs::DiagnosticStatus::ERROR;\n    status.message = stream.reason;\n  }\n  const double receipt_age = stream.seen ? (now - stream.receipt_time).toSec() : -1.0;\n  const double stamp_age = stream.seen ? (now - stream.stamp).toSec() : -1.0;\n  status.values.push_back(keyValue(\"enabled\", booleanText(enabled)));\n  status.values.push_back(keyValue(\"received\", booleanText(stream.seen)));\n  status.values.push_back(keyValue(\"payload_valid\", booleanText(stream.payload_valid)));\n  status.values.push_back(keyValue(\"receipt_age_sec\", std::to_string(receipt_age)));\n  status.values.push_back(keyValue(\"stamp_age_sec\", std::to_string(stamp_age)));\n  status.values.push_back(keyValue(\"frame_id\", stream.frame_id));\n  return status;\n}\n\ndiagnostic_msgs::DiagnosticStatus LocalizationStatusManager::makeDeviceDiagnostic(\n    const std::string& name, const std::string& path, const bool required) const {\n  diagnostic_msgs::DiagnosticStatus status;\n  status.name = name;\n  status.hardware_id = path;\n  const bool present = !path.empty() && ::access(path.c_str(), F_OK) == 0;\n  status.level = (!required || present) ? diagnostic_msgs::DiagnosticStatus::OK\n                                        : diagnostic_msgs::DiagnosticStatus::WARN;\n  status.message = present ? \"CONNECTED\" : (required ? \"NOT_CONNECTED\" : \"OPTIONAL_ABSENT\");\n  status.values.push_back(keyValue(\"path\", path));\n  status.values.push_back(keyValue(\"required\", booleanText(required)));\n  return status;\n}\n\ndiagnostic_msgs::DiagnosticStatus LocalizationStatusManager::makeDriverDiagnostic(\n    const std::string& name, const std::string& expected_node, const bool required,\n    const std::vector\u003cstd::string>& running_nodes) const {\n  diagnostic_msgs::DiagnosticStatus status;\n  status.name = name;\n  status.hardware_id = expected_node;\n  const std::string resolved_node =\n      (!expected_node.empty() && expected_node.front() == '/') ? expected_node : \"/\" + expected_node;\n  const bool running = std::find(running_nodes.begin(), running_nodes.end(), resolved_node) !=\n                       running_nodes.end();\n  status.level = (!required || running) ? diagnostic_msgs::DiagnosticStatus::OK\n                                        : diagnostic_msgs::DiagnosticStatus::WARN;\n  status.message = running ? \"RUNNING\" : (required ? \"NOT_RUNNING\" : \"OPTIONAL_STOPPED\");\n  status.values.push_back(keyValue(\"expected_node\", resolved_node));\n  return status;\n}\n\n}  // namespace mando_localization","line_count":601,"redacted_lines":[],"functions":[{"line":171,"label":"void LocalizationStatusManager::imuCallback(const sensor_msgs::ImuConstPtr& message) {"},{"line":185,"label":"void LocalizationStatusManager::encoderCallback("},{"line":212,"label":"void LocalizationStatusManager::twistCallback("},{"line":229,"label":"void LocalizationStatusManager::localOdometryCallback("},{"line":243,"label":"void LocalizationStatusManager::gpsPoseCallback("},{"line":263,"label":"void LocalizationStatusManager::globalOdometryCallback(const nav_msgs::OdometryConstPtr& message) {"},{"line":292,"label":"void LocalizationStatusManager::gpsRelocalizingCallback("},{"line":297,"label":"bool LocalizationStatusManager::initializationReady(const ros::Time& now) const {"},{"line":307,"label":"void LocalizationStatusManager::clearInitializationAnchor() {"},{"line":319,"label":"void LocalizationStatusManager::applyInitializationAnchor(const ros::Time& now) {"},{"line":333,"label":"void LocalizationStatusManager::initializationReadyCallback("},{"line":345,"label":"void LocalizationStatusManager::initializationPoseCallback("},{"line":370,"label":"void LocalizationStatusManager::timerCallback(const ros::TimerEvent&) {"},{"line":499,"label":"bool LocalizationStatusManager::isFresh(const StreamStatus& stream,"},{"line":514,"label":"bool LocalizationStatusManager::validatePose(const geometry_msgs::Pose& pose) const {"},{"line":519,"label":"bool LocalizationStatusManager::validatePoseCovariance("},{"line":533,"label":"void LocalizationStatusManager::markAbsoluteMeasurement(const ros::Time& receipt_time) {"},{"line":540,"label":"diagnostic_msgs::DiagnosticStatus LocalizationStatusManager::makeStreamDiagnostic("},{"line":570,"label":"diagnostic_msgs::DiagnosticStatus LocalizationStatusManager::makeDeviceDiagnostic("},{"line":584,"label":"diagnostic_msgs::DiagnosticStatus LocalizationStatusManager::makeDriverDiagnostic("}],"params":[]},"src/localization/src/status_manager/localization_state_evaluator.cpp":{"path":"src/localization/src/status_manager/localization_state_evaluator.cpp","sha256":"39c0ac28eb3a7cf85d207cb7676bb4edf68676bd3b8de22177e23eb420b050c6","text":"#include \"localization_state_evaluator.hpp\"\n\n#include \u003ccmath>\n#include \u003cstdexcept>\n\nnamespace mando_localization {\n\nLocalizationStateEvaluator::LocalizationStateEvaluator(StatePolicy policy) : policy_(policy) {\n  if (!std::isfinite(policy_.startup_grace_sec) || policy_.startup_grace_sec \u003c 0.0 ||\n      !std::isfinite(policy_.dead_reckoning_max_sec) ||\n      policy_.dead_reckoning_max_sec \u003c= 0.0 ||\n      !std::isfinite(policy_.dead_reckoning_max_distance_m) ||\n      policy_.dead_reckoning_max_distance_m \u003c= 0.0) {\n    throw std::invalid_argument(\"상태 정책의 시간/거리 값이 유효하지 않습니다.\");\n  }\n}\n\nStateDecision LocalizationStateEvaluator::evaluate(const StateInput& input) const {\n  if (!input.local_motion_healthy) {\n    if (input.uptime_sec \u003c= policy_.startup_grace_sec) {\n      return {LocalizationState::INITIALIZING, false, \"waiting_for_local_motion\"};\n    }\n    return {LocalizationState::FAULT, false, \"local_motion_invalid\"};\n  }\n\n  if (input.relocalizing) {\n    return {LocalizationState::RELOCALIZING, false, \"absolute_pose_relocalizing\"};\n  }\n\n  if (!input.global_output_healthy) {\n    if (input.uptime_sec \u003c= policy_.startup_grace_sec) {\n      return {LocalizationState::INITIALIZING, false, \"waiting_for_global_output\"};\n    }\n    return {LocalizationState::FAULT, false, \"global_output_invalid\"};\n  }\n\n  if (input.absolute_healthy_count > 0U) {\n    if (input.absolute_healthy_count \u003c input.absolute_enabled_count) {\n      return {LocalizationState::DEGRADED, true, \"absolute_source_degraded\"};\n    }\n    return {LocalizationState::TRACKING, true, \"all_enabled_sources_healthy\"};\n  }\n\n  if (!input.anchor_seen || input.absolute_enabled_count == 0U) {\n    return {LocalizationState::INITIALIZING, false, \"waiting_for_absolute_anchor\"};\n  }\n\n  if (input.seconds_since_absolute \u003c= policy_.dead_reckoning_max_sec &&\n      input.dead_reckoning_distance_m \u003c= policy_.dead_reckoning_max_distance_m) {\n    return {LocalizationState::DEAD_RECKONING, true, \"bounded_dead_reckoning\"};\n  }\n\n  if (input.seconds_since_absolute > policy_.dead_reckoning_max_sec) {\n    return {LocalizationState::FAULT, false, \"dead_reckoning_time_exceeded\"};\n  }\n  return {LocalizationState::FAULT, false, \"dead_reckoning_distance_exceeded\"};\n}\n\nconst char* LocalizationStateEvaluator::toString(const LocalizationState state) {\n  switch (state) {\n    case LocalizationState::INITIALIZING:\n      return \"INITIALIZING\";\n    case LocalizationState::TRACKING:\n      return \"TRACKING\";\n    case LocalizationState::DEGRADED:\n      return \"DEGRADED\";\n    case LocalizationState::DEAD_RECKONING:\n      return \"DEAD_RECKONING\";\n    case LocalizationState::RELOCALIZING:\n      return \"RELOCALIZING\";\n    case LocalizationState::FAULT:\n      return \"FAULT\";\n  }\n  return \"FAULT\";\n}\n\n}  // namespace mando_localization","line_count":77,"redacted_lines":[],"functions":[{"line":18,"label":"StateDecision LocalizationStateEvaluator::evaluate(const StateInput& input) const {"},{"line":59,"label":"const char* LocalizationStateEvaluator::toString(const LocalizationState state) {"}],"params":[]},"src/localization/src/supervisor/localization_supervisor.cpp":{"path":"src/localization/src/supervisor/localization_supervisor.cpp","sha256":"12c2d03c71af10ac1b5ddde97497841028d796b451df8b83e1be3abe8c01f826","text":"#include \"supervisor/localization_supervisor.hpp\"\n\n#include \u003calgorithm>\n#include \u003ccmath>\n#include \u003cutility>\n\n#include \"common/parameter_utils.hpp\"\n\nnamespace mando_localization {\nnamespace {\n\ndiagnostic_msgs::KeyValue keyValue(const std::string& key,\n                                   const std::string& value) {\n  diagnostic_msgs::KeyValue result;\n  result.key = key;\n  result.value = value;\n  return result;\n}\n\nstd::string booleanText(const bool value) { return value ? \"true\" : \"false\"; }\n\nbool fresh(const ros::Time& receipt, const ros::Time& now,\n           const double timeout_sec) {\n  if (receipt.isZero()) {\n    return false;\n  }\n  const double age = (now - receipt).toSec();\n  return std::isfinite(age) && age >= 0.0 && age \u003c= timeout_sec;\n}\n\n}  // namespace\n\nSupervisorDecision LocalizationSupervisorArbiter::evaluate(\n    const SupervisorInput& input) const {\n  if (!input.evaluation_received || !input.recovery_received) {\n    return {\"FAULT\", false, \"supervisor_input_missing\"};\n  }\n  if (!input.evaluation_fresh || !input.recovery_fresh) {\n    return {\"FAULT\", false, \"supervisor_input_stale\"};\n  }\n  if (input.recovery_active) {\n    return {\"RELOCALIZING\", false, \"recovery_coordinator_active\"};\n  }\n  return {input.evaluated_state, input.evaluated_valid,\n          \"status_evaluation_forwarded\"};\n}\n\nLocalizationSupervisor::LocalizationSupervisor(ros::NodeHandle nh,\n                                               ros::NodeHandle private_nh)\n    : nh_(std::move(nh)), private_nh_(std::move(private_nh)) {\n  const std::string evaluated_status_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"internal_topics/evaluated_status\");\n  const std::string evaluated_state_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"internal_topics/evaluated_state\");\n  const std::string evaluated_valid_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"internal_topics/evaluated_valid\");\n  const std::string recovery_active_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"internal_topics/recovery_active\");\n  const std::string recovery_state_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"topics/recovery_state\");\n  const std::string status_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"topics/status\");\n  const std::string state_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"topics/state\");\n  const std::string valid_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"topics/valid\");\n  const double publish_rate_hz = requireParameter\u003cdouble>(\n      private_nh_, \"manager_rate_hz\");\n  max_evaluation_age_sec_ = requireParameter\u003cdouble>(\n      private_nh_, \"supervisor/max_evaluation_age_sec\");\n  if (!std::isfinite(publish_rate_hz) || publish_rate_hz \u003c= 0.0 ||\n      !std::isfinite(max_evaluation_age_sec_) ||\n      max_evaluation_age_sec_ \u003c= 0.0) {\n    throw std::runtime_error(\"Supervisor rate 또는 timeout이 유효하지 않습니다.\");\n  }\n\n  status_publisher_ =\n      nh_.advertise\u003cdiagnostic_msgs::DiagnosticArray>(status_topic, 10);\n  state_publisher_ = nh_.advertise\u003cstd_msgs::String>(state_topic, 1, true);\n  valid_publisher_ = nh_.advertise\u003cstd_msgs::Bool>(valid_topic, 1, true);\n  evaluated_status_subscriber_ = nh_.subscribe(\n      evaluated_status_topic, 10,\n      &LocalizationSupervisor::evaluatedStatusCallback, this);\n  evaluated_state_subscriber_ = nh_.subscribe(\n      evaluated_state_topic, 10,\n      &LocalizationSupervisor::evaluatedStateCallback, this);\n  evaluated_valid_subscriber_ = nh_.subscribe(\n      evaluated_valid_topic, 10,\n      &LocalizationSupervisor::evaluatedValidCallback, this);\n  recovery_active_subscriber_ = nh_.subscribe(\n      recovery_active_topic, 10,\n      &LocalizationSupervisor::recoveryActiveCallback, this);\n  recovery_state_subscriber_ = nh_.subscribe(\n      recovery_state_topic, 10,\n      &LocalizationSupervisor::recoveryStateCallback, this);\n  timer_ = nh_.createTimer(ros::Duration(1.0 / publish_rate_hz),\n                           &LocalizationSupervisor::timerCallback, this);\n}\n\nvoid LocalizationSupervisor::evaluatedStatusCallback(\n    const diagnostic_msgs::DiagnosticArrayConstPtr& message) {\n  latest_status_ = *message;\n  status_receipt_time_ = ros::Time::now();\n  have_status_ = true;\n}\n\nvoid LocalizationSupervisor::evaluatedStateCallback(\n    const std_msgs::StringConstPtr& message) {\n  evaluated_state_ = message->data;\n  state_receipt_time_ = ros::Time::now();\n  have_state_ = true;\n}\n\nvoid LocalizationSupervisor::evaluatedValidCallback(\n    const std_msgs::BoolConstPtr& message) {\n  evaluated_valid_ = message->data;\n  valid_receipt_time_ = ros::Time::now();\n  have_valid_ = true;\n}\n\nvoid LocalizationSupervisor::recoveryActiveCallback(\n    const std_msgs::BoolConstPtr& message) {\n  recovery_active_ = message->data;\n  recovery_receipt_time_ = ros::Time::now();\n  have_recovery_active_ = true;\n}\n\nvoid LocalizationSupervisor::recoveryStateCallback(\n    const std_msgs::StringConstPtr& message) {\n  recovery_state_ = message->data;\n}\n\nvoid LocalizationSupervisor::timerCallback(const ros::TimerEvent&) {\n  const ros::Time now = ros::Time::now();\n  SupervisorInput input;\n  input.evaluation_received = have_state_ && have_valid_;\n  input.evaluation_fresh = fresh(state_receipt_time_, now,\n                                 max_evaluation_age_sec_) &&\n                           fresh(valid_receipt_time_, now,\n                                 max_evaluation_age_sec_);\n  input.evaluated_state = evaluated_state_;\n  input.evaluated_valid = evaluated_valid_;\n  input.recovery_received = have_recovery_active_;\n  input.recovery_fresh = fresh(recovery_receipt_time_, now,\n                               max_evaluation_age_sec_);\n  input.recovery_active = recovery_active_;\n  const SupervisorDecision decision = arbiter_.evaluate(input);\n\n  std_msgs::String state;\n  state.data = decision.state;\n  state_publisher_.publish(state);\n  std_msgs::Bool valid;\n  valid.data = decision.valid;\n  valid_publisher_.publish(valid);\n\n  diagnostic_msgs::DiagnosticArray diagnostics;\n  if (have_status_ &&\n      fresh(status_receipt_time_, now, max_evaluation_age_sec_)) {\n    diagnostics = latest_status_;\n  }\n  diagnostics.header.stamp = now;\n  diagnostic_msgs::DiagnosticStatus supervisor;\n  supervisor.name = \"LOCALIZATION_SUPERVISOR\";\n  supervisor.hardware_id = \"mando_localization\";\n  supervisor.level = decision.valid\n      ? diagnostic_msgs::DiagnosticStatus::OK\n      : diagnostic_msgs::DiagnosticStatus::ERROR;\n  if (decision.state == \"DEGRADED\" ||\n      decision.state == \"DEAD_RECKONING\") {\n    supervisor.level = diagnostic_msgs::DiagnosticStatus::WARN;\n  }\n  supervisor.message = decision.state + \":\" + decision.reason;\n  supervisor.values.push_back(keyValue(\"valid\", booleanText(decision.valid)));\n  supervisor.values.push_back(keyValue(\"reason\", decision.reason));\n  supervisor.values.push_back(keyValue(\"recovery_state\", recovery_state_));\n  supervisor.values.push_back(\n      keyValue(\"recovery_active\", booleanText(recovery_active_)));\n  diagnostics.status.insert(diagnostics.status.begin(), supervisor);\n  status_publisher_.publish(diagnostics);\n}\n\n}  // namespace mando_localization","line_count":182,"redacted_lines":[],"functions":[{"line":33,"label":"SupervisorDecision LocalizationSupervisorArbiter::evaluate("},{"line":100,"label":"void LocalizationSupervisor::evaluatedStatusCallback("},{"line":107,"label":"void LocalizationSupervisor::evaluatedStateCallback("},{"line":114,"label":"void LocalizationSupervisor::evaluatedValidCallback("},{"line":121,"label":"void LocalizationSupervisor::recoveryActiveCallback("},{"line":128,"label":"void LocalizationSupervisor::recoveryStateCallback("},{"line":133,"label":"void LocalizationSupervisor::timerCallback(const ros::TimerEvent&) {"}],"params":[]},"src/localization/src/relocalization/relocalization_coordinator.cpp":{"path":"src/localization/src/relocalization/relocalization_coordinator.cpp","sha256":"6f9e046da8483565528222aedacaca9fb506cabf52fc706649a96910ccb5e644","text":"#include \"relocalization/relocalization_coordinator.hpp\"\n\n#include \u003calgorithm>\n#include \u003ccmath>\n#include \u003cstdexcept>\n#include \u003cutility>\n\n#include \"common/parameter_utils.hpp\"\n\nnamespace mando_localization {\nnamespace {\n\nbool finiteQuaternion(const geometry_msgs::Quaternion& quaternion) {\n  const double norm_squared = quaternion.x * quaternion.x +\n                              quaternion.y * quaternion.y +\n                              quaternion.z * quaternion.z +\n                              quaternion.w * quaternion.w;\n  return std::isfinite(norm_squared) && norm_squared > 1.0e-12;\n}\n\ndouble planarDistance(const geometry_msgs::Point& lhs,\n                      const geometry_msgs::Point& rhs) {\n  return std::hypot(lhs.x - rhs.x, lhs.y - rhs.y);\n}\n\n}  // namespace\n\nRelocalizationCoordinator::RelocalizationCoordinator(\n    ros::NodeHandle nh, ros::NodeHandle private_nh)\n    : nh_(std::move(nh)),\n      private_nh_(std::move(private_nh)),\n      policy_([&]() {\n        RelocalizationPolicyConfig config;\n        config.max_stationary_speed_mps = requireParameter\u003cdouble>(\n            private_nh_,\n            \"relocalization/gps_only/max_stationary_speed_mps\");\n        config.gps_only_required_consecutive_candidates = requireParameter\u003cint>(\n            private_nh_,\n            \"relocalization/gps_only/required_consecutive_candidates\");\n        config.automatic_gps_only_reset_enabled = requireParameter\u003cbool>(\n            private_nh_,\n            \"relocalization/gps_only/automatic_reset_enabled\");\n        config.require_measured_datum = requireParameter\u003cbool>(\n            private_nh_,\n            \"relocalization/gps_only/require_measured_datum\");\n        config.gps_datum_measured = requireParameter\u003cbool>(\n            private_nh_, \"reference/measured\");\n        return config;\n      }()) {\n  const std::string gps_candidate_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"internal_topics/gps_candidate_pose\");\n  const std::string gps_gate_pose_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"internal_topics/gps_gate_pose\");\n  const std::string gate_relocalizing_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"internal_topics/gps_gate_relocalizing\");\n  const std::string gps_reanchor_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"internal_topics/gps_reanchor_pose\");\n  const std::string gps_reanchor_accepted_topic =\n      requireParameter\u003cstd::string>(\n          private_nh_, \"internal_topics/gps_reanchor_accepted\");\n  const std::string recovery_active_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"internal_topics/recovery_active\");\n  const std::string gps_pose_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"topics/gps_map_pose\");\n  const std::string gps_relocalizing_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"topics/gps_relocalizing\");\n  const std::string twist_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"topics/encoder_twist\");\n  const std::string global_odometry_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"topics/global_odometry\");\n  const std::string recovery_state_topic = requireParameter\u003cstd::string>(\n      private_nh_, \"topics/recovery_state\");\n  const std::string set_pose_service = requireParameter\u003cstd::string>(\n      private_nh_, \"services/global_ekf_set_pose\");\n\n  map_frame_ = requireParameter\u003cstd::string>(private_nh_, \"frames/map\");\n  long_outage_sec_ = requireParameter\u003cdouble>(\n      private_nh_, \"relocalization/long_outage_sec\");\n  candidate_max_message_age_sec_ = requireParameter\u003cdouble>(\n      private_nh_, \"relocalization/candidate_max_message_age_sec\");\n  candidate_max_future_stamp_sec_ = requireParameter\u003cdouble>(\n      private_nh_, \"relocalization/candidate_max_future_stamp_sec\");\n  candidate_cluster_radius_m_ = requireParameter\u003cdouble>(\n      private_nh_, \"relocalization/candidate_cluster_radius_m\");\n  twist_timeout_sec_ = requireParameter\u003cdouble>(\n      private_nh_, \"sources/encoder/timeout_sec\");\n  global_odometry_timeout_sec_ = requireParameter\u003cdouble>(\n      private_nh_, \"sources/global_odometry/timeout_sec\");\n  set_pose_service_wait_timeout_sec_ = requireParameter\u003cdouble>(\n      private_nh_,\n      \"relocalization/gps_only/set_pose_service_wait_timeout_sec\");\n  global_confirmation_timeout_sec_ = requireParameter\u003cdouble>(\n      private_nh_,\n      \"relocalization/gps_only/global_confirmation_timeout_sec\");\n  max_global_confirmation_distance_m_ = requireParameter\u003cdouble>(\n      private_nh_,\n      \"relocalization/gps_only/max_global_confirmation_distance_m\");\n  required_global_confirmations_ = requireParameter\u003cint>(\n      private_nh_,\n      \"relocalization/gps_only/required_global_confirmations\");\n  reanchor_ack_timeout_sec_ = requireParameter\u003cdouble>(\n      private_nh_, \"relocalization/reanchor_ack_timeout_sec\");\n\n  const double positive_values[] = {\n      long_outage_sec_, candidate_max_message_age_sec_,\n      candidate_cluster_radius_m_, twist_timeout_sec_,\n      global_odometry_timeout_sec_, set_pose_service_wait_timeout_sec_,\n      global_confirmation_timeout_sec_, max_global_confirmation_distance_m_,\n      reanchor_ack_timeout_sec_};\n  if (map_frame_.empty() ||\n      std::any_of(std::begin(positive_values), std::end(positive_values),\n                  [](const double value) {\n                    return !std::isfinite(value) || value \u003c= 0.0;\n                  }) ||\n      !std::isfinite(candidate_max_future_stamp_sec_) ||\n      candidate_max_future_stamp_sec_ \u003c 0.0 ||\n      required_global_confirmations_ \u003c= 0) {\n    throw std::runtime_error(\"재정합 Coordinator 설정이 유효하지 않습니다.\");\n  }\n\n  gps_pose_publisher_ =\n      nh_.advertise\u003cgeometry_msgs::PoseWithCovarianceStamped>(\n          gps_pose_topic, 10, false);\n  gps_relocalizing_publisher_ =\n      nh_.advertise\u003cstd_msgs::Bool>(gps_relocalizing_topic, 1, true);\n  gps_reanchor_publisher_ =\n      nh_.advertise\u003cmando_localization::GpsGateReanchor>(\n          gps_reanchor_topic, 1, false);\n  recovery_state_publisher_ =\n      nh_.advertise\u003cstd_msgs::String>(recovery_state_topic, 1, true);\n  recovery_active_publisher_ =\n      nh_.advertise\u003cstd_msgs::Bool>(recovery_active_topic, 1, true);\n\n  gps_candidate_subscriber_ = nh_.subscribe(\n      gps_candidate_topic, 20,\n      &RelocalizationCoordinator::gpsCandidateCallback, this);\n  gps_gate_pose_subscriber_ = nh_.subscribe(\n      gps_gate_pose_topic, 20,\n      &RelocalizationCoordinator::gpsGatePoseCallback, this);\n  twist_subscriber_ = nh_.subscribe(\n      twist_topic, 50, &RelocalizationCoordinator::twistCallback, this);\n  global_odometry_subscriber_ = nh_.subscribe(\n      global_odometry_topic, 50,\n      &RelocalizationCoordinator::globalOdometryCallback, this);\n  gate_relocalizing_subscriber_ = nh_.subscribe(\n      gate_relocalizing_topic, 10,\n      &RelocalizationCoordinator::gateRelocalizingCallback, this);\n  reanchor_accepted_subscriber_ = nh_.subscribe(\n      gps_reanchor_accepted_topic, 5,\n      &RelocalizationCoordinator::reanchorAcceptedCallback, this);\n  set_pose_client_ = nh_.serviceClient\u003crobot_localization::SetPose>(\n      set_pose_service, false);\n  timer_ = nh_.createTimer(ros::Duration(0.05),\n                           &RelocalizationCoordinator::timerCallback, this);\n  publishRecoveryStatus(\"IDLE\", false);\n\n  ROS_INFO_STREAM(\"RelocalizationCoordinator 설정: long outage=\"\n                  \u003c\u003c long_outage_sec_ \u003c\u003c \" s\"\n                  \u003c\u003c \", GPS-only reset=\"\n                  \u003c\u003c policy_.config().automatic_gps_only_reset_enabled);\n}\n\nvoid RelocalizationCoordinator::gpsCandidateCallback(\n    const geometry_msgs::PoseWithCovarianceStampedConstPtr& message) {\n  const ros::Time now = ros::Time::now();\n  if (!validatePose(*message, now) || reset_pending_ || reanchor_pending_) {\n    return;\n  }\n  if (!have_prior_anchor_ || last_gate_pose_receipt_time_.isZero() ||\n      (now - last_gate_pose_receipt_time_).toSec() \u003c= long_outage_sec_) {\n    return;\n  }
