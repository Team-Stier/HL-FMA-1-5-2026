led: false\n    calibration_state: unmeasured\n    measured_at: \"\"\n    source: \"\"\n  - parent_frame: base_link\n    child_frame: laser_link\n    translation_m: [1.05, 0.0, 0.0]\n    # roll=180: 윗면이 아래, yaw=180: 전방 축이 차량 뒤쪽.\n    # 장착 회전은 TF에서만 적용하며 lidar_driver.yaml의 inverted=false를 유지한다.\n    rotation_rpy_deg: [180.0, 0.0, 180.0]\n    enabled: true\n    calibration_state: measured\n    measured_at: \"2026-09-05\"\n    source: user_confirmed_position_2026-09-05_upside_down_rear_facing_2026-09-07","line_count":51,"redacted_lines":[],"functions":[],"params":[["schema_version",1],["strict_validation",true],["base_link_reference.origin","rear_axle_center"],["base_link_reference.x_axis","forward"],["base_link_reference.y_axis","left"],["base_link_reference.z_axis","up"],["dynamic_transforms",[{"parent_frame":"map","child_frame":"odom","owner_node":"odometry_gps_global_ekf","source":"robot_localization_global"},{"parent_frame":"odom","child_frame":"base_link","owner_node":"imu_encoder_local_ekf","source":"robot_localization_local"}]],["static_transforms",[{"parent_frame":"base_link","child_frame":"imu_link","translation_m":[0.2,0.0,0.0],"rotation_rpy_deg":[0.0,0.0,0.0],"enabled":true,"calibration_state":"verified","measured_at":"","source":"user_confirmed_mount_position_and_axes_2026-09-06"},{"parent_frame":"base_link","child_frame":"gps_link","translation_m":[0.65,0.0,0.0],"rotation_rpy_deg":[0.0,0.0,0.0],"enabled":false,"calibration_state":"unmeasured","measured_at":"","source":""},{"parent_frame":"base_link","child_frame":"laser_link","translation_m":[1.05,0.0,0.0],"rotation_rpy_deg":[180.0,0.0,180.0],"enabled":true,"calibration_state":"measured","measured_at":"2026-09-05","source":"user_confirmed_position_2026-09-05_upside_down_rear_facing_2026-09-07"}]]]},"src/localization/src/tf/transform_configuration.cpp":{"path":"src/localization/src/tf/transform_configuration.cpp","sha256":"d1159cc7e81afe987ad9ced3dae8baaba45d70ac79c0d4c6f9885c4f085d110e","text":"#include \"transform_configuration.hpp\"\n\n#include \u003ctf2/LinearMath/Quaternion.h>\n#include \u003cxmlrpcpp/XmlRpcValue.h>\n\n#include \u003ccmath>\n#include \u003cfunctional>\n#include \u003cset>\n#include \u003cstdexcept>\n#include \u003cunordered_map>\n#include \u003cutility>\n\nnamespace mando_localization {\nnamespace {\n\ntemplate \u003ctypename T>\nT requiredMember(const XmlRpc::XmlRpcValue& value, const std::string& name);\n\ntemplate \u003c>\nstd::string requiredMember\u003cstd::string>(const XmlRpc::XmlRpcValue& value,\n                                        const std::string& name) {\n  if (!value.hasMember(name) || value[name].getType() != XmlRpc::XmlRpcValue::TypeString) {\n    throw std::runtime_error(\"TF 항목의 문자열 필드가 없거나 타입이 다릅니다: \" + name);\n  }\n  return static_cast\u003cstd::string>(value[name]);\n}\n\ntemplate \u003c>\nbool requiredMember\u003cbool>(const XmlRpc::XmlRpcValue& value, const std::string& name) {\n  if (!value.hasMember(name) || value[name].getType() != XmlRpc::XmlRpcValue::TypeBoolean) {\n    throw std::runtime_error(\"TF 항목의 bool 필드가 없거나 타입이 다릅니다: \" + name);\n  }\n  return static_cast\u003cbool>(value[name]);\n}\n\ndouble numericValue(const XmlRpc::XmlRpcValue& value) {\n  if (value.getType() == XmlRpc::XmlRpcValue::TypeDouble) {\n    return static_cast\u003cdouble>(value);\n  }\n  if (value.getType() == XmlRpc::XmlRpcValue::TypeInt) {\n    return static_cast\u003cint>(value);\n  }\n  throw std::runtime_error(\"TF translation/rotation 값은 숫자여야 합니다.\");\n}\n\nvoid readTriple(const XmlRpc::XmlRpcValue& entry, const std::string& name, double* first,\n                double* second, double* third) {\n  if (!entry.hasMember(name) || entry[name].getType() != XmlRpc::XmlRpcValue::TypeArray ||\n      entry[name].size() != 3) {\n    throw std::runtime_error(\"TF 필드는 길이 3 배열이어야 합니다: \" + name);\n  }\n  *first = numericValue(entry[name][0]);\n  *second = numericValue(entry[name][1]);\n  *third = numericValue(entry[name][2]);\n}\n\nbool validFrame(const std::string& frame) {\n  return !frame.empty() && frame.front() != '/' && frame.find(' ') == std::string::npos;\n}\n\n}  // namespace\n\nstd::vector\u003cStaticTransformSpec> TransformConfiguration::load(const ros::NodeHandle& node,\n                                                              const std::string& parameter_name) {\n  XmlRpc::XmlRpcValue entries;\n  if (!node.getParam(parameter_name, entries)) {\n    throw std::runtime_error(\"필수 TF 파라미터가 없습니다: \" +\n                             node.resolveName(parameter_name));\n  }\n  if (entries.getType() != XmlRpc::XmlRpcValue::TypeArray) {\n    throw std::runtime_error(\"static_transforms는 배열이어야 합니다.\");\n  }\n\n  std::vector\u003cStaticTransformSpec> result;\n  result.reserve(entries.size());\n  for (int index = 0; index \u003c entries.size(); ++index) {\n    const XmlRpc::XmlRpcValue& entry = entries[index];\n    if (entry.getType() != XmlRpc::XmlRpcValue::TypeStruct) {\n      throw std::runtime_error(\"각 static transform은 YAML map이어야 합니다.\");\n    }\n    StaticTransformSpec transform;\n    transform.parent_frame = requiredMember\u003cstd::string>(entry, \"parent_frame\");\n    transform.child_frame = requiredMember\u003cstd::string>(entry, \"child_frame\");\n    readTriple(entry, \"translation_m\", &transform.x_m, &transform.y_m, &transform.z_m);\n    readTriple(entry, \"rotation_rpy_deg\", &transform.roll_deg, &transform.pitch_deg,\n               &transform.yaw_deg);\n    transform.enabled = requiredMember\u003cbool>(entry, \"enabled\");\n    transform.calibration_state =\n        requiredMember\u003cstd::string>(entry, \"calibration_state\");\n    transform.measured_at = requiredMember\u003cstd::string>(entry, \"measured_at\");\n    transform.source = requiredMember\u003cstd::string>(entry, \"source\");\n    result.push_back(transform);\n  }\n  validate(result);\n  return result;\n}\n\nstd::vector\u003cDynamicTransformSpec> TransformConfiguration::loadDynamic(\n    const ros::NodeHandle& node, const std::string& parameter_name) {\n  XmlRpc::XmlRpcValue entries;\n  if (!node.getParam(parameter_name, entries) ||\n      entries.getType() != XmlRpc::XmlRpcValue::TypeArray) {\n    throw std::runtime_error(\"dynamic_transforms는 필수 배열이어야 합니다.\");\n  }\n  std::vector\u003cDynamicTransformSpec> result;\n  result.reserve(entries.size());\n  for (int index = 0; index \u003c entries.size(); ++index) {\n    const XmlRpc::XmlRpcValue& entry = entries[index];\n    if (entry.getType() != XmlRpc::XmlRpcValue::TypeStruct) {\n      throw std::runtime_error(\"각 dynamic transform은 YAML map이어야 합니다.\");\n    }\n    DynamicTransformSpec transform;\n    transform.parent_frame = requiredMember\u003cstd::string>(entry, \"parent_frame\");\n    transform.child_frame = requiredMember\u003cstd::string>(entry, \"child_frame\");\n    transform.owner_node = requiredMember\u003cstd::string>(entry, \"owner_node\");\n    transform.source = requiredMember\u003cstd::string>(entry, \"source\");\n    if (!validFrame(transform.parent_frame) ||\n        !validFrame(transform.child_frame) ||\n        transform.parent_frame == transform.child_frame ||\n        transform.owner_node.empty() || transform.source.empty()) {\n      throw std::runtime_error(\"동적 TF 선언이 유효하지 않습니다.\");\n    }\n    result.push_back(transform);\n  }\n  return result;\n}\n\nvoid TransformConfiguration::validate(const std::vector\u003cStaticTransformSpec>& transforms) {\n  std::set\u003cstd::string> child_frames;\n  std::unordered_map\u003cstd::string, std::string> parent_by_child;\n  const std::set\u003cstd::string> states = {\"unmeasured\", \"measured\", \"verified\"};\n\n  for (const StaticTransformSpec& transform : transforms) {\n    if (!validFrame(transform.parent_frame) || !validFrame(transform.child_frame) ||\n        transform.parent_frame == transform.child_frame) {\n      throw std::runtime_error(\"유효하지 않은 TF frame: \" + transform.parent_frame + \" -> \" +\n                               transform.child_frame);\n    }\n    if (!child_frames.insert(transform.child_frame).second) {\n      throw std::runtime_error(\"중복 TF child frame: \" + transform.child_frame);\n    }\n    if (states.count(transform.calibration_state) == 0U) {\n      throw std::runtime_error(\"알 수 없는 calibration_state: \" +\n                               transform.calibration_state);\n    }\n    const double values[] = {transform.x_m,       transform.y_m,      transform.z_m,\n                             transform.roll_deg, transform.pitch_deg, transform.yaw_deg};\n    for (const double value : values) {\n      if (!std::isfinite(value)) {\n        throw std::runtime_error(\"TF에 finite가 아닌 값이 있습니다: \" +\n                                 transform.child_frame);\n      }\n    }\n    parent_by_child[transform.child_frame] = transform.parent_frame;\n  }\n\n  for (const StaticTransformSpec& transform : transforms) {\n    std::set\u003cstd::string> visited;\n    std::string current = transform.child_frame;\n    while (parent_by_child.count(current) > 0U) {\n      if (!visited.insert(current).second) {\n        throw std::runtime_error(\"TF 순환 구조가 발견되었습니다: \" + current);\n      }\n      current = parent_by_child.at(current);\n    }\n  }\n}\n\nvoid TransformConfiguration::validateTree(\n    const std::vector\u003cStaticTransformSpec>& static_transforms,\n    const std::vector\u003cDynamicTransformSpec>& dynamic_transforms) {\n  std::vector\u003cStaticTransformSpec> combined = static_transforms;\n  for (const DynamicTransformSpec& dynamic : dynamic_transforms) {\n    StaticTransformSpec placeholder;\n    placeholder.parent_frame = dynamic.parent_frame;\n    placeholder.child_frame = dynamic.child_frame;\n    placeholder.calibration_state = \"verified\";\n    combined.push_back(placeholder);\n  }\n  validate(combined);\n}\n\nbool TransformConfiguration::shouldPublish(const StaticTransformSpec& transform) {\n  return transform.enabled &&\n         (transform.calibration_state == \"measured\" ||\n          transform.calibration_state == \"verified\");\n}\n\ngeometry_msgs::TransformStamped TransformConfiguration::toMessage(\n    const StaticTransformSpec& transform, const ros::Time& stamp) {\n  constexpr double kDegreeToRadian = 3.14159265358979323846 / 180.0;\n  geometry_msgs::TransformStamped message;\n  message.header.stamp = stamp;\n  message.header.frame_id = transform.parent_frame;\n  message.child_frame_id = transform.child_frame;\n  message.transform.translation.x = transform.x_m;\n  message.transform.translation.y = transform.y_m;\n  message.transform.translation.z = transform.z_m;\n  tf2::Quaternion quaternion;\n  quaternion.setRPY(transform.roll_deg * kDegreeToRadian,\n                    transform.pitch_deg * kDegreeToRadian,\n                    transform.yaw_deg * kDegreeToRadian);\n  quaternion.normalize();\n  message.transform.rotation.x = quaternion.x();\n  message.transform.rotation.y = quaternion.y();\n  message.transform.rotation.z = quaternion.z();\n  message.transform.rotation.w = quaternion.w();\n  return message;\n}\n\n}  // namespace mando_localization","line_count":211,"redacted_lines":[],"functions":[{"line":63,"label":"std::vector\u003cStaticTransformSpec> TransformConfiguration::load(const ros::NodeHandle& node,"},{"line":98,"label":"std::vector\u003cDynamicTransformSpec> TransformConfiguration::loadDynamic("},{"line":128,"label":"void TransformConfiguration::validate(const std::vector\u003cStaticTransformSpec>& transforms) {"},{"line":169,"label":"void TransformConfiguration::validateTree("},{"line":183,"label":"bool TransformConfiguration::shouldPublish(const StaticTransformSpec& transform) {"},{"line":189,"label":"geometry_msgs::TransformStamped TransformConfiguration::toMessage("}],"params":[]},"src/localization/src/visualization/localization_visualization.cpp":{"path":"src/localization/src/visualization/localization_visualization.cpp","sha256":"85dc6e0ff999e7989a5b1e867b923e8bc70434ce0542a65fe25834a31dcf45c1","text":"#include \"localization_visualization.hpp\"\n\n#include \u003cgeometry_msgs/PoseStamped.h>\n#include \u003ctf2/utils.h>\n\n#include \u003calgorithm>\n#include \u003ccmath>\n#include \u003cstdexcept>\n#include \u003cutility>\n#include \u003cvector>\n\nnamespace mando_localization {\nnamespace {\n\ntemplate \u003ctypename T>\nT requireParameter(const ros::NodeHandle& node, const std::string& name) {\n  T value;\n  if (!node.getParam(name, value)) {\n    throw std::runtime_error(\"필수 파라미터가 없습니다: \" + node.resolveName(name));\n  }\n  return value;\n}\n\nvoid validateColor(const std::vector\u003cdouble>& color,\n                   const std::string& name) {\n  if (color.size() != 4) {\n    throw std::runtime_error(name + \"는 RGBA 길이 4 배열이어야 합니다.\");\n  }\n  for (const double value : color) {\n    if (!std::isfinite(value) || value \u003c 0.0 || value > 1.0) {\n      throw std::runtime_error(name + \" 값은 [0, 1] 범위여야 합니다.\");\n    }\n  }\n}\n\n}  // namespace\n\nLocalizationVisualization::LocalizationVisualization(ros::NodeHandle nh,\n                                                     ros::NodeHandle private_nh)\n    : nh_(std::move(nh)), private_nh_(std::move(private_nh)) {\n  const std::string odometry_topic =\n      requireParameter\u003cstd::string>(private_nh_, \"topics/output_odometry\");\n  const std::string valid_topic = requireParameter\u003cstd::string>(private_nh_, \"topics/valid\");\n  const std::string path_topic = requireParameter\u003cstd::string>(private_nh_, \"topics/path\");\n  const std::string marker_topic =\n      requireParameter\u003cstd::string>(private_nh_, \"topics/markers\");\n  const std::string gps_pose_topic =\n      requireParameter\u003cstd::string>(private_nh_, \"topics/gps_map_pose\");\n  map_frame_ = requireParameter\u003cstd::string>(private_nh_, \"fixed_frame\");\n  const double publish_rate_hz =\n      requireParameter\u003cdouble>(private_nh_, \"publish_rate_hz\");\n  const int max_path_points = requireParameter\u003cint>(private_nh_, \"path/max_pose_count\");\n  clear_on_invalid_ = requireParameter\u003cbool>(private_nh_, \"path/clear_on_invalid\");\n  min_translation_m_ =\n      requireParameter\u003cdouble>(private_nh_, \"path/min_translation_m\");\n  min_rotation_rad_ =\n      requireParameter\u003cdouble>(private_nh_, \"path/min_rotation_rad\");\n  path_line_width_m_ =\n      requireParameter\u003cdouble>(private_nh_, \"path/line_width_m\");\n  path_color_ =\n      requireParameter\u003cstd::vector\u003cdouble>>(private_nh_, \"path/color_rgba\");\n  vehicle_scale_ = requireParameter\u003cstd::vector\u003cdouble>>(\n      private_nh_, \"markers/vehicle_scale_m\");\n  gps_scale_m_ =\n      requireParameter\u003cdouble>(private_nh_, \"markers/gps_scale_m\");\n  gps_color_ = requireParameter\u003cstd::vector\u003cdouble>>(\n      private_nh_, \"markers/gps_color_rgba\");\n  fault_color_ = requireParameter\u003cstd::vector\u003cdouble>>(\n      private_nh_, \"markers/fault_color_rgba\");\n  if (map_frame_.empty() || max_path_points \u003c= 0 ||\n      !std::isfinite(publish_rate_hz) || publish_rate_hz \u003c= 0.0 ||\n      !std::isfinite(min_translation_m_) || min_translation_m_ \u003c 0.0 ||\n      !std::isfinite(min_rotation_rad_) || min_rotation_rad_ \u003c 0.0 ||\n      !std::isfinite(path_line_width_m_) || path_line_width_m_ \u003c= 0.0 ||\n      vehicle_scale_.size() != 3 ||\n      std::any_of(vehicle_scale_.begin(), vehicle_scale_.end(),\n                  [](double value) { return !std::isfinite(value) || value \u003c= 0.0; }) ||\n      !std::isfinite(gps_scale_m_) || gps_scale_m_ \u003c= 0.0) {\n    throw std::runtime_error(\"시각화 frame 또는 max_path_points가 유효하지 않습니다.\");\n  }\n  validateColor(path_color_, \"path/color_rgba\");\n  validateColor(gps_color_, \"markers/gps_color_rgba\");\n  validateColor(fault_color_, \"markers/fault_color_rgba\");\n  max_path_points_ = static_cast\u003cstd::size_t>(max_path_points);\n  path_.header.frame_id = map_frame_;\n  path_publisher_ = nh_.advertise\u003cnav_msgs::Path>(path_topic, 1, true);\n  marker_publisher_ =\n      nh_.advertise\u003cvisualization_msgs::MarkerArray>(marker_topic, 1, true);\n  odometry_subscriber_ = nh_.subscribe(\n      odometry_topic, 50, &LocalizationVisualization::odometryCallback, this);\n  valid_subscriber_ =\n      nh_.subscribe(valid_topic, 10, &LocalizationVisualization::validCallback, this);\n  gps_pose_subscriber_ = nh_.subscribe(\n      gps_pose_topic, 10, &LocalizationVisualization::gpsPoseCallback, this);\n  publish_timer_ = nh_.createTimer(\n      ros::Duration(1.0 / publish_rate_hz),\n      &LocalizationVisualization::publishTimerCallback, this);\n  ROS_INFO_STREAM(\"LocalizationVisualization 설정: path=\" \u003c\u003c path_topic\n                  \u003c\u003c \", 최대 점=\" \u003c\u003c max_path_points_);\n}\n\nvoid LocalizationVisualization::odometryCallback(const nav_msgs::OdometryConstPtr& message) {\n  if (!valid_ || message->header.frame_id != map_frame_ || message->header.stamp.isZero() ||\n      !std::isfinite(message->pose.pose.position.x) ||\n      !std::isfinite(message->pose.pose.position.y)) {\n    return;\n  }\n  if (!path_.poses.empty() && message->header.stamp \u003c= path_.poses.back().header.stamp) {\n    path_.poses.clear();\n  }\n  odometry_ = *message;\n  have_odometry_ = true;\n  if (!path_.poses.empty()) {\n    const geometry_msgs::Pose& previous = path_.poses.back().pose;\n    const double translation = std::hypot(\n        message->pose.pose.position.x - previous.position.x,\n        message->pose.pose.position.y - previous.position.y);\n    const double rotation = std::abs(\n        std::atan2(std::sin(tf2::getYaw(message->pose.pose.orientation) -\n                            tf2::getYaw(previous.orientation)),\n                   std::cos(tf2::getYaw(message->pose.pose.orientation) -\n                            tf2::getYaw(previous.orientation))));\n    if (translation \u003c min_translation_m_ && rotation \u003c min_rotation_rad_) {\n      return;\n    }\n  }\n  geometry_msgs::PoseStamped pose;\n  pose.header = message->header;\n  pose.pose = message->pose.pose;\n  path_.poses.push_back(pose);\n  if (path_.poses.size() > max_path_points_) {\n    const auto remove_count = path_.poses.size() - max_path_points_;\n    path_.poses.erase(path_.poses.begin(), path_.poses.begin() + remove_count);\n  }\n  path_.header.stamp = message->header.stamp;\n  path_publisher_.publish(path_);\n}\n\nvoid LocalizationVisualization::gpsPoseCallback(\n    const geometry_msgs::PoseWithCovarianceStampedConstPtr& message) {\n  if (message->header.frame_id == map_frame_ && !message->header.stamp.isZero()) {\n    gps_pose_ = *message;\n    have_gps_pose_ = true;\n  }\n}\n\nvisualization_msgs::Marker LocalizationVisualization::makePoseMarker(\n    const int id, const std::string& name, const geometry_msgs::Pose& pose,\n    const double scale, const std::vector\u003cdouble>& color) const {\n  visualization_msgs::Marker marker;\n  marker.header.frame_id = map_frame_;\n  marker.header.stamp = ros::Time::now();\n  marker.ns = name;\n  marker.id = id;\n  marker.type = visualization_msgs::Marker::SPHERE;\n  marker.action = visualization_msgs::Marker::ADD;\n  marker.pose = pose;\n  marker.pose.orientation.w = 1.0;\n  marker.scale.x = scale;\n  marker.scale.y = scale;\n  marker.scale.z = scale;\n  marker.color.r = color[0];\n  marker.color.g = color[1];\n  marker.color.b = color[2];\n  marker.color.a = color[3];\n  return marker;\n}\n\nvoid LocalizationVisualization::publishTimerCallback(const ros::TimerEvent&) {\n  visualization_msgs::MarkerArray output;\n  if (have_odometry_) {\n    visualization_msgs::Marker vehicle = makePoseMarker(\n        0, \"vehicle\", odometry_.pose.pose, 1.0,\n        valid_ ? path_color_ : fault_color_);\n    vehicle.type = visualization_msgs::Marker::CUBE;\n    vehicle.pose.orientation = odometry_.pose.pose.orientation;\n    vehicle.scale.x = vehicle_scale_[0];\n    vehicle.scale.y = vehicle_scale_[1];\n    vehicle.scale.z = vehicle_scale_[2];\n    output.markers.push_back(vehicle);\n  }\n  if (have_gps_pose_) {\n    output.markers.push_back(makePoseMarker(\n        1, \"gps\", gps_pose_.pose.pose, gps_scale_m_, gps_color_));\n  }\n  visualization_msgs::Marker path_marker;\n  path_marker.header = path_.header;\n  path_marker.ns = \"path\";\n  path_marker.id = 3;\n  path_marker.type = visualization_msgs::Marker::LINE_STRIP;\n  path_marker.action = visualization_msgs::Marker::ADD;\n  path_marker.pose.orientation.w = 1.0;\n  path_marker.scale.x = path_line_width_m_;\n  path_marker.color.r = path_color_[0];\n  path_marker.color.g = path_color_[1];\n  path_marker.color.b = path_color_[2];\n  path_marker.color.a = path_color_[3];\n  for (const geometry_msgs::PoseStamped& pose : path_.poses) {\n    path_marker.points.push_back(pose.pose.position);\n  }\n  output.markers.push_back(path_marker);\n  marker_publisher_.publish(output);\n}\n\nvoid LocalizationVisualization::validCallback(const std_msgs::BoolConstPtr& message) {\n  if (valid_ && !message->data && clear_on_invalid_) {\n    path_.poses.clear();\n    path_.header.stamp = ros::Time::now();\n    path_publisher_.publish(path_);\n  }\n  valid_ = message->data;\n}\n\n}  // namespace mando_localization","line_count":214,"redacted_lines":[],"functions":[{"line":102,"label":"void LocalizationVisualization::odometryCallback(const nav_msgs::OdometryConstPtr& message) {"},{"line":139,"label":"void LocalizationVisualization::gpsPoseCallback("},{"line":147,"label":"visualization_msgs::Marker LocalizationVisualization::makePoseMarker("},{"line":169,"label":"void LocalizationVisualization::publishTimerCallback(const ros::TimerEvent&) {"},{"line":205,"label":"void LocalizationVisualization::validCallback(const std_msgs::BoolConstPtr& message) {"}],"params":[]},"src/localization/docs/configuration.md":{"path":"src/localization/docs/configuration.md","sha256":"090d0bda2e0e2fdb549458515385443010dd4798512cda94375a67116d28ba10","text":"# 설정 가이드\n\n설정의 원본은 `config/` YAML입니다. 파일을 변경한 뒤 해당 노드를 재시작해야 합니다.\n문서에 모든 키를 복제하지 않고 파일별 책임과 함께 조정해야 하는 항목을 정리합니다.\n\n## 설정 파일\n\n| 파일 | 책임 |\n|---|---|\n| [localization_interfaces.yaml](../config/localization_interfaces.yaml) | 공개·내부 토픽, 서비스, frame과 기본 노드 이름 |\n| [encoder_driver.yaml](../config/encoder_driver.yaml) | rosserial 장치와 baud |\n| [encoder_calibration.yaml](../config/encoder_calibration.yaml) | 속도 변환, alive·범위 검사, vx·vy 공분산 |\n| [imu_driver.yaml](../config/imu_driver.yaml) | Xsens 드라이버, IMU 정규화·공분산 |\n| [imu_heading_calibration.yaml](../config/imu_heading_calibration.yaml) | GNSS 직진 구간의 최초 yaw 보정 |\n| [initial_heading.yaml](../config/initial_heading.yaml) | RDDF 출발 yaw, 보정 IMU 및 두 EKF의 공통 초기값 |\n| [gps_driver.yaml](../config/gps_driver.yaml) | u-blox 장치, UTC 헤더, 출력 설정 |\n| [time_sync.yaml](../config/time_sync.yaml) | 호스트 시계 검사와 센서 시각 진단 |\n| [gps_reference.yaml](../config/gps_reference.yaml) | datum·레버암, 시각 이력, GPS 품질 gate |\n| [lidar_driver.yaml](../config/lidar_driver.yaml) | RPLIDAR 장치와 원시 scan |\n| [ekf_local.yaml](../config/ekf_local.yaml), [ekf_global.yaml](../config/ekf_global.yaml) | EKF 관측 구성, 공분산, 지연 재처리 |\n| [status_policy.yaml](../config/status_policy.yaml) | freshness, 소스 일관성, 추측 항법 예산, 최종 출력 검사 |\n| [relocalization_policy.yaml](../config/relocalization_policy.yaml) | 장기 GPS 단절 복구와 transaction ACK |\n| [tf_configuration.yaml](../config/tf_configuration.yaml) | 차량 기준점, 동적 TF 소유자, 정적 장착값 |\n| [visualization.yaml](../config/visualization.yaml) | 공개 Path·MarkerArray |\n| [localization_viewer.yaml](../config/localization_viewer.yaml) | 공통 화면 토픽·색상·RDDF 경로·버퍼 |\n| [lidar_front_visualization.yaml](../config/lidar_front_visualization.yaml) | 표시용 전방 scan 범위 |\n\n## 현재 핵심 조건\n\n- 기본 초기 yaw는 RDDF `1_right` 출발 방향 161.47°입니다. 초기화 후 실제 회전량과\n  기존 GNSS 직진 보정을 반영합니다. 다른 방향에서 시작하면 `initial_heading_config`를\n  교체하거나 `initialize_heading:=false`를 사용합니다.\n- GPS는 `minimum_fix_status: 0`이며 RTK Fixed만 허용하는 설정이 아닙니다.\n  status 통과 후에도 시각·좌표·공분산·Local innovation 검사가 필요합니다.\n- Datum은 `first_fix`, `measured: false`입니다. 지도 사용 시에는 지도 원점과 일치하는\n  측량된 `manual_datum`을 설정해야 합니다.\n- GPS-only `automatic_reset_enabled: false`입니다. 장기 단절 복구 조건은\n  [GPS 문서](gps_quality_and_recovery.md)에 있습니다.\n- IMU는 `one_shot: true`, 보정각 적용 속도 상한 `90.0 deg/s`입니다.\n  직진 구간 선별 조건의 `max_yaw_rate_degps: 3.0`과는 다른 값입니다.\n- 같은 IMU YAML의 `encoder_yaw_hold.enabled: true`로 엔코더 0일 때 yaw를 유지합니다.\n  alive가 갱신되는 0.30초 이내 feedback과 speed=0을 요구하며 비영점 tick은 고정하지 않습니다.\n- 두 EKF는 보정 IMU와 vx·vy=0 제약을 사용합니다. Global GPS 관측은 x/y입니다.\n- GPS 측정 시각의 Local 보간 이력과 Global 지연 재처리 이력은 각각 2초입니다.\n\n## 실행 모드와 인자\n\n| 진입점 | 기본 동작 |\n|---|---|\n| `localization` | 연결된 실센서·위치추정·공통 화면, 기록 끔 |\n| `localization-record` | 센서 확인 후 rosbag 기록 |\n| `map_data_collection.launch` | 실센서·기록 기본 켬 |\n| `replay.launch bag:=...` | 원본 센서 백으로 현재 코드를 재계산, 실장치 드라이버 끔 |\n| `bringup.launch` | IMU·엔코더·GPS 위치 추정 및 RDDF 초기화 |\n| `viewer.launch` | 실행 중인 토픽 또는 지정한 결과 백의 공통 화면 |\n\n센서를 외부 프로세스가 소유하면 `start_encoder_driver`, `start_imu_driver`,\n`start_gps_driver`를 꺼 중복 연결을 막습니다. `start_rviz:=false`로 화면만 끌 수 있습니다.\n`start_recording:=false`는 수집 launch의 기록만 끄며 `localization`은 이를 강제합니다.\n\n`start_supervisor`는 내부 StatusManager와 Coordinator를 함께 제어합니다.\n`start_status_manager`는 기존 호출 호환용 별칭입니다. Supervisor가 꺼지면\n공개 GPS pose와 최종 상태 승인이 없어집니다. `start_calibrated_imu:=false`는\n외부 노드가 같은 보정 IMU 출구를 제공할 때 사용합니다. 구현된 `motion_source`는 `encoder`입니다.\n\n`rviz_config`는 공통 뷰어 YAML 경로를 받는 기존 인자명입니다. 공개 토픽을 바꾸면\n`localization_interfaces.yaml`과 `localization_viewer.yaml`을 함께 조정합니다.\n실제 노드 이름은 launch 인자가 결정합니다. EKF 이름을 바꾸면\n`tf_configuration.yaml`의 동적 TF 소유자도 함께 변경합니다.\n\n파일 교체 인자와 노드 이름 인자는 [bringup.launch](../launch/bringup.launch),\n기록·센서 인자는 [map_data_collection.launch](../launch/map_data_collection.launch),\n재생 입력은 [replay.launch](../launch/replay.launch)가 기준입니다.\n장치 설치는 [udev 안내](../udev/README.md), 지도 준비는 [maps 안내](../maps/README.md)를 참고합니다.","line_count":74,"redacted_lines":[],"functions":[],"params":[]},"src/localization/src/tf/static_transform_publisher.cpp":{"path":"src/localization/src/tf/static_transform_publisher.cpp","sha256":"6b192d7fa4ab414643935c9658ad7806721c9fffcd3c5443069cae32d7e6118b","text":"#include \"static_transform_publisher.hpp\"\n\n#include \u003cstdexcept>\n#include \u003cstring>\n#include \u003cutility>\n\nnamespace mando_localization {\n\nStaticTransformPublisher::StaticTransformPublisher(ros::NodeHandle private_nh) {\n  int schema_version = 0;\n  bool strict_validation = false;\n  if (!private_nh.getParam(\"schema_version\", schema_version) ||\n      schema_version != 1 ||\n      !private_nh.getParam(\"strict_validation\", strict_validation) ||\n      !strict_validation) {\n    throw std::runtime_error(\"TF schema_version=1 및 strict_validation=true가 필요합니다.\");\n  }\n  std::string parameter_name;\n  if (!private_nh.getParam(\"static_transforms_parameter\", parameter_name) ||\n      parameter_name.empty()) {\n    throw std::runtime_error(\"static_transforms_parameter가 필요합니다.\");\n  }\n  const std::vector\u003cStaticTransformSpec> configured =\n      TransformConfiguration::load(private_nh, parameter_name);\n  const std::vector\u003cDynamicTransformSpec> dynamic =\n      TransformConfiguration::loadDynamic(private_nh, \"dynamic_transforms\");\n  TransformConfiguration::validateTree(configured, dynamic);\n\n  const auto required_string = [&private_nh](const std::string& name) {\n    std::string value;\n    if (!private_nh.getParam(name, value) || value.empty()) {\n      throw std::runtime_error(\"필수 TF 문자열 파라미터가 없습니다: \" + name);\n    }\n    return value;\n  };\n  const std::string map_frame = required_string(\"frames/map\");\n  const std::string odom_frame = required_string(\"frames/odom\");\n  const std::string base_frame = required_string(\"frames/base_link\");\n  const std::string base_origin = required_string(\"base_link_reference/origin\");\n  const std::string x_axis = required_string(\"base_link_reference/x_axis\");\n  const std::string y_axis = required_string(\"base_link_reference/y_axis\");\n  const std::string z_axis = required_string(\"base_link_reference/z_axis\");\n  if (x_axis != \"forward\" || y_axis != \"left\" || z_axis != \"up\") {\n    throw std::runtime_error(\n        \"base_link 축은 REP-103의 forward/left/up이어야 합니다.\");\n  }\n  const std::string expected_global_owner =\n      required_string(\"expected_global_owner\");\n  const std::string expected_local_owner =\n      required_string(\"expected_local_owner\");\n  bool found_global = false;\n  bool found_local = false;\n  for (const DynamicTransformSpec& transform : dynamic) {\n    if (transform.parent_frame == map_frame &&\n        transform.child_frame == odom_frame &&\n        transform.owner_node == expected_global_owner) {\n      found_global = true;\n    }\n    if (transform.parent_frame == odom_frame &&\n        transform.child_frame == base_frame &&\n        transform.owner_node == expected_local_owner) {\n      found_local = true;\n    }\n  }\n  if (!found_global || !found_local) {\n    throw std::runtime_error(\n        \"동적 TF owner_node가 launch의 Local/Global EKF 이름과 다릅니다.\");\n  }\n  ROS_INFO_STREAM(\"base_link 기준: origin=\" \u003c\u003c base_origin\n                  \u003c\u003c \", axes=\" \u003c\u003c x_axis \u003c\u003c \"/\" \u003c\u003c y_axis \u003c\u003c \"/\" \u003c\u003c z_axis);\n  const ros::Time stamp = ros::Time::now();\n  for (const StaticTransformSpec& transform : configured) {\n    if (TransformConfiguration::shouldPublish(transform)) {\n      published_transforms_.push_back(TransformConfiguration::toMessage(transform, stamp));\n      ROS_INFO_STREAM(\"정적 TF 발행: \" \u003c\u003c transform.parent_frame \u003c\u003c \" -> \"\n                      \u003c\u003c transform.child_frame \u003c\u003c \" (\" \u003c\u003c transform.calibration_state \u003c\u003c \")\");\n    } else {\n      ROS_WARN_STREAM(\"미측정 또는 비활성 TF는 발행하지 않습니다: \"\n                      \u003c\u003c transform.parent_frame \u003c\u003c \" -> \" \u003c\u003c transform.child_frame);\n    }\n  }\n  if (!published_transforms_.empty()) {\n    broadcaster_.sendTransform(published_transforms_);\n  } else {\n    ROS_WARN(\"발행 가능한 정적 TF가 없습니다. 실측 후 tf_configuration.yaml을 갱신하세요.\");\n  }\n}\n\n}  // namespace mando_localization","line_count":89,"redacted_lines":[],"functions":[],"params":[]},"src/localization/launch.sh":{"path":"src/localization/launch.sh","sha256":"d189759b7489a71872386a6feaf3e1d77f8d081c2b30b61eb6a28fca2a61b890","text":"#!/usr/bin/env bash\nset -eo pipefail\n\n# The workspace bringup starts localization; sensor/vehicle drivers run separately.\n# Estimator, quality gates, TF calibration and fusion defaults remain unchanged.\nexec roslaunch localization localization.launch \\\n  start_encoder_driver:=false \\\n  start_imu_driver:=false \\\n  start_gps_driver:=false \\\n  start_rviz:=false \\\n  \"$@\"","line_count":11,"redacted_lines":[],"functions":[],"params":[]},"src/localization/launch/gps_fusion.launch":{"path":"src/localization/launch/gps_fusion.launch","sha256":"2e3b5770c77e791a9e9b6fc87995d0ae4556d1c482f3977e2cc457b4366f5a6c","text":"\u003claunch>\n  \u003carg name=\"start_sensor_timing_monitor\" default=\"true\"/>\n  \u003carg name=\"start_rddf_initialization\" default=\"false\"/>\n  \u003carg name=\"rddf_initialization_config\" default=\"$(find mando_localization)/config/rddf_initialization.yaml\"/>\n  \u003carg name=\"enable_gps_fusion\" default=\"true\"/>\n  \u003carg name=\"interfaces_config\" default=\"$(find mando_localization)/config/localization_interfaces.yaml\"/>\n  \u003carg name=\"gps_reference_config\" default=\"$(find mando_localization)/config/gps_reference.yaml\"/>\n  \u003carg name=\"status_policy_config\" default=\"$(find mando_localization)/config/status_policy.yaml\"/>\n  \u003carg name=\"gps_quality_gate_node_name\" default=\"odometry_gps_fusion\"/>\n  \u003carg name=\"time_sync_config\" default=\"$(find mando_localization)/config/time_sync.yaml\"/>\n  \u003carg name=\"gps_driver_config\" default=\"$(find mando_localization)/config/gps_driver.yaml\"/>\  const ancestors=chain(active).map(l=>l.id),ids=[];
 for(const id of ROOT_NAV){ids.push(id);if(id==='localization'&&ancestors.includes(id)&&!ancestors.includes('operations'))ids.push('motion','gps','filters','rddf','timing','safety');if(id==='operations'&&ancestors.includes(id))ids.push('tf','launches','viewer')}
 $('tree').innerHTML=ids.map(id=>`<button data-view="${id}" class="${ROOT_NAV.includes(id)?'':'sub'}">${escapeHTML(NAV_LABELS[id]||layers[id].title)}</button>`).join('');
}
$('tree').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)route(b.dataset.view)});
$('counts').innerHTML=`<strong>${Object.keys(layers).length}</strong>개 아키텍처<br><strong>${Object.values(layers).reduce((s,l)=>s+l.nodes.length,0)}</strong>개 구성요소 · <strong>${Object.keys(DATA.sources).length}</strong>개 소스<br><br>하위 구조 → 함수·조건 → 설정과 원문<br>파일을 이동해도 탐색·소스 확인은 오프라인으로 동작합니다.`;
function renderRoute(){
 const p=new URLSearchParams(location.hash.slice(1));active=layers[p.get('view')]?p.get('view'):'system';
 const L=layers[active];renderTree();if($('modal').open)$('modal').close();
 $('view-title').textContent=L.title;document.title=L.title+' · HL-FMA2026 아키텍처';
 $('breadcrumbs').innerHTML=chain(active).map(l=>`<button data-crumb="${l.id}">${escapeHTML(l.title)}</button>`).join('<span aria-hidden="true">›</span>');
 $('breadcrumbs').querySelectorAll('button').forEach(b=>b.onclick=()=>route(b.dataset.crumb));
 document.querySelectorAll('#tree button').forEach(b=>{b.classList.toggle('active',b.dataset.view===active);if(b.dataset.view===active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 $('level').textContent=`LEVEL ${chain(active).length-1} · ${L.nodes.length}개 구성요소 · ${L.edges.length}개 관계`;
 $('original').href=`system-detail/${active}.html`;$('diagram').innerHTML=DATA.diagrams[active];
 const svg=$('diagram').querySelector('svg');svg.setAttribute('lang','ko');svg.setAttribute('aria-label',L.title);svg.removeAttribute('aria-labelledby');
 for(const g of svg.querySelectorAll('g[data-edge-id]')){
  const text=g.querySelector('text'),mask=g.querySelector('rect');if(text&&mask){const box=text.getBBox();mask.setAttribute('x',box.x-5);mask.setAttribute('y',box.y-2);mask.setAttribute('width',box.width+10);mask.setAttribute('height',box.height+4)}
 }
 for(const node of L.nodes){
  const g=svg.querySelector(`[data-node-id="${node.id}"]`);if(!g)throw new Error('Missing rendered node '+node.id);
  g.setAttribute('aria-label',`${node.label}: ${node.target?'내부 아키텍처 열기':'함수·소스 설명 열기'}`);g.removeAttribute('aria-pressed');
  if(/설계|뼈대/.test(node.state))g.classList.add('node-planned');
  const hint=document.createElementNS('http://www.w3.org/2000/svg','text');hint.setAttribute('x',node.pos[0]+125);hint.setAttribute('y',node.pos[1]+79);hint.setAttribute('text-anchor','middle');hint.setAttribute('class','drill-hint');hint.textContent=node.target?'내부 구조 열기  ↗':'함수 · 설정 · 소스  ↗';g.appendChild(hint);
  const go=()=>node.target?route(node.target):route(active,{node:node.id});g.addEventListener('click',go);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
 }
 $('note').textContent=L.note||'각 노드에서 역할·입출력·설정값과 줄 번호가 있는 소스 원문을 확인할 수 있습니다.';
 if(p.get('file')&&DATA.sources[p.get('file')])showSource(p.get('file'),Number(p.get('line'))||1);
 else if(p.get('node')){const node=L.nodes.find(n=>n.id===p.get('node'));if(node)showNode(node)}
 else if(p.get('panel')==='components')showComponents();else if(p.get('panel')==='usage')showUsage();
}
function openModal(title,kicker,html){restoreFocus=document.activeElement;$('modal-title').textContent=title;$('modal-kicker').textContent=kicker;$('modal-body').innerHTML=html;if(!$('modal').open)$('modal').showModal();$('modal').scrollTop=0;}
function closeModal(){route(active);if(restoreFocus&&restoreFocus.isConnected)restoreFocus.focus()}
$('close').onclick=closeModal;$('modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});$('modal').addEventListener('click',e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
function fileButton(source){const f=DATA.sources[source.path];return `<button class="file-button" data-file="${escapeHTML(source.path)}" data-line="${source.line}">${escapeHTML(source.path)}:${source.line}<small>${f.line_count}줄 · SHA-256 ${f.sha256.slice(0,16)}…${f.redacted_lines.length?' · 인증 설정 줄 생략':''}</small></button>`;}
function bindFiles(){document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>route(active,{file:b.dataset.file,line:b.dataset.line||1}));}
function showNode(node){
 const L=layers[active],related=L.edges.filter(e=>e.from===node.id||e.to===node.id);
 let html=`<p class="summary">${escapeHTML(node.summary)}</p><span class="pill">${escapeHTML(node.state)}</span>`;
 if(node.target)html+=` <button id="drill">내부 아키텍처 열기 ↗</button>`;
 if(node.io.length)html+='<h3>공개 입출력</h3><p>'+node.io.map(escapeHTML).join('<br>')+'</p>';
 if(related.length)html+='<h3>이 화면에서 확인한 관계</h3><div class="relations">'+related.map(e=>`<button data-neighbor="${e.from===node.id?e.to:e.from}">${escapeHTML(L.nodes.find(n=>n.id===e.from).label)} → ${escapeHTML(L.nodes.find(n=>n.id===e.to).label)} · ${escapeHTML(e.label)}${e.variant==='dashed'?' [설계]':''}</button>`).join('')+'</div>';
 html+='<h3>소스 근거와 전체 함수 목록</h3><div class="files">'+node.sources.map(fileButton).join('')+'</div>';
 for(const ref of node.sources){const f=DATA.sources[ref.path];if(f.params.length)html+=`<details><summary>${escapeHTML(ref.path.split('/').pop())} · 설정 ${f.params.length}개</summary><div class="table-wrap"><table><thead><tr><th>설정 키</th><th>현재 값</th></tr></thead><tbody>${f.params.map(([k,v])=>`<tr><td>${escapeHTML(k)}</td><td>${escapeHTML(JSON.stringify(v))}</td></tr>`).join('')}</tbody></table></div></details>`;else if(f.functions.length)html+=`<details><summary>${escapeHTML(ref.path.split('/').pop())} · 함수/클래스 ${f.functions.length}개</summary><div class="functions">${f.functions.map(fn=>`<button data-file="${escapeHTML(ref.path)}" data-line="${fn.line}">L${fn.line} ${escapeHTML(fn.label)}</button>`).join('')}</div></details>`;}
 openModal(node.label,L.title+' / '+node.sublabel,html);bindFiles();if($('drill'))$('drill').onclick=()=>route(node.target);document.querySelectorAll('[data-neighbor]').forEach(b=>b.onclick=()=>route(active,{node:b.dataset.neighbor}));
}
function showSource(path,line){const source=DATA.sources[path];line=Math.min(source.line_count,Math.max(1,line));openModal(path.split('/').pop(),'소스 스냅샷 · '+path,`<p class="muted">현재 작업 파일의 정적 스냅샷 · ${source.line_count}줄${source.redacted_lines.length?' · 인증 관련 설정 줄 생략':''}<br>SHA-256 <code>${source.sha256}</code></p><button id="source-back">← 구성요소로 돌아가기</button><div class="code" aria-label="줄 번호가 있는 소스">${source.text.split('\n').map((text,i)=>`<span class="line ${i+1===line?'highlight':''}" id="source-line-${i+1}" data-line="${i+1}">${escapeHTML(text)||' '}</span>`).join('')}</div>`);$('source-back').onclick=()=>history.back();requestAnimationFrame(()=>document.getElementById('source-line-'+line)?.scrollIntoView({block:'center'}));}
function showComponents(){openModal(layers[active].title,'구성요소 목록 · 역할과 하위 구조',`<div class="component-list">${layers[active].nodes.map(n=>`<article><h3>${escapeHTML(n.label)}</h3><span class="pill">${escapeHTML(n.state)}</span><p>${escapeHTML(n.summary)}</p><button data-detail="${n.id}">함수·설정·소스</button>${n.target?`<button data-drill="${n.target}">내부 구조 ↗</button>`:''}</article>`).join('')}</div>`);document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>route(active,{node:b.dataset.detail}));document.querySelectorAll('[data-drill]').forEach(b=>b.onclick=()=>route(b.dataset.drill));}
function showUsage(){const u=DATA.usage;openModal('로컬 Qwen 사용·튜닝 기록','실측과 추정의 구분',`<div class="stat-row"><div class="stat"><b>${u.calls}</b>아키텍처 요약 요청</div><div class="stat"><b>${u.local_prompt_tokens.toLocaleString()}</b>로컬 입력 토큰 · 실측</div><div class="stat"><b>${u.local_generated_tokens.toLocaleString()}</b>로컬 생성 토큰 · 실측</div></div><p>${escapeHTML(u.description)}</p><table><tr><th>측정 항목</th><th>값</th></tr><tr><td>원문 → 요약 JSON 입력 감소량</td><td>${u.gross_proxy.toLocaleString()} 토큰 (o200k_base 대리 지표)</td></tr><tr><td>명시적 재검토 원문을 차감한 값</td><td>${u.review_adjusted_proxy.toLocaleString()} 토큰</td></tr><tr><td>실제 OpenAI 청구 절감량</td><td>측정 불가 · 추론·조율·검증·캐시·최종 작성 비용 미포함</td></tr><tr><td>기본 컨텍스트</td><td>8,192 · 긴 입력은 16,384 명시 선택</td></tr></table><h3>기록 파일</h3><p><a href="system-detail/usage/REPORT.md" target="_blank">사용량·방법·튜닝 보고서 ↗</a> · <a href="system-detail/usage/qwen-calls.jsonl" target="_blank">호출 원장 ↗</a> · <a href="system-detail/usage/context-benchmark.json" target="_blank">메모리·컨텍스트 실측 ↗</a></p><p class="muted">로컬 모델 토큰과 OpenAI 토큰은 같은 단위로 간주하지 않습니다. 설정 비교 시험은 별도 비용으로 기록하며 절감으로 세지 않습니다.</p>`)}
$('components').onclick=()=>route(active,{panel:'components'});$('usage').onclick=()=>route(active,{panel:'usage'});$('back').onclick=()=>{if(history.length>1)history.back();else route(layers[active].parent||'system')};
let searchTimer;
$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{const q=$('search').value.trim().toLowerCase();if(!q){$('search-results').innerHTML='';return}const results=[];for(const L of Object.values(layers)){if(L.title.toLowerCase().includes(q))results.push({view:L.id,title:L.title,sub:'아키텍처 화면'});for(const n of L.nodes){if([n.label,n.sublabel,n.summary,...n.io,...n.sources.map(s=>s.path)].join(' ').toLowerCase().includes(q))results.push({view:L.id,node:n.id,title:n.label,sub:L.title+' / '+n.sublabel})}}for(const [path,s] of Object.entries(DATA.sources)){for(const fn of s.functions){if(fn.label.toLowerCase().includes(q))results.push({view:active,file:path,line:fn.line,title:fn.label,sub:path+':'+fn.line})}}$('search-results').innerHTML=results.length?results.slice(0,24).map((r,i)=>`<button class="result" data-result="${i}">${escapeHTML(r.title)}<small>${escapeHTML(r.sub)}</small></button>`).join(''):'<div class="empty">일치하는 구성요소가 없습니다.</div>';$('search-results').querySelectorAll('button').forEach(b=>b.onclick=()=>{const r=results[Number(b.dataset.result)],extra={};for(const k of ['node','file','line'])if(r[k])extra[k]=r[k];$('search-results').innerHTML='';$('search').value='';route(r.view,extra)});},100)});
$('search').addEventListener('keydown',e=>{if(e.key==='Escape'){$('search-results').innerHTML='';$('search').value=''}if(e.key==='ArrowDown')$('search-results').querySelector('button')?.focus()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&!$('modal').open){e.preventDefault();$('search').focus()}});
window.addEventListener('hashchange',renderRoute);renderRoute();
</script></body></html>
