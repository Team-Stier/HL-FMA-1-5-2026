# TEST ONLY: 실행 시 현재 차량 위치를 (0, 0)으로 만드는 합성/수동 시험 설정.
topics:
  gps_fix: /localization/synthetic/input/gps_fix
  gps_status: /localization/synthetic/input/gps_status
  imu: /localization/synthetic/input/imu
  encoder: /localization/synthetic/input/encoder
  current_pose: /localization/synthetic/current_pos
  local_odometry: /localization/synthetic/local_odometry
  global_odometry: /localization/synthetic/global_odometry
  local_path: /localization/synthetic/local_path
  global_path: /localization/synthetic/global_path
  vehicle_marker: /localization/synthetic/vehicle_marker
  diagnostics: /localization/synthetic/diagnostics
  status_markers: /localization/synthetic/status_markers

frames:
  gps: gps_link
  imu: imu_link
  output: map
  odom: odom
  base: synthetic_base_link

operation:
  allow_unmeasured_test_mode: true

reference:
  mode: first_fix
  measured: false
  measured_at: ""
  source: test_first_valid_fix
  latitude_deg: 0.0
  longitude_deg: 0.0
  altitude_m: 0.0
  map_x_m: 0.0
  map_y_m: 0.0
  map_z_m: 0.0
  # map_xy = R(yaw_offset_rad) * ENU_xy, yaw_map = yaw_enu + yaw_offset_rad
  yaw_offset_rad: 0.0

extrinsics:
  # TEST ONLY placeholders. 실차 장착 위치/방향을 측정한 값이 아니다.
  gps_translation_base_m: [0.0, 0.0, 0.0]
  # planar 전용: imu_yaw_offset = yaw_base - yaw_imu.
  imu_yaw_offset_rad: 0.0
  calibration_state: unmeasured

quality:
  gps_fix_max_age_sec: 1.0
  gps_status_timeout_sec: 1.0
  imu_timeout_sec: 0.20
  max_future_stamp_sec: 0.10
  max_status_fix_skew_sec: 0.50
  max_imu_fix_skew_sec: 0.20
  quaternion_norm_tolerance: 0.05
  max_imu_orientation_variance_rad2: 1.0
  allow_unknown_imu_orientation_covariance: false
  allowed_solutions: [2, 3, 4, 5, 7]
  allowed_fix_types: [3, 4]
  require_nav_status: true
  allowed_spoofing_states: [1]
  min_satellites_used: 6
  max_horizontal_accuracy_m: 5.0
  max_vertical_accuracy_m: 10.0
  max_navsat_horizontal_variance_m2: 25.0
  required_consecutive_fixes: 3
  # TEST에서도 마지막 승인 위치 기준 jump gate를 유지한다.
  max_step_distance_m: 50.0
  reset_gap_sec: 2.0

motion:
  feedback_timeout_sec: 0.50
  encoder_calibrated: true
  encoder_meters_per_tick: 0.01
  encoder_sign: 1.0
  # synthetic_localization_debug.py는 누적 이동 count를 발행한다.
  encoder_value_mode: cumulative_count
  encoder_modulus: 0
  encoder_direction_mode: signed_ticks
  forward_gear_values: [0]
  reverse_gear_values: [2]
  neutral_gear_values: [1]
  max_encoder_delta_ticks: 1000
  min_feedback_dt_sec: 0.001
  max_feedback_dt_sec: 0.50
  max_encoder_speed_mps: 10.0
  max_gps_local_sync_sec: 0.30
  local_history_duration_sec: 5.0
  max_global_dead_reckoning_sec: 2.0
  publish_tf: true
  local_position_variance_m2: 0.01
  global_position_variance_m2: 0.04

output:
  planar_mode: true
  path_max_poses: 2000

visualization:
  vehicle_length_m: 1.35
  vehicle_width_m: 0.85
  vehicle_outline_width_m: 0.05
  status_rate_hz: 5.0
  status_frame: map
  output_timeout_sec: 1.0
  marker_x_m: -6.0
  marker_y_m: 5.0
  marker_z_m: 0.5
  marker_line_spacing_m: 0.7
  marker_text_height_m: 0.45
  marker_lifetime_sec: 0.6
  banner: SYNTHETIC TEST ONLY
